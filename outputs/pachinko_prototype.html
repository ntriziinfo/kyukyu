<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パチンコ救急隊</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7fbff;
      --muted: #a9b7c6;
      --panel: rgba(10, 18, 26, .82);
      --line: rgba(255, 255, 255, .16);
      --gold: #ffd36a;
      --cyan: #66e3ff;
      --rose: #ff6f9f;
      --bg: #080d12;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 18% 20%, rgba(102, 227, 255, .20), transparent 26rem),
        linear-gradient(145deg, #0c1117 0%, #13171d 44%, #080d12 100%);
      color: var(--ink);
      font-family: "Segoe UI", "Noto Sans JP", system-ui, sans-serif;
      letter-spacing: 0;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: min(1320px, calc(100vw - 16px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 16px 0;
      display: grid;
      grid-template-columns: minmax(360px, 840px) minmax(260px, 360px);
      gap: 12px;
      align-items: stretch;
    }

    .machine {
      position: relative;
      height: min(980px, calc(100vh - 20px));
      min-height: 760px;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 42px 42px 28px 28px;
      background:
        radial-gradient(ellipse at 50% 40%, rgba(102, 227, 255, .14), transparent 42%),
        radial-gradient(ellipse at 50% 8%, rgba(255, 255, 255, .18), transparent 28%),
        linear-gradient(160deg, rgba(255, 255, 255, .12), transparent 24%),
        linear-gradient(22deg, rgba(255, 211, 106, .08), transparent 52%),
        #121923;
      box-shadow:
        0 22px 70px rgba(0, 0, 0, .46),
        inset 0 0 0 5px rgba(255, 255, 255, .05),
        inset 0 0 0 18px rgba(0, 0, 0, .14);
      overflow: hidden;
    }

    .machine::before,
    .machine::after {
      content: "";
      position: absolute;
      pointer-events: none;
      z-index: 3;
      display: block;
    }

    .machine::before {
      inset: 94px 16px 16px;
      border-radius: 48% 48% 44% 44% / 38% 38% 46% 46%;
      border: 1px solid rgba(210, 244, 255, .24);
      background:
        linear-gradient(112deg, rgba(255, 255, 255, .24), transparent 18%, transparent 68%, rgba(102, 227, 255, .10)),
        linear-gradient(24deg, transparent 28%, rgba(255, 255, 255, .08) 29%, transparent 34%);
      box-shadow:
        inset 0 0 0 9px rgba(255, 255, 255, .035),
        inset 0 0 38px rgba(180, 240, 255, .12),
        0 0 32px rgba(102, 227, 255, .08);
      mix-blend-mode: screen;
    }

    .machine::after {
      left: 14%;
      right: 14%;
      top: 112px;
      height: 18%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, .22), transparent 72%);
      filter: blur(.2px);
      opacity: .42;
      mix-blend-mode: screen;
    }

    .marquee {
      position: absolute;
      inset: 12px 12px auto;
      height: 72px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(6, 10, 15, .74);
      z-index: 4;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 4.8vw, 42px);
      line-height: 1;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 18px rgba(102, 227, 255, .46), 0 2px 0 #000;
    }

    .status {
      display: grid;
      grid-template-columns: repeat(3, auto);
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .pill {
      display: inline-grid;
      grid-auto-flow: column;
      gap: 6px;
      align-items: center;
      min-height: 30px;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .06);
    }

    .pill strong {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    canvas {
      position: absolute;
      inset: 96px 12px 12px;
      width: calc(100% - 24px);
      height: calc(100% - 108px);
      border-radius: 40px 40px 24px 24px;
      background:
        radial-gradient(circle at center 42%, rgba(102, 227, 255, .10), transparent 34%),
        linear-gradient(#162334, #0b1118 70%);
      box-shadow:
        inset 0 0 38px rgba(0, 0, 0, .64),
        inset 0 0 0 12px rgba(255, 255, 255, .025),
        inset 0 0 34px rgba(180, 240, 255, .09);
      touch-action: none;
    }

    .launch-handle {
      position: absolute;
      right: 22px;
      bottom: 22px;
      z-index: 5;
      width: clamp(112px, 17vw, 148px);
      aspect-ratio: 1;
      border: 1px solid rgba(255, 211, 106, .38);
      border-radius: 50%;
      background:
        radial-gradient(circle at 36% 30%, rgba(255, 255, 255, .55), transparent 12%),
        radial-gradient(circle at 50% 50%, #414955 0 22%, #202a36 23% 45%, #111820 46% 65%, #080c11 66%);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .45), inset 0 0 0 7px rgba(255, 255, 255, .06), inset 0 0 24px rgba(255, 211, 106, .18);
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .launch-handle:active,
    .launch-handle.active {
      cursor: grabbing;
      box-shadow: 0 0 34px rgba(255, 211, 106, .44), 0 12px 30px rgba(0, 0, 0, .45), inset 0 0 0 7px rgba(255, 255, 255, .08);
    }

    .handle-knob {
      position: absolute;
      inset: 13%;
      border-radius: 50%;
      background:
        conic-gradient(from -80deg, rgba(255, 211, 106, .2), rgba(102, 227, 255, .22), rgba(255, 111, 159, .18), rgba(255, 211, 106, .2)),
        radial-gradient(circle at 50% 50%, #242d39, #0a0f15 70%);
      border: 1px solid rgba(255, 255, 255, .20);
    }

    .handle-needle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 9%;
      height: 39%;
      border-radius: 999px;
      transform: translate(-50%, -92%) rotate(0deg);
      transform-origin: 50% 92%;
      background: linear-gradient(#fff4c2, #ffb337);
      box-shadow: 0 0 16px rgba(255, 211, 106, .55);
    }

    .handle-center {
      position: absolute;
      inset: 34%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #ffffff, #ffd36a 32%, #955c14 100%);
      border: 1px solid rgba(255, 255, 255, .35);
      box-shadow: 0 4px 14px rgba(0, 0, 0, .36);
    }

    .handle-power {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      min-width: 54px;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .58);
      border: 1px solid rgba(255, 255, 255, .18);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }

    .side {
      height: min(900px, calc(100vh - 32px));
      min-height: 720px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 12px;
      overflow: hidden;
    }

    .screen,
    .controls,
    .history,
    .meters {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 16px 42px rgba(0, 0, 0, .30);
    }

    .screen {
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .machine .screen {
      position: absolute;
      left: calc(12px + (100% - 24px) * 244 / 720);
      top: calc(96px + (100% - 108px) * 318 / 900);
      z-index: 4;
      width: calc((100% - 24px) * 232 / 720);
      height: calc((100% - 108px) * 174 / 900);
      padding: 0;
      transform: none;
      cursor: zoom-in;
      transition: width .22s ease, height .22s ease, left .22s ease, top .22s ease, transform .22s ease, box-shadow .22s ease;
    }

    .machine .screen.zoomed {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 30;
      width: min(860px, calc(100vw - 28px));
      height: auto;
      padding: 10px;
      max-height: calc(100vh - 28px);
      transform: translate(-50%, -50%);
      cursor: zoom-out;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, .62), 0 18px 80px rgba(102, 227, 255, .30);
    }

    .machine .screen .message {
      display: none;
    }

    .machine .screen.zoomed .message {
      min-height: 42px;
      font-size: 18px;
    }

    .lcd {
      min-height: 178px;
      border-radius: 8px;
      border: 1px solid rgba(102, 227, 255, .32);
      background:
        linear-gradient(135deg, rgba(102, 227, 255, .18), transparent 42%),
        radial-gradient(circle at 74% 18%, rgba(255, 111, 159, .16), transparent 34%),
        #08131d;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }

    .machine .lcd {
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    .machine .screen.zoomed .lcd {
      min-height: min(48vh, 430px);
    }

    .lcd::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, .055) 1px, transparent 1px, transparent 5px);
      pointer-events: none;
      opacity: .45;
    }

    .reels {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, 72px);
      gap: 8px;
    }

    .reel {
      height: 92px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .24);
      background: linear-gradient(#fdf7d8, #dfe8f2 48%, #f9fdff);
      color: #111827;
      display: grid;
      place-items: center;
      font-size: 42px;
      font-weight: 900;
      box-shadow: inset 0 -8px 18px rgba(0, 0, 0, .18);
      font-variant-numeric: tabular-nums;
    }

    .reel.spin {
      animation: flick .16s steps(2) infinite;
    }

    @keyframes flick {
      50% {
        filter: hue-rotate(90deg) brightness(1.25);
        transform: translateY(1px);
      }
    }

    .message {
      min-height: 44px;
      color: var(--ink);
      font-weight: 800;
      text-align: center;
      line-height: 1.35;
    }

    .controls {
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .handle-row {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      gap: 10px;
      align-items: center;
    }

    .handle-row {
      display: none;
    }

    .icon-btn,
    .main-btn {
      border: 1px solid rgba(255, 255, 255, .20);
      border-radius: 8px;
      color: var(--ink);
      background: linear-gradient(180deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .04));
      cursor: pointer;
      user-select: none;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    .main-btn {
      min-height: 54px;
      font-size: 18px;
      font-weight: 900;
      background: linear-gradient(180deg, #ffd36a, #d48219);
      color: #1f1300;
      box-shadow: 0 8px 22px rgba(255, 160, 51, .24);
    }

    .speed-btn {
      min-height: 42px;
      border: 1px solid rgba(255, 255, 255, .20);
      border-radius: 8px;
      color: var(--ink);
      background: linear-gradient(180deg, rgba(102, 227, 255, .20), rgba(255, 255, 255, .05));
      cursor: pointer;
      font-weight: 900;
    }

    .speed-btn.active {
      border-color: rgba(255, 211, 106, .70);
      background: linear-gradient(180deg, #66e3ff, #287eb2);
      color: #031019;
      box-shadow: 0 0 24px rgba(102, 227, 255, .25);
    }

    .main-btn:active,
    .icon-btn:active,
    .speed-btn:active {
      transform: translateY(1px);
    }

    .pin-tools {
      display: grid;
      gap: 8px;
    }

    #multiMove,
    #addAcrylic,
    #addCurve {
      display: none;
    }

    .pin-tools-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .pin-tools select,
    .pin-tools textarea {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, .20);
      border-radius: 8px;
      background: rgba(6, 10, 15, .72);
      color: var(--ink);
      padding: 8px;
    }

    .pin-tools textarea {
      min-height: 96px;
      resize: vertical;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 11px;
    }

    .range {
      width: 100%;
      accent-color: var(--gold);
    }

    .setting-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      background: rgba(255, 255, 255, .055);
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .setting-row output {
      color: var(--gold);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .meters {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .meter {
      min-height: 58px;
      padding: 9px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .055);
      border: 1px solid rgba(255, 255, 255, .10);
    }

    .meter span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .meter strong {
      display: block;
      margin-top: 3px;
      font-size: 22px;
      font-variant-numeric: tabular-nums;
    }

    .history {
      padding: 12px;
      overflow: hidden;
    }

    .history h2 {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .log {
      height: 100%;
      min-height: 0;
      max-height: none;
      overflow: auto;
      display: grid;
      align-content: start;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .log p {
      margin: 0;
      padding: 7px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, .045);
    }

    .hit {
      color: var(--gold);
    }

    .fever {
      animation: fever 1.1s ease-in-out infinite;
    }

    @keyframes fever {
      50% {
        box-shadow: 0 0 38px rgba(255, 211, 106, .62), inset 0 0 38px rgba(255, 111, 159, .34);
      }
    }

    @media (max-width: 860px) {
      .app {
        grid-template-columns: 1fr;
      }

      .machine {
        height: 680px;
        min-height: 680px;
      }

      .side {
        height: auto;
        min-height: auto;
        overflow: visible;
      }

      .machine .screen {
        width: calc((100% - 24px) * 232 / 720);
      }
    }

    @media (max-width: 560px) {
      .app {
        width: min(100vw - 14px, 1180px);
        padding: 7px 0;
        gap: 8px;
      }

      .machine {
        height: 610px;
        min-height: 610px;
      }

      .marquee {
        height: 86px;
        grid-template-columns: 1fr;
        gap: 6px;
        align-content: center;
      }

      .status {
        grid-template-columns: repeat(3, 1fr);
        font-size: 11px;
      }

      .pill {
        min-width: 0;
        justify-content: center;
        padding-inline: 5px;
      }

      canvas {
        inset-top: 104px;
        height: calc(100% - 116px);
      }

      .launch-handle {
        right: 16px;
        bottom: 16px;
        width: 108px;
      }

      .machine .screen {
        top: calc(104px + (100% - 116px) * 318 / 900);
        width: calc((100% - 24px) * 232 / 720);
        padding: 0;
      }

      .machine .screen.zoomed {
        width: calc(100vw - 18px);
      }

      .reels {
        grid-template-columns: repeat(3, minmax(58px, 68px));
      }

      .reel {
        height: 82px;
        font-size: 36px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="machine" id="machine">
      <div class="marquee">
        <h1>パチンコ救急隊</h1>
        <div class="status" aria-live="polite">
          <span class="pill">持ち玉 <strong id="balls">250</strong></span>
          <span class="pill">損益 <strong id="payout">0</strong></span>
          <span class="pill">総回転 <strong id="spins">0</strong></span>
        </div>
      </div>
      <canvas id="board" width="720" height="900" aria-label="パチンコ盤面"></canvas>
      <section class="screen" id="centerScreen" role="button" tabindex="0" aria-expanded="false" title="液晶ズーム">
        <div class="lcd" id="lcd">
          <div class="reels" aria-live="polite">
            <div class="reel" id="r0">7</div>
            <div class="reel" id="r1">3</div>
            <div class="reel" id="r2">5</div>
          </div>
        </div>
        <div class="message" id="message">AUTOで打ち出し</div>
      </section>
      <div class="launch-handle" id="launchHandle" role="button" tabindex="0" aria-label="AUTO打ち出し" aria-pressed="false">
        <div class="handle-knob"></div>
        <div class="handle-needle" id="handleNeedle"></div>
        <div class="handle-center"></div>
        <div class="handle-power" id="handlePower">AUTO</div>
      </div>
    </section>

    <aside class="side">
      <section class="controls">
        <div class="handle-row">
          <button class="icon-btn" id="down" title="弱い">-</button>
          <input class="range" id="power" type="range" min="32" max="92" value="58" aria-label="打ち出し強さ">
          <button class="icon-btn" id="up" title="強い">+</button>
        </div>
        <label class="setting-row">
          <span>釘設定</span>
          <input class="range" id="nailSetting" type="range" min="1" max="6" value="3" step="1" aria-label="釘設定">
          <output id="nailSettingValue">3 / 20回</output>
        </label>
        <button class="main-btn" id="fire">AUTO START</button>
        <button class="speed-btn" id="speedMode" aria-pressed="false">SPEED x5 OFF</button>
        <div class="pin-tools">
          <button class="speed-btn" id="pinEdit" aria-pressed="false">PIN EDIT OFF</button>
          <select id="pinKind" aria-label="pin kind">
            <option value="normal">normal</option>
            <option value="road">road</option>
            <option value="spill">spill</option>
            <option value="heso">heso</option>
            <option value="attacker">attacker</option>
            <option value="hot">hot</option>
            <option value="warp">warp</option>
          </select>
          <output id="pinInfo" class="pill">PIN -</output>
          <button class="speed-btn" id="multiMove" aria-pressed="false">MULTI MOVE OFF</button>
          <select id="hitTarget" aria-label="hit area target">
            <option value="lcd">液晶</option>
            <option value="pocket:0">START</option>
            <option value="pocket:1">アタッカー</option>
            <option value="pocket:2">OUT</option>
            <option value="rightDevice">右役物</option>
            <option value="windmill">風車</option>
            <option value="push">PUSH</option>
            <option value="handle">ハンドル</option>
          </select>
          <label class="setting-row">
            <span>X</span>
            <input class="range" id="hitX" type="range" min="0" max="720" value="360" step="1" aria-label="hit x">
            <output id="hitXValue">360</output>
          </label>
          <label class="setting-row">
            <span>Y</span>
            <input class="range" id="hitY" type="range" min="0" max="900" value="450" step="1" aria-label="hit y">
            <output id="hitYValue">450</output>
          </label>
          <label class="setting-row">
            <span>R</span>
            <input class="range" id="hitR" type="range" min="4" max="140" value="30" step="1" aria-label="hit radius">
            <output id="hitRValue">30</output>
          </label>
          <label class="setting-row">
            <span>W</span>
            <input class="range" id="hitW" type="range" min="20" max="700" value="120" step="1" aria-label="hit width">
            <output id="hitWValue">120</output>
          </label>
          <label class="setting-row">
            <span>H</span>
            <input class="range" id="hitH" type="range" min="20" max="520" value="120" step="1" aria-label="hit height">
            <output id="hitHValue">120</output>
          </label>
          <div class="pin-tools-row">
            <button class="speed-btn" id="pinCopy">COPY JSON</button>
            <button class="speed-btn" id="pinApply">APPLY JSON</button>
          </div>
          <div class="pin-tools-row">
            <button class="speed-btn" id="saveDefault">SAVE DEFAULT</button>
            <button class="speed-btn" id="clearDefault">CLEAR DEFAULT</button>
          </div>
          <div class="pin-tools-row">
            <button class="speed-btn" id="addAcrylic">ADD ACRYLIC</button>
            <button class="speed-btn" id="addCurve">ADD CURVE</button>
          </div>
          <textarea id="pinJson" spellcheck="false" placeholder="PIN JSON"></textarea>
        </div>
      </section>

      <section class="meters">
        <div class="meter"><span>入賞率</span><strong id="rate">0%</strong></div>
        <div class="meter"><span>大当たり</span><strong id="jackpots">0</strong></div>
        <div class="meter"><span>現在状態</span><strong id="mode">通常</strong></div>
        <div class="meter"><span>ラウンド</span><strong id="rounds">0</strong></div>
      </section>

      <section class="history">
        <h2>履歴</h2>
        <div class="log" id="log"></div>
      </section>
    </aside>
  </main>

  <script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const machine = document.getElementById("machine");
    const els = {
      balls: document.getElementById("balls"),

    function fitCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(320, Math.floor(rect.width * dpr));
      canvas.height = Math.max(480, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function sx(x) {
      return x / 720 * canvas.clientWidth;
    }

    function sy(y) {
      return y / 900 * canvas.clientHeight;
    }

    function lcdBlock() {
      const lcd = hitAreas.lcd;
      return {
        left: sx(lcd.x),
        top: sy(lcd.y),

        bottom: sy(lcd.y + lcd.h)
      };
    }

    function isJackpotActive() {

    function autoShotPower(rightShot = isJackpotActive()) {
      return rightShot ? 88 : 62;

    function nailVarianceFor(setting) {
      if (state.nailVariance[setting] == null) {
        state.nailVariance[setting] = Math.round((Math.random() * 4 - 2) * 10) / 10;
      }
      return state.nailVariance[setting];
    }

    function currentNailSetting() {
      const base = nailSettingTable[state.nailSetting] || nailSettingTable[3];
      const spinsPer250 = Math.max(1, Math.round((base.spinsPer250 + nailVarianceFor(state.nailSetting)) * 10) / 10);
      return {
        ...base,
        baseSpinsPer250: base.spinsPer250,
        variance: Math.round((spinsPer250 - base.spinsPer250) * 10) / 10,
        spinsPer250,
        startPerBall: spinsPer250 / 250
      };
    }

    function updateNailSettingUi() {
      state.nailSetting = Math.max(1, Math.min(6, Number(els.nailSetting?.value || state.nailSetting || 3)));
      const setting = currentNailSetting();
      const sign = setting.variance >= 0 ? "+" : "";
      if (els.nailSettingValue) els.nailSettingValue.textContent = `${state.nailSetting} / ${setting.spinsPer250}蝗・(${sign}${setting.variance})`;
    }

    function spawnBall() {
      if (!isJackpotActive() && state.pendingStarts >= maxHolds) {
        pauseAutoForHold();
        return;
      }
      if (state.balls <= 0) {
        message("持ち玉がありません。リセットで再試行。");
        return;
      }
      state.balls--;
      state.fired++;
      state.balance--;
      const rightShot = isJackpotActive();
      const power = autoShotPower(rightShot);
      if (!rightShot) state.startMeter += currentNailSetting().startPerBall * startRouteCompensation;
      const startEligible = !rightShot && state.startMeter >= 1;
      if (startEligible) state.startMeter -= 1;
      const launch = hitAreas.launch;
      balls.push({
        x: sx(launch.x),
        y: sy(launch.y),
        vx: rightShot ? power * .010 : power * .0034,
        vy: rightShot ? -power * .0035 : power * .0048,
        r: Math.max(5, canvas.clientWidth * .0105),
        massG: physics.ballMassG,
        live: true,
        glow: 1,
        age: 0,
        angle: Math.random() * Math.PI * 2,
        trail: [],
        rightShot,
        startEligible
      });
      updateHud();
    }

    function burst(x, y, color, count = 18) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 1.2 + Math.random() * 3;
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 34 + Math.random() * 20, color });
      }
    }

    function update(dt) {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      state.rightDeviceOpen = isJackpotActive() && Math.sin(performance.now() / 180) > -.92;
      const scaledPins = pins.map(p => ({ x: sx(p.x), y: sy(p.y), r: Math.max(1.45, fixedPinRadius / 720 * w) }));
      const scaledPockets = pockets.map(p => ({
        ...p,
        x: sx(p.x),
        y: sy(p.y),
        r: (p.r || 0) / 720 * w,
        w: (p.w || 0) / 720 * w,
        h: (p.h || 0) / 900 * h
      }));

      balls.forEach(ball => {
        ball.age = (ball.age || 0) + dt;
        ball.prevX = ball.x;
        ball.prevY = ball.y;
        ball.trail.push({ x: ball.x, y: ball.y });
        if (ball.trail.length > 6) ball.trail.shift();
        guideBall(ball, dt);
        ball.vy += physics.gravity * dt;
        const drag = Math.max(0, 1 - (physics.airDrag + physics.rollingDrag) * dt);
        ball.vx *= drag;
        ball.vy *= Math.max(0, 1 - physics.airDrag * dt);
        const speed = Math.hypot(ball.vx, ball.vy);
        if (speed > physics.maxSpeed) {
          const cap = physics.maxSpeed / speed;
          ball.vx *= cap;
          ball.vy *= cap;
        }
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;
        ball.angle += Math.hypot(ball.vx, ball.vy) * dt / Math.max(1, ball.r) * .16;
        ball.glow *= .992;
        collideWithPlayfieldCircle(ball);
        collideWithLcdFrame(ball);
        collideWithAcrylicParts(ball);
        collideWithWindmill(ball);
        collideWithPushButton(ball);

        if (ball.x < ball.r + 12) {
          ball.x = ball.r + 12;
          ball.vx = Math.abs(ball.vx) * physics.wallRestitution;
        }
        if (ball.x > w - ball.r - 12) {
          ball.x = w - ball.r - 12;
          ball.vx = -Math.abs(ball.vx) * physics.wallRestitution;
        }
        if (ball.y < ball.r + 12) {
          ball.y = ball.r + 12;
          ball.vy = Math.abs(ball.vy) * physics.wallRestitution;
        }

        scaledPins.forEach(pin => {
          if (!ball.rightShot && ball.age < 420 && ball.y < sy(180) && pin.x < sx(128)) return;
          const dx = ball.x - pin.x;
          const dy = ball.y - pin.y;
          const dist = Math.hypot(dx, dy);
          const min = ball.r + pin.r;
          if (dist < min && dist > .01) {
            const nx = dx / dist;
            const ny = dy / dist;
            const overlap = min - dist;
            ball.x += nx * overlap;
            ball.y += ny * overlap;
            const dot = ball.vx * nx + ball.vy * ny;
            if (dot < 0) {
              ball.vx -= (1 + physics.nailRestitution) * dot * nx;
              ball.vy -= (1 + physics.nailRestitution) * dot * ny;
            }
            const tangentX = -ny;
            const tangentY = nx;
            const tangent = ball.vx * tangentX + ball.vy * tangentY;
            ball.vx -= tangentX * tangent * .035;
            ball.vy -= tangentY * tangent * .035;
            ball.vx += (Math.random() - .5) * physics.randomNailScatter;
            ball.vy += (Math.random() - .5) * physics.randomNailScatter * .55;
            ball.glow = 1;
          }
        });

        if (!ball.rightShot && ball.x > sx(455) && ball.y < sy(760)) {
          const routeX = ball.y < sy(560) ? sx(142) : sx(318);
          ball.vx += (routeX - ball.x) * .00018 * dt;
          if (ball.vx > 1.1) ball.vx *= .72;
        }
        if (ball.rightShot && ball.x < sx(520) && ball.y < sy(560)) {
          ball.vx += .010 * dt;
        }

        for (const pocket of scaledPockets) {
          if (pocket.type === "attacker" && !state.rightDeviceOpen) continue;
          const hit = pocketHit(ball, pocket);
          if (hit && ball.live) {
            if (pocket.type === "start" && ball.rightShot) continue;
            if (pocket.type === "start" && hit === "out") {
              ball.live = false;
              handlePocket({ ...pocket, type: "out", color: "#8895a4" }, ball.x, ball.y);
              break;
            }
            ball.live = false;
            handlePocket(pocket, ball.x, ball.y);
            break;
          }
        }

        if (ball.y > h + 60) ball.live = false;
      });

      collideBalls(dt);

      for (let i = balls.length - 1; i >= 0; i--) {
        if (!balls[i].live) balls.splice(i, 1);
      }

      particles.forEach(p => {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += .02 * dt;
        p.life -= dt;
      });
      for (let i = particles.length - 1; i >= 0; i--) {
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      if (!state.bonusActive && state.rightDeviceOpen) state.rightDeviceOpen = false;
    }

    function pocketHit(ball, pocket) {
      if (pocket.shape === "bowl") {
        const topWidth = pocket.w;
        const bottomWidth = pocket.w * .56;
        const top = pocket.y;
        const bottom = pocket.y + pocket.h;
        const topLeft = pocket.x - topWidth / 2;
        const topRight = pocket.x + topWidth / 2;
        const bottomLeft = pocket.x - bottomWidth / 2;
        const bottomRight = pocket.x + bottomWidth / 2;
        const withinTop = ball.x >= topLeft - ball.r * .65 && ball.x <= topRight + ball.r * .65;
        const withinBottom = ball.x >= bottomLeft - ball.r * .65 && ball.x <= bottomRight + ball.r * .65;
        const crossedTop = (ball.prevY + ball.r) <= top && (ball.y + ball.r) >= top;
        const topEntry = ball.vy > 0 && withinTop && (crossedTop || (ball.y >= top - ball.r && ball.y <= top + pocket.h * .45));
        const bottomCatch = withinBottom && ball.y + ball.r >= bottom - ball.r * .25;
        const lowerBackflow = ball.vy < 0 && withinBottom && ball.y - ball.r <= bottom && ball.y > top + pocket.h * .45;
        if (bottomCatch || lowerBackflow) return "out";
        if (topEntry) return "start";
        return false;
      }
      if (pocket.shape === "semicircle" || pocket.type === "out") {
        const dx = ball.x - pocket.x;
        const dy = ball.y - pocket.y;
        const dist = Math.hypot(dx, dy);
        return ball.vy > 0 && ball.y + ball.r >= pocket.y - pocket.r && dist < pocket.r + ball.r * .65;
      }
      if (pocket.type === "start") {
        const dist = Math.hypot(ball.x - pocket.x, ball.y - pocket.y);
        const prevDist = Math.hypot((ball.prevX ?? ball.x) - pocket.x, (ball.prevY ?? ball.y) - pocket.y);
        const gate = pocket.r + ball.r * .38;
        const crossed = prevDist > gate && dist <= gate;
        return ball.vy > 0 && (crossed || dist < pocket.r);
      }
      return Math.hypot(ball.x - pocket.x, ball.y - pocket.y) < pocket.r;
    }

    function collideBalls(dt) {
      for (let i = 0; i < balls.length; i++) {
        const a = balls[i];
        if (!a.live) continue;
        for (let j = i + 1; j < balls.length; j++) {
          const b = balls[j];
          if (!b.live) continue;
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          let dist = Math.hypot(dx, dy);
          const min = a.r + b.r + 1;
          if (dist >= min) continue;
          if (dist <= .01) {
            dist = .01;
          }
          const nx = dx / dist;
          const ny = dy / dist;
          const overlap = min - dist;
          const push = overlap * .52;
          a.x -= nx * push;
          a.y -= ny * push;
          b.x += nx * push;
          b.y += ny * push;

          const rvx = b.vx - a.vx;
          const rvy = b.vy - a.vy;
          const closing = rvx * nx + rvy * ny;
          if (closing < 0) {
            const impulse = -(1 + physics.ballRestitution) * closing / 2;
            a.vx -= impulse * nx;
            a.vy -= impulse * ny;
            b.vx += impulse * nx;
            b.vy += impulse * ny;
          }
          const tangentX = -ny;
          const tangentY = nx;
          const shove = .0018 * dt;
          a.vx -= tangentX * shove;
          b.vx += tangentX * shove;
          a.vy -= tangentY * shove * .45;
          b.vy += tangentY * shove * .45;
          a.glow = Math.max(a.glow, .68);
          b.glow = Math.max(b.glow, .68);
        }
      }
    }

    function playfieldShape() {
      return {
        x: sx(360),
        y: sy(492),
        rx: sx(338),
        ry: sy(418),
        topY: sy(74)
      };
    }

    function collideWithPlayfieldCircle(ball) {
      const field = playfieldShape();
      const dx = ball.x - field.x;
      const dy = ball.y - field.y;
      const rx = field.rx - ball.r - 2;
      const ry = field.ry - ball.r - 2;
      const normalized = Math.hypot(dx / rx, dy / ry);
      if (normalized <= 1 || normalized <= .01) return;
      ball.x = field.x + dx / normalized;
      ball.y = field.y + dy / normalized;
      const nxRaw = dx / (rx * rx);
      const nyRaw = dy / (ry * ry);
      const nLen = Math.max(.01, Math.hypot(nxRaw, nyRaw));
      const nx = nxRaw / nLen;
      const ny = nyRaw / nLen;
      const dot = ball.vx * nx + ball.vy * ny;
      if (dot > 0) {
        ball.vx -= (1 + physics.wallRestitution) * dot * nx;
        ball.vy -= (1 + physics.wallRestitution) * dot * ny;
      }
      if (ball.y > sy(705)) {
        ball.vx += (sx(360) - ball.x) * .006;
        ball.vy = Math.max(ball.vy, .45);
      }
      ball.glow = 1;
    }

    function collideWithLcdFrame(ball) {
      const block = lcdBlock();
      const pad = ball.r + 4;
      if (
        ball.x < block.left - pad ||
        ball.x > block.right + pad ||
        ball.y < block.top - pad ||
        ball.y > block.bottom + pad
      ) return;

      const insideX = ball.x > block.left && ball.x < block.right;
      const insideY = ball.y > block.top && ball.y < block.bottom;
      if (!insideX || !insideY) return;

      const exits = [
        { side: "left", d: Math.abs(ball.x - block.left) },
        { side: "right", d: Math.abs(block.right - ball.x) },
        { side: "top", d: Math.abs(ball.y - block.top) },
        { side: "bottom", d: Math.abs(block.bottom - ball.y) }
      ].sort((a, b) => a.d - b.d);

      if (exits[0].side === "left") {
        ball.x = block.left - pad;
        ball.vx = -Math.abs(ball.vx) * physics.lcdRestitution - .12;
      } else if (exits[0].side === "right") {
        ball.x = block.right + pad;
        ball.vx = Math.abs(ball.vx) * physics.lcdRestitution + .12;
      } else if (exits[0].side === "top") {
        ball.y = block.top - pad;
        ball.vy = -Math.abs(ball.vy) * physics.lcdRestitution;
        const center = (block.left + block.right) / 2;
        const side = ball.x < center ? -1 : 1;
        ball.vx += side * .18 + (ball.x - center) * .0008;
      } else {
        ball.y = block.bottom + pad;
        ball.vy = Math.abs(ball.vy) * physics.lcdRestitution + .10;
      }
      ball.vx += (Math.random() - .5) * .08;
      ball.vy += (Math.random() - .5) * .05;
      ball.glow = 1;
    }

    function pushButtonShape() {
      const button = hitAreas.push;
      return {
        x: sx(button.x),
        y: sy(button.y),
        r: button.r / 720 * canvas.clientWidth
      };
    }

    function collideWithPushButton(ball) {
      if (ball.rightShot) return;
      const button = pushButtonShape();
      const dx = ball.x - button.x;
      const dy = ball.y - button.y;
      const dist = Math.hypot(dx, dy);
      const min = button.r + ball.r + 2;
      if (dist >= min || dist <= .01) return;
      const nx = dx / dist;
      const ny = dy / dist;
      const overlap = min - dist;
      ball.x += nx * overlap;
      ball.y += ny * overlap;
      const dot = ball.vx * nx + ball.vy * ny;
      if (dot < 0) {
        ball.vx -= (1 + physics.wallRestitution * .7) * dot * nx;
        ball.vy -= (1 + physics.wallRestitution * .7) * dot * ny;
      }
      ball.vx += (sx(360) - ball.x) * .0025;
      ball.vy = Math.max(ball.vy, .32);
      ball.glow = 1;
    }

    function collideWithWindmill(ball) {
      const mill = hitAreas.windmill;
      const x = sx(mill.x);
      const y = sy(mill.y);
      const r = mill.r / 720 * canvas.clientWidth;
      const dx = ball.x - x;
      const dy = ball.y - y;
      const dist = Math.hypot(dx, dy);
      const min = r + ball.r + 1;
      if (dist >= min || dist <= .01) return;
      const nx = dx / dist;
      const ny = dy / dist;
      const overlap = min - dist;
      ball.x += nx * overlap;
      ball.y += ny * overlap;
      const dot = ball.vx * nx + ball.vy * ny;
      if (dot < 0) {
        ball.vx -= (1 + physics.nailRestitution * .85) * dot * nx;
        ball.vy -= (1 + physics.nailRestitution * .85) * dot * ny;
      }
      const spin = Math.sin(performance.now() / 180) * .22;
      ball.vx += spin + nx * .08 + (ball.rightShot ? 0 : .14);
      ball.vy = Math.max(.25, ball.vy + .12);
      ball.glow = 1;
    }

    function collideWithAcrylicParts(ball) {
      acrylicParts.forEach(part => {
        const points = acrylicCanvasPoints(part);
        let best = null;
        const last = part.type === "curve" ? points.length - 1 : points.length;
        for (let i = 0; i < last; i++) {
          const a = points[i];
          const b = points[(i + 1) % points.length];
          const hit = nearestPointOnSegment(ball.x, ball.y, a.x, a.y, b.x, b.y);
          if (!best || hit.dist < best.dist) best = hit;
        }
        const extra = part.type === "curve" ? (part.thickness || 22) / 720 * canvas.clientWidth / 2 : 0;
        const inside = part.type !== "curve" && pointInCanvasPolygon({ x: ball.x, y: ball.y }, points);
        if (!best || (!inside && best.dist > ball.r + extra)) return;
        let nx = best.dist > .01 ? (ball.x - best.x) / best.dist : 0;
        let ny = best.dist > .01 ? (ball.y - best.y) / best.dist : -1;
        if (inside) {
          const center = { x: sx(part.x), y: sy(part.y) };
          const outwardX = ball.x - center.x;
          const outwardY = ball.y - center.y;
          const len = Math.hypot(outwardX, outwardY);
          if (len > .01) {
            nx = outwardX / len;
            ny = outwardY / len;
          }
        }
        const overlap = inside ? ball.r + best.dist + 2 : ball.r + extra - best.dist + 1;
        ball.x += nx * overlap;
        ball.y += ny * overlap;
        const dot = ball.vx * nx + ball.vy * ny;
        if (dot < 0) {
          ball.vx -= (1 + physics.wallRestitution) * dot * nx;
          ball.vy -= (1 + physics.wallRestitution) * dot * ny;
        }
        ball.vx += (Math.random() - .5) * .06;
        ball.vy += (Math.random() - .5) * .04;
        ball.glow = 1;
      });
    }

    function nearestPointOnSegment(px, py, ax, ay, bx, by) {
      const vx = bx - ax;
      const vy = by - ay;
      const lenSq = vx * vx + vy * vy || 1;
      const t = Math.max(0, Math.min(1, ((px - ax) * vx + (py - ay) * vy) / lenSq));
      const x = ax + vx * t;
      const y = ay + vy * t;
      return { x, y, dist: Math.hypot(px - x, py - y) };
    }

    function pointInCanvasPolygon(point, polygon) {
      let inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const a = polygon[i];
        const b = polygon[j];
        if (((a.y > point.y) !== (b.y > point.y)) && point.x < (b.x - a.x) * (point.y - a.y) / ((b.y - a.y) || .0001) + a.x) inside = !inside;
      }
      return inside;
    }

    function guideBall(ball, dt) {
      let target;
      if (ball.rightShot) {
        if (ball.y < sy(140)) {
          target = { x: sx(650), y: sy(92), force: .0022 };
        } else if (ball.y < sy(330)) {
          target = { x: sx(664), y: sy(360), force: .0016 };
        } else if (ball.y < sy(545)) {
          target = { x: sx(648), y: sy(565), force: state.rightDeviceOpen ? .0018 : .0012 };
        } else {
          target = { x: sx(612), y: sy(555), force: state.rightDeviceOpen ? .0022 : .0010 };
        }
      } else if (ball.y < sy(350)) {
        target = { x: sx(84), y: sy(410), force: .00034 };
      } else if (ball.y < sy(525)) {
        target = { x: sx(96), y: sy(522), force: .00038 };
      } else if (ball.y < sy(650)) {
        target = { x: sx(250), y: sy(628), force: .00030 };
      } else if (ball.y < sy(735)) {
        target = { x: sx(ball.startEligible ? 366 : 344), y: sy(742), force: ball.startEligible ? .00046 : .00022 };
      } else {
        target = { x: sx(360), y: sy(ball.startEligible ? 772 : 812), force: ball.startEligible ? .00072 : .00020 };
      }
      const dx = target.x - ball.x;
      const dy = target.y - ball.y;
      const dist = Math.max(80, Math.hypot(dx, dy));
      ball.vx += dx / dist * target.force * dt;
      ball.vy += dy / dist * target.force * dt;

      if (!ball.rightShot && ball.x < sx(150) && ball.y < sy(560)) {
        ball.vx += .00025 * dt;
        ball.vy += .0048 * dt;
      }
      if (!ball.rightShot && ball.age < 520 && ball.y < sy(190)) {
        ball.vx += .0032 * dt;
        if (ball.vx < .14) ball.vx = .14;
      }
      if (!ball.rightShot && ball.x > sx(430)) {
        ball.vx += (sx(300) - ball.x) * .000022 * dt;
        ball.vy += .0020 * dt;
      }
      if (!ball.rightShot) {
        const wx = sx(hitAreas.windmill.x);
        const wy = sy(hitAreas.windmill.y);
        const dxw = ball.x - wx;
        const dyw = ball.y - wy;
        const dw = Math.hypot(dxw, dyw);
        if (dw < sx(78) && dw > 1) {
          const spin = Math.sin(performance.now() / 260);
          const rightBias = ball.startEligible ? .0022 : .0008;
          const sideKick = dxw < 0 ? .0005 : .0009;
          ball.vx += (rightBias + sideKick + spin * .0012) * dt;
          ball.vy += .0014 * dt;
          ball.glow = Math.max(ball.glow, .82);
        }
      }
      if (!ball.rightShot && ball.y > sy(500) && ball.y < sy(650) && ball.x > sx(62) && ball.x < sx(300)) {
        if (!ball.leftLcdSplitSide) ball.leftLcdSplitSide = Math.random() < (ball.startEligible ? .72 : .46) ? 1 : -1;
        const splitX = ball.leftLcdSplitSide > 0 ? sx(ball.startEligible ? 358 : 314) : sx(148);
        ball.vx += (splitX - ball.x) * .000018 * dt;
        ball.vy += .0024 * dt;
        if (Math.abs(ball.x - sx(220)) < sx(42)) {
          ball.vx += ball.leftLcdSplitSide * .0022 * dt;
        }
      }
      if (!ball.rightShot && ball.y > sy(520)) {
        const laneX = ball.y < sy(690) ? sx(ball.startEligible ? 342 : 304) : sx(356);
        ball.vx += (laneX - ball.x) * .000008 * dt;
      }
      if (!ball.rightShot && ball.y > sy(690) && ball.y < sy(775) && Math.abs(ball.x - sx(360)) < sx(116)) {
        const centerPull = sx(360) - ball.x;
        ball.vx += centerPull * .000012 * dt;
        ball.vy += .0018 * dt;
      }
      if (!ball.rightShot && ball.startEligible && ball.y > sy(650) && ball.y < sy(798)) {
        const hesoPull = sx(360) - ball.x;
        ball.vx += hesoPull * .000046 * dt;
        ball.vy += .0032 * dt;
      }
      if (!ball.rightShot && !ball.startEligible && ball.y > sy(790)) {
        if (!ball.hesoSpillSide) {
          state.spillFlip *= -1;
          ball.hesoSpillSide = ball.x < sx(330) ? 1 : state.spillFlip;
        }
        const spillX = sx(ball.hesoSpillSide < 0 ? 322 : 398);
        ball.vx += (spillX - ball.x) * .000012 * dt;
        ball.vy += .0032 * dt;
        if (ball.y > sy(812) && Math.abs(ball.x - sx(360)) < sx(38)) {
          ball.vx += ball.hesoSpillSide * .0010 * dt;
          ball.vy += .0042 * dt;
        }
      }
      if (!ball.rightShot && ball.x > sx(470) && ball.y > sy(640)) {
        ball.vx += (sx(360) - ball.x) * .000026 * dt;
        ball.vy += .0032 * dt;
      }
      if (ball.startEligible && ball.y > sy(500)) {
        ball.vx *= .998;
        ball.vy *= .996;
      }
      if (ball.rightShot) {
        if (ball.x < sx(540) && ball.y < sy(420)) {
          ball.vx += .007 * dt;
        }
        if (ball.x > sx(610) && ball.y > sy(260)) {
          ball.vx += (sx(642) - ball.x) * .000075 * dt;
          ball.vy += .010 * dt;
        }
      }
    }

    function handlePocket(pocket, x, y) {
      if (pocket.type === "out") {
        burst(x, y, "#79889a", 8);
        return;
      }
      state.wins++;
      const prize = pocket.type === "start" ? 5 : 15;
      state.balls += prize;
      state.balance += prize;
      state.payout += prize;
      burst(x, y, pocket.color, 18);
      if (pocket.type === "start") {
        queueStartSpin();
      }
      else if (pocket.type === "attacker") addLog(`<span class="hit">右アタッカー入賞 +${prize}</span>`);
      updateHud();
    }

    function queueStartSpin() {
      if (state.pendingStarts >= maxHolds) {
        pauseAutoForHold();
        updateHud();
        return false;
      }
      state.pendingStarts++;
      burst(sx(360), sy(790), "#66e3ff", 14);
      addLog("START通過 保留+1");
      if (state.pendingStarts >= maxHolds) pauseAutoForHold();
      processStartQueue();
      updateHud();
      return true;
    }

    function processStartQueue() {
      if (spinLock || state.bonusActive || state.pendingStarts <= 0) return;
      state.pendingStarts--;
      resumeAutoFromHold();
      startSpin();
    }

    function startSpin() {
      if (spinLock) {
        state.pendingStarts++;
        addLog("保留が満タン");
        return;
      }
      spinLock = true;
      state.spins++;
      state.sinceJackpotSpins++;
      message("図柄変動中");
      els.reels.forEach(r => r.classList.add("spin"));

      let ticks = 0;
      const spinTicks = state.speedMode ? 5 : 17;
      const spinInterval = state.speedMode ? 28 : 90;
      const interval = setInterval(() => {
        ticks++;
        els.reels.forEach(r => r.textContent = symbols[Math.floor(Math.random() * symbols.length)]);
        if (ticks >= spinTicks) {
          clearInterval(interval);
          settleSpin();
        }
      }, spinInterval);
      updateHud();
    }

    function settleSpin() {
      const hitChance = 1 / 400;
      const hit = Math.random() < hitChance;
      if (hit) {
        const sym = Math.random() < .55 ? "7" : symbols[Math.floor(Math.random() * symbols.length)];
        els.reels.forEach(r => {
          r.classList.remove("spin");
          r.textContent = sym;
        });
        jackpot(sym);
      } else {
        const a = symbols[Math.floor(Math.random() * symbols.length)];
        let b = symbols[Math.floor(Math.random() * symbols.length)];
        let c = symbols[Math.floor(Math.random() * symbols.length)];
        if (a === b && b === c) c = symbols[(symbols.indexOf(c) + 1) % symbols.length];
        els.reels[0].textContent = a;
        els.reels[1].textContent = b;
        els.reels[2].textContent = c;
        els.reels.forEach(r => r.classList.remove("spin"));
        message("惜しい、次の入賞へ");
        addLog(`ハズレ ${a}${b}${c}`);
      }
      spinLock = false;
      processStartQueue();
      updateHud();
    }

    function jackpot(symbol) {
      state.jackpots++;
      state.sinceJackpotSpins = 0;
      state.pendingRush = rollInitialRush();
      startBonus({
        rounds: 5,
        kind: "initial",
        title: `${symbol}${symbol}${symbol} 初当たり5R`,
        revealAtRound: 4
      });
    }

    function settleSpin() {
      const rushActive = state.rushMode !== "none" && state.stRemaining > 0;
      if (rushActive) state.stRemaining--;
      const hitChance = rushActive ? rushSpinChance() : 1 / 400;
      const hit = Math.random() < hitChance;
      if (hit) {
        const sym = Math.random() < .55 ? "7" : symbols[Math.floor(Math.random() * symbols.length)];
        els.reels.forEach(r => {
          r.classList.remove("spin");
          r.textContent = sym;
        });
        jackpot(sym);
      } else {
        const a = symbols[Math.floor(Math.random() * symbols.length)];
        let b = symbols[Math.floor(Math.random() * symbols.length)];
        let c = symbols[Math.floor(Math.random() * symbols.length)];
        if (a === b && b === c) c = symbols[(symbols.indexOf(c) + 1) % symbols.length];
        els.reels[0].textContent = a;
        els.reels[1].textContent = b;
        els.reels[2].textContent = c;
        els.reels.forEach(r => r.classList.remove("spin"));
        if (rushActive && state.stRemaining <= 0) {
          resetToNormal("ST100回転終了 通常へ");
        } else if (rushActive) {
          state.mode = `${state.rushMode === "upper" ? "上位RUSH" : "RUSH"} ST${state.stRemaining}`;
          message(`${state.mode} 継続中`);
        } else {
          message("ハズレ、次の入賞へ");
        }
        addLog(`ハズレ ${a}${b}${c}`);
      }
      spinLock = false;
      processStartQueue();
      updateHud();
    }

    function rushSpinChance() {
      const totalChance = state.rushMode === "upper" ? .75 : .60;
      return 1 - Math.pow(1 - totalChance, 1 / 100);
    }

    function jackpot(symbol) {
      state.jackpots++;
      state.sinceJackpotSpins = 0;
      if (state.rushMode !== "none") {
        registerRushHit();
        startBonus({
          rounds: 10,
          kind: "rush",
          title: state.rushMode === "upper" ? "上位RUSH 10R" : `RUSH ${state.rushStreak}連 10R`
        });
        return;
      }
      state.pendingRush = rollInitialRush();
      startBonus({
        rounds: 5,
        kind: "initial",
        title: `${symbol}${symbol}${symbol} 初当たり5R`,
        revealAtRound: 4
      });
    }

    function registerRushHit() {
      if (state.rushMode === "rush") {
        state.rushStreak++;
        if (state.rushStreak >= 5) {
          state.rushMode = "upper";
          state.mode = "上位RUSH";
          addLog(`<span class="hit">RUSH5連続 上位RUSH突入</span>`);
        }
      }
      state.stRemaining = 0;
    }

    function rollInitialRush() {
      const roll = Math.random();
      if (roll < .01) return "upper";
      if (roll < .51) return "rush";
      return "none";
    }

    function startBonus({ rounds, kind, title, revealAtRound = 0 }) {
      clearInterval(state.bonusTimer);
      state.rounds = rounds;
      state.bonusActive = true;
      state.feverUntil = performance.now() + rounds * 900;
      state.mode = kind === "rush" ? (state.rushMode === "upper" ? "上位RUSH BONUS" : "RUSH BONUS") : "初当たりBONUS";
      state.rightDeviceOpen = true;
      machine.classList.add("fever");
      syncHandleUi();
      message(`${title} 右打ち`);
      addLog(`<span class="hit">${title} 開始</span>`);
      payRound(rounds, kind, revealAtRound);
    }

    function payRound(rounds, kind, revealAtRound) {
      const prize = 300;
      let paid = 0;
      state.bonusTimer = setInterval(() => {
        if (paid >= rounds) {
          clearInterval(state.bonusTimer);
          state.bonusTimer = null;
          finishBonus(kind);
          return;
        }
        paid++;
        state.balls += prize;
        state.balance += prize;
        state.payout += prize;
        if (kind === "initial" && paid === revealAtRound) revealInitialRush();
        message(`${state.mode} ${paid}/${rounds}R +${prize}`);
        burst(sx(360), sy(646), paid % 2 ? "#ffd36a" : "#ff6f9f", 26);
        updateHud();
      }, 650);
    }

    function revealInitialRush() {
      if (state.pendingRush === "upper") {
        state.rushMode = "upper";
        state.rushStreak = 5;
        state.mode = "上位RUSH突入";
        message("4R告知 上位RUSH突入");
        addLog(`<span class="hit">4R告知: 上位RUSH突入</span>`);
      } else if (state.pendingRush === "rush") {
        state.rushMode = "rush";
        state.rushStreak = 0;
        state.mode = "RUSH突入";
        message("4R告知 RUSH突入");
        addLog(`<span class="hit">4R告知: RUSH突入</span>`);
      } else {
        state.rushMode = "none";
        state.rushStreak = 0;
        state.mode = "通常へ";
        message("4R告知 RUSHなし");
        addLog("4R告知: RUSHなし");
      }
      updateHud();
    }

    function finishBonus(kind) {
      state.bonusActive = false;
      state.rightDeviceOpen = false;
      machine.classList.remove("fever");
      state.rounds = 0;
      syncHandleUi();

      if (kind === "initial" && state.rushMode === "none") {
        resetToNormal("初当たり終了 通常へ");
        processStartQueue();
        return;
      }

      if (state.rushMode !== "none") {
        state.mode = state.rushMode === "upper" ? "上位RUSH" : "RUSH";
        message(`${state.mode} 継続抽選中`);
        updateHud();
        setTimeout(rollRushContinue, 900);
        return;
      }

      resetToNormal("通常へ");
    }

    function rollRushContinue() {
      if (state.rushMode === "none" || state.bonusActive) return;
      const chance = state.rushMode === "upper" ? .75 : .60;
      const hit = Math.random() < chance;
      if (!hit) {
        resetToNormal(`${state.mode}終了 通常へ`);
        return;
      }
      if (state.rushMode === "rush") {
        state.rushStreak++;
        if (state.rushStreak >= 5) {
          state.rushMode = "upper";
          state.mode = "上位RUSH";
          addLog(`<span class="hit">RUSH5連続 上位RUSH突入</span>`);
        }
      }
      state.jackpots++;
      startBonus({
        rounds: 10,
        kind: "rush",
        title: state.rushMode === "upper" ? "上位RUSH 10R" : `RUSH ${state.rushStreak}連 10R`
      });
    }

    function finishBonus(kind) {
      state.bonusActive = false;
      state.rightDeviceOpen = false;
      machine.classList.remove("fever");
      state.rounds = 0;
      syncHandleUi();

      if (kind === "initial" && state.rushMode === "none") {
        resetToNormal("初当たり終了 通常へ");
        processStartQueue();
        return;
      }

      if (state.rushMode !== "none") {
        enterRushSt();
        return;
      }

      resetToNormal("通常へ");
    }

    function enterRushSt() {
      state.stRemaining = 100;
      state.mode = `${state.rushMode === "upper" ? "上位RUSH" : "RUSH"} ST100`;
      message(`${state.mode} 開始`);
      addLog(`<span class="hit">${state.mode} 開始</span>`);
      updateHud();
      processStartQueue();
    }

    function resetToNormal(text) {
      state.mode = "通常";
      state.rushMode = "none";
      state.rushStreak = 0;
      state.stRemaining = 0;
      state.pendingRush = "none";
      state.bonusActive = false;
      state.rightDeviceOpen = false;
      state.feverUntil = 0;
      state.rounds = 0;
      machine.classList.remove("fever");
      message(text);
      addLog(text);
      updateHud();
      processStartQueue();
    }

    function draw() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);

      drawCabinetShell(w, h);

      ctx.save();
      ctx.beginPath();
      playfieldPath(playfieldShape());
      ctx.clip();
      drawPlayfieldBackground(w, h);

      ctx.strokeStyle = "rgba(255,255,255,.18)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      playfieldPath(playfieldShape(), -Math.max(34, w * .055));
      ctx.stroke();

      drawBoardOrnaments(w, h);
      drawAcrylicParts(w, h);
      drawNailHighlights(w, h);
      drawRightDevice(w, h);
      drawPockets();
      drawPins();
      drawPinEditorOverlay(w, h);
      drawBalls();
      drawParticles();
      drawPlayfieldDebugOverlay(w, h);
      ctx.restore();

      drawPushButton(w, h);
      drawCabinetDebugOverlay(w, h);
    }

    function drawCabinetShell(w, h) {

      ctx.save();

      ctx.lineWidth = Math.max(5, w * .010);
      ctx.beginPath();
      ctx.moveTo(w * .06, h * .79);
      ctx.bezierCurveTo(w * .28, h * .84, w * .70, h * .84, w * .94, h * .78);

      ctx.strokeStyle = "rgba(255, 181, 62, .42)";

      ctx.beginPath();

      ctx.strokeStyle = "rgba(255,255,255,.16)";
      ctx.lineWidth = Math.max(6, w * .012);
      ctx.beginPath();
      ctx.ellipse(w * .50, h * .50, w * .465, h * .445, 0, 0, Math.PI * 2);

      const lower = ctx.createLinearGradient(0, h * .78, 0, h);

      lower.addColorStop(1, "rgba(0,0,0,.42)");
      ctx.fillStyle = lower;
      roundRect(w * .055, h * .80, w * .89, h * .17, Math.max(28, w * .055));

      const led = ctx.createLinearGradient(0, h * .84, 0, h * .96);

      roundRect(w * .24, h * .845, w * .52, h * .105, Math.max(10, w * .018));

      ctx.strokeStyle = "rgba(255, 55, 70, .85)";
      ctx.lineWidth = Math.max(2, w * .005);
      roundRect(w * .24, h * .845, w * .52, h * .105, Math.max(10, w * .018));
      ctx.stroke();
      ctx.save();
      ctx.shadowColor = "rgba(255, 45, 60, .85)";
      ctx.shadowBlur = Math.max(8, w * .018);
      ctx.fillStyle = "rgba(255, 46, 64, .92)";
      ctx.font = `900 ${Math.max(30, w * .080)}px "Orbitron", "Segoe UI", sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("119", w * .50, h * .900);
      ctx.restore();
    }

    function drawPlayfieldBackground(w, h) {
      const bg = ctx.createRadialGradient(w * .50, h * .42, w * .08, w * .50, h * .48, w * .60);
      bg.addColorStop(0, "#43200d");
      bg.addColorStop(.24, "#180c10");
      bg.addColorStop(.62, "#071019");
      bg.addColorStop(1, "#030508");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      const heat = ctx.createLinearGradient(w * .10, h * .12, w * .90, h * .70);
      heat.addColorStop(0, "rgba(255, 181, 35, .30)");
      heat.addColorStop(.28, "rgba(255, 71, 31, .30)");
      heat.addColorStop(.50, "rgba(4, 255, 137, .12)");
      heat.addColorStop(.78, "rgba(255, 150, 23, .26)");
      heat.addColorStop(1, "rgba(255, 0, 60, .18)");
      ctx.fillStyle = heat;
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.globalCompositeOperation = "screen";
      for (let i = 0; i < 18; i++) {
        const t = i / 17;
        const y = h * (.17 + .50 * t);
        const hue = i % 3 === 0 ? "rgba(255, 202, 56, .42)" : i % 3 === 1 ? "rgba(23, 238, 128, .28)" : "rgba(255, 64, 45, .32)";
        ctx.strokeStyle = hue;
        ctx.lineWidth = Math.max(2, w * (.005 + (i % 4) * .0015));
        ctx.beginPath();
        ctx.moveTo(w * (.06 + .03 * (i % 2)), y);
        ctx.bezierCurveTo(w * .28, y - h * (.08 + .03 * Math.sin(i)), w * .58, y + h * (.10 - .04 * Math.cos(i)), w * .92, y - h * .04);
        ctx.stroke();
      }
      ctx.restore();

      const plate = ctx.createLinearGradient(0, h * .08, 0, h * .90);
      plate.addColorStop(0, "rgba(255,255,255,.12)");
      plate.addColorStop(.42, "rgba(255,255,255,.03)");
      plate.addColorStop(1, "rgba(0,0,0,.26)");
      ctx.fillStyle = plate;
      ctx.fillRect(0, 0, w, h);
    }

    function drawFrontGlass(w, h) {
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      ctx.strokeStyle = "rgba(255,255,255,.18)";
      ctx.lineWidth = Math.max(2, w * .004);
      ctx.beginPath();
      ctx.moveTo(w * .16, h * .12);
      ctx.bezierCurveTo(w * .36, h * .05, w * .68, h * .09, w * .86, h * .20);
      ctx.stroke();

      const shine = ctx.createLinearGradient(w * .05, h * .12, w * .38, h * .48);
      shine.addColorStop(0, "rgba(255,255,255,.16)");
      shine.addColorStop(.36, "rgba(255,255,255,.05)");
      shine.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = shine;
      roundRect(w * .05, h * .10, w * .26, h * .42, 16);
      ctx.fill();
      ctx.restore();
    }

    function drawAcrylicFrame(w, h) {
      ctx.save();
      const field = playfieldShape();
      const frameGrad = ctx.createLinearGradient(0, 0, w, h);
      frameGrad.addColorStop(0, "rgba(255,255,255,.30)");
      frameGrad.addColorStop(.36, "rgba(178,235,255,.08)");
      frameGrad.addColorStop(.72, "rgba(255,255,255,.04)");
      frameGrad.addColorStop(1, "rgba(102,227,255,.18)");
      ctx.strokeStyle = frameGrad;
      ctx.lineWidth = Math.max(10, w * .022);
      ctx.beginPath();
      playfieldPath(field, Math.max(8, w * .014));
      ctx.stroke();

      ctx.strokeStyle = "rgba(255,255,255,.28)";
      ctx.lineWidth = Math.max(2, w * .004);
      ctx.beginPath();
      playfieldPath(field, -Math.max(4, w * .008));
      ctx.stroke();

      ctx.strokeStyle = "rgba(102,227,255,.16)";
      ctx.lineWidth = Math.max(3, w * .006);
      ctx.beginPath();
      playfieldPath(field, -Math.max(22, w * .038));
      ctx.stroke();

      const shine = ctx.createLinearGradient(w * .12, h * .08, w * .44, h * .34);
      shine.addColorStop(0, "rgba(255,255,255,.30)");
      shine.addColorStop(.44, "rgba(255,255,255,.08)");
      shine.addColorStop(1, "rgba(255,255,255,0)");
      ctx.strokeStyle = shine;
      ctx.lineWidth = Math.max(4, w * .008);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(w * .12, h * .13);
      ctx.bezierCurveTo(w * .20, h * .07, w * .35, h * .08, w * .47, h * .15);
      ctx.stroke();

      ctx.strokeStyle = "rgba(255,255,255,.18)";
      ctx.lineWidth = Math.max(2, w * .004);
      ctx.beginPath();
      ctx.moveTo(w * .82, h * .18);
      ctx.bezierCurveTo(w * .91, h * .36, w * .91, h * .62, w * .81, h * .80);
      ctx.stroke();
      ctx.restore();
    }

    function playfieldPath(field, offset = 0) {
      const rx = field.rx + offset;
      const ry = field.ry + offset;
      const topY = field.y - ry;
      const bottomY = field.y + ry;
      ctx.moveTo(field.x, topY);
      ctx.bezierCurveTo(field.x + rx * .88, topY + ry * .04, field.x + rx, field.y + ry * .36, field.x + rx * .76, field.y + ry * .72);
      ctx.bezierCurveTo(field.x + rx * .48, bottomY - ry * .02, field.x - rx * .48, bottomY - ry * .02, field.x - rx * .76, field.y + ry * .72);
      ctx.bezierCurveTo(field.x - rx, field.y + ry * .36, field.x - rx * .88, topY + ry * .04, field.x, topY);
      ctx.closePath();
    }

      ctx.lineTo(w * .29, h * .045);

    function drawSideRoutePanels(w, h) {
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      const left = ctx.createLinearGradient(w * .06, h * .22, w * .24, h * .72);
      left.addColorStop(0, "rgba(0, 255, 220, .48)");
      left.addColorStop(.55, "rgba(0, 154, 255, .36)");
      left.addColorStop(1, "rgba(252, 255, 90, .28)");
      ctx.fillStyle = left;
      ctx.beginPath();
      ctx.moveTo(w * .10, h * .20);
      ctx.bezierCurveTo(w * .22, h * .28, w * .19, h * .52, w * .25, h * .70);
      ctx.lineTo(w * .14, h * .75);
      ctx.bezierCurveTo(w * .06, h * .55, w * .04, h * .36, w * .10, h * .20);
      ctx.closePath();
      ctx.fill();

      const right = ctx.createLinearGradient(w * .78, h * .24, w * .94, h * .72);
      right.addColorStop(0, "rgba(255,255,255,.45)");
      right.addColorStop(.42, "rgba(116, 255, 128, .26)");
      right.addColorStop(1, "rgba(255, 45, 151, .36)");
      ctx.fillStyle = right;
      ctx.beginPath();
      ctx.moveTo(w * .86, h * .22);
      ctx.bezierCurveTo(w * .94, h * .38, w * .92, h * .58, w * .82, h * .76);
      ctx.lineTo(w * .72, h * .71);
      ctx.bezierCurveTo(w * .79, h * .55, w * .78, h * .38, w * .86, h * .22);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "rgba(255,255,255,.44)";
      ctx.lineWidth = Math.max(2, w * .004);
      ["left", "right"].forEach(side => {
        const startX = side === "left" ? w * .13 : w * .86;
        const endX = side === "left" ? w * .22 : w * .76;
        ctx.beginPath();
        ctx.moveTo(startX, h * .28);
        ctx.bezierCurveTo(side === "left" ? w * .08 : w * .92, h * .43, side === "left" ? w * .20 : w * .80, h * .58, endX, h * .72);
