      ctx.translate(x, y);
      ctx.fillStyle = "rgba(0,0,0,.50)";
      ctx.strokeStyle = "rgba(255,211,106,.88)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.rotate(performance.now() / 1200);
      for (let i = 0; i < 3; i++) {
        ctx.rotate(Math.PI * 2 / 3);
        ctx.fillStyle = "rgba(255, 211, 106, .78)";
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(r * .20, -r * .88);
        ctx.lineTo(-r * .20, -r * .88);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = "#101923";
      ctx.beginPath();
      ctx.arc(0, 0, r * .22, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawAcrylicParts(w, h) {
      ctx.save();
      acrylicParts.forEach(part => {
        const tone = acrylicPartTone(part);
        if (part.type === "curve") {
          const controls = acrylicControlCanvasPoints(part);
          if (controls.length < 3) return;
          const thickness = Math.max(8, (part.thickness || 22) / 720 * w);
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.shadowColor = tone.glow;
          ctx.shadowBlur = Math.max(8, thickness * .55);
          ctx.strokeStyle = "rgba(255, 255, 255, .23)";
          ctx.lineWidth = thickness * 1.20;
          ctx.beginPath();
          ctx.moveTo(controls[0].x, controls[0].y);
          ctx.quadraticCurveTo(controls[1].x, controls[1].y, controls[2].x, controls[2].y);
          ctx.stroke();
          ctx.shadowBlur = Math.max(3, thickness * .22);
          ctx.strokeStyle = tone.stroke;
          ctx.lineWidth = thickness * .48;
          ctx.beginPath();
          ctx.moveTo(controls[0].x, controls[0].y);
          ctx.quadraticCurveTo(controls[1].x, controls[1].y, controls[2].x, controls[2].y);
          ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = "rgba(255,255,255,.58)";
          ctx.lineWidth = Math.max(2, thickness * .16);
          ctx.beginPath();
          ctx.moveTo(controls[0].x, controls[0].y);
          ctx.quadraticCurveTo(controls[1].x, controls[1].y, controls[2].x, controls[2].y);
          ctx.stroke();
          return;
        }
        const points = acrylicCanvasPoints(part);
        const bounds = acrylicBounds(part);
        const x = sx(bounds.x);
        const y = sy(bounds.y);
        const width = bounds.w / 720 * w;
        const height = bounds.h / 900 * h;
        const grad = ctx.createLinearGradient(x, y, x + width, y + height);
        grad.addColorStop(0, "rgba(255, 255, 255, .42)");
        grad.addColorStop(.42, tone.fill);
        grad.addColorStop(1, "rgba(255, 255, 255, .18)");
        ctx.fillStyle = grad;
        ctx.shadowColor = tone.glow;
        ctx.shadowBlur = Math.max(6, w * .012);
        ctx.strokeStyle = tone.stroke;
        ctx.lineWidth = Math.max(2, w * .004);
        drawPolygonPath(points);
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "rgba(255,255,255,.28)";
        ctx.lineWidth = 1;
        drawPolygonPath(points.map(point => ({
          x: point.x + (sx(part.x) - point.x) * .08,
          y: point.y + (sy(part.y) - point.y) * .08
        })));
        ctx.stroke();
      });
      ctx.restore();
    }

    function acrylicPartTone(part) {
      const label = part.label || "";
      if (label.includes("右")) {
        return {
          fill: "rgba(255, 238, 255, .14)",
          stroke: "rgba(255, 73, 161, .82)",
          glow: "rgba(255, 73, 161, .52)"
        };
      }
      if (label.includes("ヘソ") || label.includes("ステージ")) {
        return {
          fill: "rgba(255, 232, 96, .16)",
          stroke: "rgba(255, 216, 82, .84)",
          glow: "rgba(255, 180, 38, .55)"
        };
      }
      return {
        fill: "rgba(0, 229, 255, .16)",
        stroke: "rgba(86, 240, 255, .82)",
        glow: "rgba(0, 229, 255, .55)"
      };
    }

    function drawPolygonPath(points) {
      if (!points.length) return;
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.closePath();
    }

    function drawLaunchPorts(w, h) {
      ctx.save();
      const port = hitAreas.launch;
      const x = sx(port.x);
      const y = sy(port.y);
      const r = port.r / 720 * w;
      const color = isJackpotActive() ? "#ffd36a" : "#66e3ff";
      ctx.fillStyle = "rgba(255,255,255,.18)";
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(2, w * .004);
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, Math.max(5, r * .34), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawStage(w, h) {
      ctx.save();
      ctx.fillStyle = "rgba(255,255,255,.12)";
      ctx.strokeStyle = "rgba(255,255,255,.34)";
      ctx.lineWidth = 2;
      roundRect(sx(284), sy(708), sx(152), sy(40), 8);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.68)";
      ctx.font = `800 ${Math.max(11, w * .026)}px "Segoe UI", "Noto Sans JP", sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("STAGE", sx(360), sy(728));
      ctx.restore();
    }

    function drawRouteGuides(w, h) {
      const jackpot = isJackpotActive();
      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `900 ${Math.max(13, w * .033)}px "Segoe UI", "Noto Sans JP", sans-serif`;

      ctx.fillStyle = jackpot ? "rgba(102, 227, 255, .16)" : "rgba(102, 227, 255, .34)";
      ctx.strokeStyle = jackpot ? "rgba(102, 227, 255, .28)" : "rgba(102, 227, 255, .86)";
      ctx.lineWidth = 2;
      roundRect(w * .06, h * .18, w * .22, h * .08, 8);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#dff8ff";

      ctx.fillStyle = jackpot ? "rgba(255, 111, 159, .36)" : "rgba(255, 111, 159, .12)";
      ctx.strokeStyle = jackpot ? "rgba(255, 211, 106, .94)" : "rgba(255, 111, 159, .25)";
      roundRect(w * .72, h * .18, w * .22, h * .08, 8);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = jackpot ? "#fff4c2" : "rgba(255, 255, 255, .55)";

      drawArrow(w * .19, h * .25, w * .30, h * .67, jackpot ? "rgba(102,227,255,.24)" : "rgba(102,227,255,.82)");
      drawArrow(w * .82, h * .25, w * .85, h * .60, jackpot ? "rgba(255,211,106,.90)" : "rgba(255,111,159,.25)");
      ctx.restore();
    }

    function drawArrow(x1, y1, x2, y2, color) {
      const angle = Math.atan2(y2 - y1, x2 - x1);
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.quadraticCurveTo((x1 + x2) / 2, y1 - 18, x2, y2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - Math.cos(angle - .5) * 18, y2 - Math.sin(angle - .5) * 18);
      ctx.lineTo(x2 - Math.cos(angle + .5) * 18, y2 - Math.sin(angle + .5) * 18);
      ctx.closePath();
      ctx.fill();
    }

    function drawRails(w, h) {
      ctx.strokeStyle = "rgba(255,255,255,.28)";
      ctx.lineWidth = Math.max(8, w * .016);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(w * .09, h * .88);
      ctx.bezierCurveTo(w * .04, h * .55, w * .16, h * .10, w * .50, h * .06);
      ctx.bezierCurveTo(w * .76, h * .03, w * .92, h * .25, w * .91, h * .56);
      ctx.stroke();

      ctx.strokeStyle = "rgba(102,227,255,.32)";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawPins() {
      const palette = {
        hot: ["#ff3b35", "rgba(255, 232, 71, .32)"],
        warp: ["#ff3b35", "rgba(255, 232, 71, .30)"],
        road: ["#ff3b35", "rgba(255, 232, 71, .28)"],
        heso: ["#fff4c2", "rgba(102, 227, 255, .30)"],
        spill: ["#d6e3ee", "rgba(255,255,255,.18)"],
        attacker: ["#ffd36a", "rgba(255, 111, 159, .30)"],
        normal: ["#dde9f5", "rgba(102,227,255,.22)"]
      };
      pins.forEach(pin => {
        const x = sx(pin.x);
        const y = sy(pin.y);
        const r = Math.max(1.45, fixedPinRadius / 720 * canvas.clientWidth);
        const colors = palette[pin.kind] || palette.normal;
        if (pin.kind && pin.kind !== "normal") {
          ctx.fillStyle = colors[1];
          ctx.beginPath();
          ctx.arc(x, y, r * 1.18, 0, Math.PI * 2);
          ctx.fill();
        }
        if (nailImageReady) {
          const size = r * 2.45;
          ctx.drawImage(nailImage, x - size / 2, y - size / 2, size, size);
        } else {
          ctx.fillStyle = colors[0];
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = pin.kind === "normal" ? colors[1] : "rgba(255,255,255,.45)";
          ctx.beginPath();
          ctx.arc(x - r * .35, y - r * .35, r * .36, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    function drawPinEditorOverlay(w, h) {
      if (!state.pinEditor) return;
      ctx.save();
      ctx.strokeStyle = "rgba(255,255,255,.55)";
      ctx.lineWidth = 1;
      for (let x = 0; x <= 720; x += 60) {
        ctx.beginPath();
        ctx.moveTo(sx(x), 0);
        ctx.lineTo(sx(x), h);
        ctx.stroke();
      }
      for (let y = 0; y <= 900; y += 60) {
        ctx.beginPath();
        ctx.moveTo(0, sy(y));
        ctx.lineTo(w, sy(y));
        ctx.stroke();
      }
      state.selectedPins.forEach(index => {
        const pin = pins[index];
        if (!pin) return;
        const x = sx(pin.x);
        const y = sy(pin.y);
        ctx.strokeStyle = "#66e3ff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, Math.max(9, fixedPinRadius / 720 * canvas.clientWidth + 8), 0, Math.PI * 2);
        ctx.stroke();
      });
      allHitTargetSpecs().forEach(spec => {
        if (!state.selectedHits.has(spec.id)) return;
        ctx.strokeStyle = "#ffd36a";
        ctx.lineWidth = 2;
        if (spec.shape === "circle") {
          const r = spec.obj.r / 720 * w;
          ctx.beginPath();
          ctx.arc(sx(spec.obj.x), sy(spec.obj.y), r + 6, 0, Math.PI * 2);
          ctx.stroke();
          return;
        }
        if (spec.shape === "poly") {
          const points = acrylicCanvasPoints(spec.obj);
          drawPolygonPath(points);
          ctx.stroke();
          ctx.fillStyle = "#ffd36a";
          points.forEach(point => {
            ctx.beginPath();
            ctx.rect(point.x - 5, point.y - 5, 10, 10);
            ctx.fill();
          });
          return;
        }
        if (spec.shape === "curve") {
          const controls = acrylicControlCanvasPoints(spec.obj);
          ctx.save();
          ctx.setLineDash([6, 5]);
          ctx.strokeStyle = "#ffd36a";
          ctx.beginPath();
          ctx.moveTo(controls[0].x, controls[0].y);
          ctx.lineTo(controls[1].x, controls[1].y);
          ctx.lineTo(controls[2].x, controls[2].y);
          ctx.stroke();
          ctx.restore();
          ctx.fillStyle = "#ffd36a";
          controls.forEach(point => {
            ctx.beginPath();
            ctx.rect(point.x - 5, point.y - 5, 10, 10);
            ctx.fill();
          });
          return;
        }
        const box = hitRectBounds(spec);
        roundRect(sx(box.x), sy(box.y), box.w / 720 * w, box.h / 900 * h, 8);
        ctx.stroke();
      });
      if (state.selectionRect) {
        const rect = normalizedRect(state.selectionRect);
        ctx.fillStyle = "rgba(102, 227, 255, .14)";
        ctx.strokeStyle = "rgba(102, 227, 255, .95)";
        ctx.lineWidth = 2;
        roundRect(sx(rect.x), sy(rect.y), rect.w / 720 * w, rect.h / 900 * h, 6);
        ctx.fill();
        ctx.stroke();
      }
      if (state.selectedPin >= 0 && pins[state.selectedPin]) {
        const pin = pins[state.selectedPin];
        const x = sx(pin.x);
        const y = sy(pin.y);
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, y, Math.max(9, fixedPinRadius / 720 * canvas.clientWidth + 8), 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawPockets() {
      pockets.forEach(p => {
        // The jackpot checker remains physical, but its old V circle/label is
        // hidden because the generated ambulance gate is the visible device.
        if (p.type === "attacker") return;
        const x = sx(p.x);
        const y = sy(p.y);
        const r = p.r / 720 * canvas.clientWidth;
        if (p.shape === "bowl") {
          const bw = (p.w || 104) / 720 * canvas.clientWidth;
          const bh = (p.h || 42) / 900 * canvas.clientHeight;
          const bottomW = bw * .56;
          const left = x - bw / 2;
          const right = x + bw / 2;
          const bottomLeft = x - bottomW / 2;
          const bottomRight = x + bottomW / 2;
          ctx.fillStyle = "rgba(0,0,0,.66)";
          ctx.beginPath();
          ctx.moveTo(left - 5, y - 3);
          ctx.lineTo(right + 5, y - 3);
          ctx.quadraticCurveTo(right - bw * .10, y + bh * .78, bottomRight + 5, y + bh + 5);
          ctx.lineTo(bottomLeft - 5, y + bh + 5);
          ctx.quadraticCurveTo(left + bw * .10, y + bh * .78, left - 5, y - 3);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = p.color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(left, y);
          ctx.lineTo(right, y);
          ctx.quadraticCurveTo(right - bw * .10, y + bh * .72, bottomRight, y + bh);
          ctx.lineTo(bottomLeft, y + bh);
          ctx.quadraticCurveTo(left + bw * .10, y + bh * .72, left, y);
          ctx.stroke();
          ctx.strokeStyle = "rgba(136,149,164,.90)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(bottomLeft, y + bh);
          ctx.lineTo(bottomRight, y + bh);
          ctx.stroke();
          ctx.fillStyle = "#ffffff";
          ctx.font = `800 ${Math.max(8, bh * .24)}px "Segoe UI", sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(p.label, x, y + bh * .38);
          return;
        }
        if (p.shape === "semicircle" || p.type === "out") {
          ctx.fillStyle = "rgba(0,0,0,.68)";
          ctx.beginPath();
          ctx.arc(x, y, r + 6, Math.PI, Math.PI * 2);
          ctx.lineTo(x + r + 6, y + 10);
          ctx.lineTo(x - r - 6, y + 10);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = p.color;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(x, y, r, Math.PI, Math.PI * 2);
          ctx.stroke();
          return;
        }
        if (p.type === "start" && startRescueGateReady) {
          const size = r * 4.8;
          ctx.save();
          ctx.shadowColor = state.startMeter >= 1 ? "rgba(255, 78, 62, .90)" : "rgba(53, 212, 255, .60)";
          ctx.shadowBlur = Math.max(6, r * .55);
          ctx.drawImage(startRescueGateImage, x - size / 2, y - size * .58, size, size);
          ctx.restore();
          return;
        }
        const outer = p.type === "start" ? 2 : 5;
        ctx.fillStyle = "rgba(0,0,0,.62)";
        ctx.beginPath();
        ctx.arc(x, y, r + outer, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.type === "start" ? 2 : 3;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = p.type === "out" ? "#8895a4" : "#ffffff";
        ctx.font = `800 ${Math.max(9, r * (p.type === "start" ? .55 : .42))}px "Segoe UI", sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(p.label, x, y);
      });
    }

    function drawRightDevice(w, h) {
      const active = isJackpotActive();
      const open = state.rightDeviceOpen;
      const device = hitAreas.rightDevice;
      const cx = sx(device.x);
      const cy = sy(device.y);
      const scale = canvas.clientWidth / 720;
      const flap = open ? 1 : 0;

      ctx.save();
      ctx.translate(cx, cy);

      if (ambulanceLightBarReady) {
        // Crop the generated square sprite to its opaque light-bar artwork,
        // then use each half as a hinged gate leaf.
        const sourceX = 17;
        const sourceY = 485;
        const sourceWidth = 1221;
        const sourceHeight = 297;
        const sourceHalf = sourceWidth / 2;
        const gateWidth = 112 * scale;
        const gateHalf = gateWidth / 2;
        const gateHeight = gateWidth * sourceHeight / sourceWidth;
        const gateY = 42 * scale;
        const openAngle = flap * Math.PI * .31;
        const brightness = active ? 1.12 + Math.sin(performance.now() / 90) * .18 : 1;

        ctx.save();
        ctx.globalAlpha = 1;
        ctx.filter = `brightness(${brightness}) saturate(${active ? 1.18 : 1})`;
        ctx.shadowColor = active ? "rgba(255, 58, 67, .88)" : "rgba(74, 205, 255, .38)";
        ctx.shadowBlur = active ? 14 * scale : 6 * scale;

        ctx.save();
        ctx.translate(-gateHalf, gateY);
        ctx.rotate(-openAngle);
        ctx.drawImage(
          ambulanceLightBarImage,
          sourceX, sourceY, sourceHalf, sourceHeight,
          0, -gateHeight / 2, gateHalf, gateHeight
        );
        ctx.restore();

        ctx.save();
        ctx.translate(gateHalf, gateY);
        ctx.rotate(openAngle);
        ctx.drawImage(
          ambulanceLightBarImage,
          sourceX + sourceHalf, sourceY, sourceHalf, sourceHeight,
          -gateHalf, -gateHeight / 2, gateHalf, gateHeight
        );
        ctx.restore();
        ctx.restore();
      }
      ctx.restore();
    }

    function drawBalls(predicate = null) {
      balls.forEach(ball => {
        if (predicate && !predicate(ball)) return;
        if (ball.trail?.length > 1) {
          ctx.save();
          ball.trail.forEach((point, index) => {
            const alpha = (index + 1) / ball.trail.length * .23;
            const scale = .58 + index / ball.trail.length * .34;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = "rgba(210, 232, 255, .72)";
            ctx.beginPath();
            ctx.arc(point.x, point.y, ball.r * scale, 0, Math.PI * 2);
            ctx.fill();
          });
          ctx.restore();
        }
        if (ballImageReady) {
          const size = ball.r * 2.35;
          ctx.save();
          ctx.translate(ball.x, ball.y);
          ctx.rotate(ball.angle || 0);
          ctx.drawImage(ballImage, -size / 2, -size / 2, size, size);
          ctx.restore();
        } else {
          const g = ctx.createRadialGradient(ball.x - ball.r * .35, ball.y - ball.r * .45, 1, ball.x, ball.y, ball.r * 1.2);
          g.addColorStop(0, "#ffffff");
          g.addColorStop(.42, "#dce9f7");
          g.addColorStop(1, "#708092");
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
          ctx.fill();
        }
        if (ball.glow > .45) {
          ctx.strokeStyle = `rgba(102,227,255,${(ball.glow - .45) * .85})`;
          ctx.lineWidth = 3;
          ctx.stroke();
        }
      });
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life / 50);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      });
    }

    function drawLauncher(w, h) {
      const jackpot = isJackpotActive();
      ctx.fillStyle = "rgba(255,211,106,.18)";
      roundRect(w * .10, h * .12, w * .08, h * .16, 7);
      ctx.fill();
      ctx.strokeStyle = jackpot ? "rgba(255,255,255,.20)" : "rgba(102,227,255,.85)";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = jackpot ? "#6f7b89" : "#66e3ff";
      ctx.beginPath();
      ctx.arc(w * .14, h * .19, Math.max(12, w * .024), 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = jackpot ? "rgba(255,211,106,.24)" : "rgba(255,111,159,.10)";
      roundRect(w * .86, h * .12, w * .08, h * .16, 7);
      ctx.fill();
      ctx.strokeStyle = jackpot ? "rgba(255,211,106,.88)" : "rgba(255,255,255,.18)";
      ctx.stroke();
      ctx.fillStyle = jackpot ? "#ffd36a" : "#4b5563";
      ctx.beginPath();
      ctx.arc(w * .90, h * .19, Math.max(12, w * .024), 0, Math.PI * 2);
      ctx.fill();
    }

    function drawPushButton(w, h) {
      const button = pushButtonShape();
      const pulse = .55 + Math.sin(performance.now() / 260) * .08;
      ctx.save();
      ctx.translate(button.x, button.y);

      ctx.fillStyle = "rgba(0,0,0,.36)";
      ctx.beginPath();
      ctx.ellipse(0, button.r * .92, button.r * .95, button.r * .22, 0, 0, Math.PI * 2);
      ctx.fill();

      const rim = ctx.createRadialGradient(-button.r * .25, -button.r * .35, button.r * .10, 0, 0, button.r * 1.08);
      rim.addColorStop(0, "rgba(255,255,255,.86)");
      rim.addColorStop(.34, "rgba(210,244,255,.38)");
      rim.addColorStop(.58, "rgba(102,227,255,.20)");
      rim.addColorStop(1, "rgba(8,12,18,.86)");
      ctx.fillStyle = rim;
      ctx.beginPath();
      ctx.arc(0, 0, button.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(255,255,255,.38)";
      ctx.lineWidth = Math.max(3, w * .006);
      ctx.stroke();

    function drawDebugLabel(text, x, y, color) {
      if (!state.pinEditor) return;
      ctx.save();
      ctx.font = `800 ${Math.max(10, canvas.clientWidth * .018)}px "Segoe UI", "Noto Sans JP", sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const metrics = ctx.measureText(text);
      const pad = 5;
      const h = Math.max(18, canvas.clientWidth * .030);
      ctx.fillStyle = "rgba(4, 8, 13, .78)";
      roundRect(x - metrics.width / 2 - pad, y - h / 2, metrics.width + pad * 2, h, 5);
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.fillStyle = color;
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
    }

    function loop(now) {
      const dt = Math.min(32, now - lastTime);
      lastTime = now;
      physicsAccumulator = Math.min(48, physicsAccumulator + dt);
      while (physicsAccumulator >= fixedPhysicsStep) {
        update(fixedPhysicsStep);
        physicsAccumulator -= fixedPhysicsStep;
      }
      draw();
      requestAnimationFrame(loop);
    }

    function ensureExtraHitOptions() {

      options.forEach(([value, label]) => {

    function selectedAcrylicIndexes() {
      const indexes = new Set();
      state.selectedHits.forEach(id => {
        if (!id.startsWith("acrylic:")) return;
        const index = Number(id.split(":")[1]);
        if (Number.isInteger(index) && acrylicParts[index]) indexes.add(index);
      });
      const value = els.hitTarget?.value || "";
      if (value.startsWith("acrylic:")) {
        const index = Number(value.split(":")[1]);
        if (Number.isInteger(index) && acrylicParts[index]) indexes.add(index);
      }
      return [...indexes].sort((a, b) => b - a);
    }

    function normalizeAcrylic(part) {
      if (part.type === "curve") {
        if (!Array.isArray(part.points) || part.points.length < 3) {
          const x = part.x || 360;
          const y = part.y || 450;
          const w = part.w || 140;
          const h = part.h || 70;
          part.points = [
            { x: x - w / 2, y },
            { x, y: y - h },
            { x: x + w / 2, y }
          ];
        }
        part.thickness = Math.max(4, Number(part.thickness || part.h || 22));
        updateAcrylicMetrics(part);
        return part;
      }
      if (!Array.isArray(part.points) || part.points.length < 3) {
        const left = (part.x || 0) - (part.w || 1) / 2;
        const top = (part.y || 0) - (part.h || 1) / 2;
        const right = left + (part.w || 1);
        const bottom = top + (part.h || 1);
        part.points = [
          { x: left, y: top },
          { x: right, y: top },
          { x: right, y: bottom },
          { x: left, y: bottom }
        ];
      }
      updateAcrylicMetrics(part);
      return part;
    }

    function updateAcrylicMetrics(part) {
      const xs = part.points.map(point => point.x);
      const ys = part.points.map(point => point.y);
      const left = Math.min(...xs);
      const right = Math.max(...xs);
      const top = Math.min(...ys);
      const bottom = Math.max(...ys);
      part.x = Math.round((left + right) * 5) / 10;
      part.y = Math.round((top + bottom) * 5) / 10;
      part.w = Math.max(1, Math.round((right - left) * 10) / 10);
      part.h = Math.max(1, Math.round((bottom - top) * 10) / 10);
    }

    function acrylicBounds(part) {
      normalizeAcrylic(part);
      return { x: part.x - part.w / 2, y: part.y - part.h / 2, w: part.w, h: part.h };
    }

    function acrylicCanvasPoints(part) {
      normalizeAcrylic(part);
      if (part.type === "curve") {
        const p = part.points;
        const sampled = [];
        for (let i = 0; i <= 24; i++) {
          const t = i / 24;
          const a = (1 - t) * (1 - t);
          const b = 2 * (1 - t) * t;
          const c = t * t;
          sampled.push({
            x: sx(a * p[0].x + b * p[1].x + c * p[2].x),
            y: sy(a * p[0].y + b * p[1].y + c * p[2].y)
          });
        }
        return sampled;
      }
      return part.points.map(point => ({ x: sx(point.x), y: sy(point.y) }));
    }

    function acrylicControlCanvasPoints(part) {
      normalizeAcrylic(part);
      return part.points.map(point => ({ x: sx(point.x), y: sy(point.y) }));
    }

    function setAcrylicBounds(part, x, y, w, h) {
      normalizeAcrylic(part);
      if (part.type === "curve") {
        const before = acrylicBounds(part);
        const sxScale = w / Math.max(1, before.w);
        const syScale = Math.max(.1, h / Math.max(1, before.h));
        part.points = part.points.map(point => ({
          x: x - w / 2 + (point.x - before.x) * sxScale,
          y: y - h / 2 + (point.y - before.y) * syScale
        }));
        part.thickness = Math.max(4, Number(els.hitR?.value || part.thickness || 22));
        updateAcrylicMetrics(part);
        return;
      }
      const before = acrylicBounds(part);
      const sxScale = w / Math.max(1, before.w);
      const syScale = h / Math.max(1, before.h);
      part.points = part.points.map(point => ({
        x: x - w / 2 + (point.x - before.x) * sxScale,
        y: y - h / 2 + (point.y - before.y) * syScale
      }));
      updateAcrylicMetrics(part);
    }

    function moveAcrylic(part, dx, dy) {
      normalizeAcrylic(part);
      part.points.forEach(point => {
        point.x = Math.max(0, Math.min(720, Math.round((point.x + dx) * 10) / 10));
        point.y = Math.max(0, Math.min(900, Math.round((point.y + dy) * 10) / 10));
      });
      updateAcrylicMetrics(part);
    }

    function pointInPolygon(point, polygon) {
      let inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const a = polygon[i];
        const b = polygon[j];
        if (((a.y > point.y) !== (b.y > point.y)) && point.x < (b.x - a.x) * (point.y - a.y) / ((b.y - a.y) || .0001) + a.x) inside = !inside;
      }
      return inside;
    }

    function hitTargetSpec() {
      const value = els.hitTarget?.value || "lcd";
      if (value.startsWith("acrylic:")) {
        const index = Number(value.split(":")[1]);
        const part = normalizeAcrylic(acrylicParts[index]);
        return { id: value, obj: part, shape: part.type === "curve" ? "curve" : "poly", anchor: "center", label: part.label || value };
      }
      if (value.startsWith("pocket:")) {
        const index = Number(value.split(":")[1]);
        return { id: value, obj: pockets[index], shape: "circle", label: pockets[index]?.type || value };
      }
      if (value === "rightDevice") return { id: value, obj: hitAreas.rightDevice, shape: "rect", anchor: "center", label: "rightDevice" };
      if (value === "windmill") return { id: value, obj: hitAreas.windmill, shape: "circle", label: "windmill" };
      if (value === "launch" || value === "launchLeft" || value === "launchRight") return { id: "launch", obj: hitAreas.launch, shape: "circle", label: "launch" };
      if (value === "push") return { id: value, obj: hitAreas.push, shape: "circle", label: "push" };
      if (value === "handle") return { id: value, obj: hitAreas.handle, shape: "circle", label: "handle" };
      return { id: "lcd", obj: hitAreas.lcd, shape: "rect", anchor: "topLeft", label: "lcd" };
    }

    function allHitTargetSpecs() {
      return [
        { id: "lcd", obj: hitAreas.lcd, shape: "rect", anchor: "topLeft", label: "lcd" },
        ...pockets.map((pocket, index) => ({ id: `pocket:${index}`, obj: pocket, shape: "circle", label: pocket.type })),
        { id: "rightDevice", obj: hitAreas.rightDevice, shape: "rect", anchor: "center", label: "rightDevice" },
        { id: "windmill", obj: hitAreas.windmill, shape: "circle", label: "windmill" },
        { id: "launch", obj: hitAreas.launch, shape: "circle", label: "launch" },
        ...acrylicParts.map((part, index) => {
          const obj = normalizeAcrylic(part);
          return { id: `acrylic:${index}`, obj, shape: obj.type === "curve" ? "curve" : "poly", anchor: "center", label: part.label || `A${index + 1}` };
        }),
        { id: "push", obj: hitAreas.push, shape: "circle", label: "push" },
        { id: "handle", obj: hitAreas.handle, shape: "circle", label: "handle" }
      ];
    }

    function hitRectBounds(spec) {
      if (spec.shape === "poly" || spec.shape === "curve") return acrylicBounds(spec.obj);
      if (spec.anchor === "center") {
        return {
          x: spec.obj.x - spec.obj.w / 2,
          y: spec.obj.y - spec.obj.h / 2,
          w: spec.obj.w,
          h: spec.obj.h
        };
      }
      return { x: spec.obj.x, y: spec.obj.y, w: spec.obj.w, h: spec.obj.h };
    }

    function hitCenter(spec) {
      if (spec.shape === "circle" || spec.anchor === "center") return { x: spec.obj.x, y: spec.obj.y };
      return { x: spec.obj.x + spec.obj.w / 2, y: spec.obj.y + spec.obj.h / 2 };
    }

    function findHitAt(point) {
      const specs = allHitTargetSpecs();
      for (let i = specs.length - 1; i >= 0; i--) {
        const spec = specs[i];
        if (spec.shape === "circle") {
          if (Math.hypot(point.x - spec.obj.x, point.y - spec.obj.y) <= spec.obj.r + 8) return spec;
        } else if (spec.shape === "poly") {
          if (pointInPolygon(point, spec.obj.points)) return spec;
        } else if (spec.shape === "curve") {
          const points = acrylicCanvasPoints(spec.obj);
          for (let j = 0; j < points.length - 1; j++) {
            const a = { x: points[j].x / canvas.clientWidth * 720, y: points[j].y / canvas.clientHeight * 900 };
            const b = { x: points[j + 1].x / canvas.clientWidth * 720, y: points[j + 1].y / canvas.clientHeight * 900 };
            const hit = nearestPointOnSegment(point.x, point.y, a.x, a.y, b.x, b.y);
            if (hit.dist <= Math.max(10, (spec.obj.thickness || 22) / 2 + 8)) return spec;
          }
        } else {
          const box = hitRectBounds(spec);
          if (point.x >= box.x && point.x <= box.x + box.w && point.y >= box.y && point.y <= box.y + box.h) return spec;
        }
      }
      return null;
    }

    function findAcrylicCornerAt(point) {
      const active = [...state.selectedHits]
        .map(id => allHitTargetSpecs().find(spec => spec.id === id))
        .filter(spec => spec?.shape === "poly" || spec?.shape === "curve");
      for (const spec of active) {
        normalizeAcrylic(spec.obj);
        for (let i = 0; i < spec.obj.points.length; i++) {
          const corner = spec.obj.points[i];
          if (Math.hypot(point.x - corner.x, point.y - corner.y) <= 12) return { spec, index: i };
        }
      }
      return null;
    }

    function normalizedRect(rect) {
      const x = Math.min(rect.x1, rect.x2);
      const y = Math.min(rect.y1, rect.y2);
      return { x, y, w: Math.abs(rect.x2 - rect.x1), h: Math.abs(rect.y2 - rect.y1) };
    }

    function pointInRect(point, rect) {
      return point.x >= rect.x && point.x <= rect.x + rect.w && point.y >= rect.y && point.y <= rect.y + rect.h;
    }

    function clearMultiSelection() {
      state.selectedPins.clear();
      state.selectedHits.clear();
    }

    function captureDragOrigins() {
      return {
        pins: [...state.selectedPins].map(index => ({ index, x: pins[index]?.x || 0, y: pins[index]?.y || 0 })),
        hits: [...state.selectedHits].map(id => {
          const spec = allHitTargetSpecs().find(item => item.id === id);
          return spec ? {
            id,
            x: spec.obj.x,
            y: spec.obj.y,
            points: (spec.shape === "poly" || spec.shape === "curve") ? spec.obj.points.map(point => ({ ...point })) : null
          } : null;
        }).filter(Boolean)
      };
    }

    function moveSelectionFromOrigins(dx, dy) {
      state.dragOrigins.pins.forEach(origin => {
        if (!pins[origin.index]) return;
        pins[origin.index].x = Math.max(0, Math.min(720, Math.round((origin.x + dx) * 10) / 10));
        pins[origin.index].y = Math.max(0, Math.min(900, Math.round((origin.y + dy) * 10) / 10));
      });
      state.dragOrigins.hits.forEach(origin => {
        const spec = allHitTargetSpecs().find(item => item.id === origin.id);
        if (!spec) return;
        if ((spec.shape === "poly" || spec.shape === "curve") && origin.points) {
          spec.obj.points = origin.points.map(point => ({
            x: Math.max(0, Math.min(720, Math.round((point.x + dx) * 10) / 10)),
            y: Math.max(0, Math.min(900, Math.round((point.y + dy) * 10) / 10))
          }));
          updateAcrylicMetrics(spec.obj);
          return;
        }
        spec.obj.x = Math.max(0, Math.min(720, Math.round((origin.x + dx) * 10) / 10));
        spec.obj.y = Math.max(0, Math.min(900, Math.round((origin.y + dy) * 10) / 10));
      });
      syncHitEditorUi();
      syncLcdDomToHitArea();
      syncCabinetPartsToHitAreas();
    }

    function nudgeSelection(dx, dy) {
      if (state.selectedPins.size + state.selectedHits.size <= 0) return;
      state.dragOrigins = captureDragOrigins();
      moveSelectionFromOrigins(dx, dy);
      state.dragOrigins = null;
      syncPinEditorUi();
    }

    function finishSelectionRect() {
      if (!state.selectionRect) return;
      const rect = normalizedRect(state.selectionRect);
      clearMultiSelection();
      pins.forEach((pin, index) => {
        if (pointInRect(pin, rect)) state.selectedPins.add(index);
      });
      allHitTargetSpecs().forEach(spec => {
        if (pointInRect(hitCenter(spec), rect)) state.selectedHits.add(spec.id);
      });
      if (state.selectedPins.size > 0) state.selectedPin = [...state.selectedPins][0];
      else state.selectedPin = -1;
      state.selectionRect = null;
      syncPinEditorUi();
    }

    function setHitOutput(input, output) {
      if (input && output) output.textContent = input.value;
    }

    function lockLcdAspect(changedId = "hitW") {
      const lcd = hitAreas.lcd;
      if (!lcd) return;
      if (changedId === "hitH") {
        lcd.h = Math.max(1, Math.round(lcd.h));
        lcd.w = Math.max(1, Math.round(lcd.h * 4 / 3));
      } else {
        lcd.w = Math.max(1, Math.round(lcd.w));
        lcd.h = Math.max(1, Math.round(lcd.w * 3 / 4));
      }
    }

    function syncHitEditorUi() {
      const spec = hitTargetSpec();
      if (!spec.obj || !els.hitX) return;
      const isCircle = spec.shape === "circle";
      const isCurve = spec.shape === "curve";
      els.hitX.value = Math.round(spec.obj.x ?? 0);
      els.hitY.value = Math.round(spec.obj.y ?? 0);
      els.hitR.value = Math.round(isCurve ? spec.obj.thickness ?? 22 : spec.obj.r ?? 0);
      els.hitW.value = Math.round(spec.obj.w ?? 0);
      els.hitH.value = Math.round(spec.obj.h ?? 0);
      els.hitR.disabled = !isCircle && !isCurve;
      els.hitW.disabled = isCircle;
      els.hitH.disabled = isCircle;
      setHitOutput(els.hitX, els.hitXValue);
      setHitOutput(els.hitY, els.hitYValue);
      setHitOutput(els.hitR, els.hitRValue);
      setHitOutput(els.hitW, els.hitWValue);
      setHitOutput(els.hitH, els.hitHValue);
    }

    function applyHitEditorValue(changedId = "") {
      const spec = hitTargetSpec();
      if (!spec.obj) return;
      spec.obj.x = Number(els.hitX?.value || spec.obj.x || 0);
      spec.obj.y = Number(els.hitY?.value || spec.obj.y || 0);
      if (spec.shape === "circle") {
        spec.obj.r = Math.max(1, Number(els.hitR?.value || spec.obj.r || 1));
      } else if (spec.shape === "poly" || spec.shape === "curve") {
        setAcrylicBounds(
          spec.obj,
          Number(els.hitX?.value || spec.obj.x || 0),
          Number(els.hitY?.value || spec.obj.y || 0),
          Math.max(1, Number(els.hitW?.value || spec.obj.w || 1)),
          Math.max(1, Number(els.hitH?.value || spec.obj.h || 1))
        );
      } else {
        spec.obj.w = Math.max(1, Number(els.hitW?.value || spec.obj.w || 1));
        spec.obj.h = Math.max(1, Number(els.hitH?.value || spec.obj.h || 1));
        if (spec.id === "lcd") lockLcdAspect(changedId);
      }
      syncLcdDomToHitArea();
      syncCabinetPartsToHitAreas();
    }

    function boardCssMetrics() {
      return state.boardZoom
        ? { leftInset: 12, topInset: 96 }
        : { leftInset: 62, topInset: 122 };
    }

    function syncLcdDomToHitArea() {
      if (!els.centerScreen || els.centerScreen.classList.contains("zoomed")) return;
      const lcd = hitAreas.lcd;
      const { leftInset, topInset } = boardCssMetrics();
      els.centerScreen.style.left = `${leftInset + lcd.x}px`;
      els.centerScreen.style.top = `${topInset + lcd.y}px`;
      els.centerScreen.style.width = `${lcd.w}px`;
      els.centerScreen.style.height = `${lcd.h}px`;
    }

    function syncCabinetPartsToHitAreas() {
      if (!els.launchHandle) return;
      const guard = hitAreas.handle;
      const { leftInset, topInset } = boardCssMetrics();
      const size = Math.max(32, guard.r * 2);
      els.launchHandle.style.left = `${leftInset + guard.x - size / 2}px`;
      els.launchHandle.style.top = `${topInset + guard.y - size / 2}px`;
      els.launchHandle.style.width = `${size}px`;
      els.launchHandle.style.right = "auto";
      els.launchHandle.style.bottom = "auto";
    }

    function boardPointFromEvent(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: Math.max(0, Math.min(720, (event.clientX - rect.left) / rect.width * 720)),
        y: Math.max(0, Math.min(900, (event.clientY - rect.top) / rect.height * 900))
      };
    }

    function findPinAt(point) {
      for (let i = pins.length - 1; i >= 0; i--) {
        const pin = pins[i];
        const hit = Math.max(10, pin.r + 8);
        if (Math.hypot(point.x - pin.x, point.y - pin.y) <= hit) return i;
      }
      return -1;
    }

    function roundPin(pin) {
      return {
        x: Math.round(pin.x * 10) / 10,
        y: Math.round(pin.y * 10) / 10,
        r: fixedPinRadius,
        kind: pin.kind || "normal"
      };
    }

    function serializeLayout() {
      return {
        pins: pins.map(roundPin),
        acrylicParts: acrylicParts.map(part => {
          const normalized = normalizeAcrylic(part);
          return {
            type: normalized.type || "poly",
            label: normalized.label || "",
            thickness: normalized.thickness,
            points: normalized.points.map(point => ({
              x: Math.round(point.x * 10) / 10,
              y: Math.round(point.y * 10) / 10
            }))
          };
        }),
        pockets: pockets.map(p => ({
          x: Math.round(p.x * 10) / 10,
          y: Math.round(p.y * 10) / 10,
          r: Math.round(p.r * 10) / 10,
          type: p.type,
          label: p.label,
          color: p.color
        })),
        hitAreas: JSON.parse(JSON.stringify(hitAreas))
      };
    }

    function applyLayout(next) {
      const nextPins = Array.isArray(next) ? next : next.pins;
      if (!Array.isArray(nextPins)) throw new Error("JSON must include pins");
      pins.length = 0;
      nextPins.forEach(pin => {
        if (!Number.isFinite(Number(pin.x)) || !Number.isFinite(Number(pin.y))) return;
        pins.push({
          x: Number(pin.x),
          y: Number(pin.y),
          r: fixedPinRadius,
          kind: pin.kind || "normal"
        });
      });
      if (Array.isArray(next.pockets)) {
        next.pockets.forEach((pocket, index) => {
          if (!pockets[index]) return;
          if (Number.isFinite(Number(pocket.x))) pockets[index].x = Number(pocket.x);
          if (Number.isFinite(Number(pocket.y))) pockets[index].y = Number(pocket.y);
          if (Number.isFinite(Number(pocket.r))) pockets[index].r = Number(pocket.r);
        });
      }
      if (next.hitAreas && typeof next.hitAreas === "object") {
        Object.keys(hitAreas).forEach(key => {
          if (!next.hitAreas[key]) return;
          Object.assign(hitAreas[key], next.hitAreas[key]);
        });
        if (!next.hitAreas.launch && next.hitAreas.launchLeft) Object.assign(hitAreas.launch, next.hitAreas.launchLeft);
      }
      acrylicParts.length = 0;
      if (Array.isArray(next.acrylicParts)) {
        next.acrylicParts.forEach(part => {
          if (!Array.isArray(part.points) || part.points.length < 3) return;
          acrylicParts.push(normalizeAcrylic({
            type: part.type === "curve" ? "curve" : "poly",
            label: part.label || "",
            thickness: Number(part.thickness || 22),
            points: part.points.map(point => ({
              x: Number(point.x),
              y: Number(point.y)
            })).filter(point => Number.isFinite(point.x) && Number.isFinite(point.y))
          }));
        });
        ensureExtraHitOptions();
      } else {
        setupDefaultAcrylicParts();
      }
      removeHesoAcrylicHelpers();
      lockLcdAspect("hitW");
      state.selectedPin = -1;
      clearMultiSelection();
      syncHitEditorUi();
      syncLcdDomToHitArea();
      syncCabinetPartsToHitAreas();
    }

    function copyPinJson() {
      const text = JSON.stringify(serializeLayout(), null, 2);
      if (els.pinJson) els.pinJson.value = text;
      if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).catch(() => {});
      addLog("LAYOUT JSON copied");
    }

    function applyPinJson() {
      if (!els.pinJson?.value.trim()) return;
      try {
        const next = JSON.parse(els.pinJson.value);
        applyLayout(next);
        addLog(`LAYOUT JSON applied: ${pins.length} pins`);
      } catch (error) {
        addLog(`LAYOUT JSON error: ${error.message}`);
      }
    }

    function saveDefaultLayout() {
      try {
        const text = JSON.stringify(serializeLayout());
        localStorage.setItem(layoutStorageKey, text);
        if (els.pinJson) els.pinJson.value = JSON.stringify(serializeLayout(), null, 2);
        addLog("DEFAULT layout saved");
      } catch (error) {
        addLog(`DEFAULT save error: ${error.message}`);
      }
    }

    function clearDefaultLayout() {
      try {
        localStorage.removeItem(layoutStorageKey);
        addLog("DEFAULT layout cleared");
      } catch (error) {
        addLog(`DEFAULT clear error: ${error.message}`);
      }
    }

    function addAcrylicPart() {
      acrylicParts.length = 0;
      ensureExtraHitOptions();
      addLog("ACRYLIC disabled");
    }

    function addCurvePart() {
      acrylicParts.length = 0;
      ensureExtraHitOptions();
      addLog("CURVE disabled");
    }

    function loadDefaultLayout() {
      try {
        const text = localStorage.getItem(layoutStorageKey);
        if (!text) return;
        applyLayout(JSON.parse(text));
        addLog(`DEFAULT layout loaded: ${pins.length} pins`);
      } catch (error) {
        addLog(`DEFAULT load error: ${error.message}`);
      }
    }

    function handlePinPointerDown(event) {
      if (!state.pinEditor) return;
      event.preventDefault();
      const point = boardPointFromEvent(event);
      if (state.multiMove) {
        const pinIndex = findPinAt(point);
        const corner = findAcrylicCornerAt(point);
        if (corner) {
          state.dragMode = "acrylicCorner";
          state.acrylicCorner = corner;
          canvas.setPointerCapture?.(event.pointerId);
          return;
        }
        const hit = findHitAt(point);
        const clickedSelectedPin = pinIndex >= 0 && state.selectedPins.has(pinIndex);
        const clickedSelectedHit = hit && state.selectedHits.has(hit.id);
        if (clickedSelectedPin || clickedSelectedHit) {
          state.dragMode = "group";
          state.dragStart = point;
          state.dragOrigins = captureDragOrigins();
          canvas.setPointerCapture?.(event.pointerId);
          return;
        }
        if (!event.ctrlKey && !event.metaKey) clearMultiSelection();
        if (pinIndex >= 0) {
          state.selectedPins.add(pinIndex);
          state.selectedPin = pinIndex;
          state.dragMode = "group";
          state.dragStart = point;
          state.dragOrigins = captureDragOrigins();
          canvas.setPointerCapture?.(event.pointerId);
          syncPinEditorUi();
          return;
        }
        if (hit) {
          state.selectedHits.add(hit.id);
          state.selectedPin = -1;
          if (els.hitTarget) els.hitTarget.value = hit.id;
          state.dragMode = "group";
          state.dragStart = point;
          state.dragOrigins = captureDragOrigins();
          canvas.setPointerCapture?.(event.pointerId);
          syncPinEditorUi();
          syncHitEditorUi();
          return;
        }
        state.dragMode = "select";
        state.dragStart = point;
        state.selectionRect = { x1: point.x, y1: point.y, x2: point.x, y2: point.y };
        canvas.setPointerCapture?.(event.pointerId);
        syncPinEditorUi();
        return;
      }
      if (event.shiftKey) {
        pins.push({ x: Math.round(point.x), y: Math.round(point.y), r: fixedPinRadius, kind: els.pinKind?.value || "normal" });
        state.selectedPin = pins.length - 1;
        clearMultiSelection();
        state.selectedPins.add(state.selectedPin);
        state.draggingPin = true;
        canvas.setPointerCapture?.(event.pointerId);
        syncPinEditorUi();
        return;
      }
      state.selectedPin = findPinAt(point);
      clearMultiSelection();
      if (state.selectedPin >= 0) state.selectedPins.add(state.selectedPin);
      state.draggingPin = state.selectedPin >= 0;
      if (state.draggingPin) canvas.setPointerCapture?.(event.pointerId);
      syncPinEditorUi();
    }

    function handlePinPointerMove(event) {
      if (state.pinEditor && state.multiMove) {
        if (!state.dragMode || state.dragMode === "none") return;
        event.preventDefault();
        const point = boardPointFromEvent(event);
        if (state.dragMode === "acrylicCorner" && state.acrylicCorner?.spec?.obj) {
          const part = state.acrylicCorner.spec.obj;
          normalizeAcrylic(part);
          part.points[state.acrylicCorner.index] = {
            x: Math.max(0, Math.min(720, Math.round(point.x * 10) / 10)),
            y: Math.max(0, Math.min(900, Math.round(point.y * 10) / 10))
          };
          updateAcrylicMetrics(part);
          syncHitEditorUi();
          return;
        }
        if (state.dragMode === "select" && state.selectionRect) {
          state.selectionRect.x2 = point.x;
          state.selectionRect.y2 = point.y;
          return;
        }
        if (state.dragMode === "group" && state.dragStart && state.dragOrigins) {
          moveSelectionFromOrigins(point.x - state.dragStart.x, point.y - state.dragStart.y);
        }
        return;
      }
      if (!state.pinEditor || !state.draggingPin || state.selectedPin < 0 || !pins[state.selectedPin]) return;
      event.preventDefault();
      const point = boardPointFromEvent(event);
      pins[state.selectedPin].x = Math.round(point.x * 10) / 10;
      pins[state.selectedPin].y = Math.round(point.y * 10) / 10;
      syncPinEditorUi();
    }

    function stopPinDrag(event) {
      if (!state.pinEditor) return;
      if (state.multiMove && state.dragMode === "select") finishSelectionRect();
      state.draggingPin = false;
      state.dragMode = "none";
      state.dragStart = null;
      state.dragOrigins = null;
      state.acrylicCorner = null;
      if (event?.pointerId != null) canvas.releasePointerCapture?.(event.pointerId);
    }

    function deleteSelectedPin() {
      if (!state.pinEditor) return;
      const acrylicIndexes = selectedAcrylicIndexes();
      if (acrylicIndexes.length > 0) {
        acrylicIndexes.forEach(index => acrylicParts.splice(index, 1));
        clearMultiSelection();
        state.selectedPin = -1;
        state.draggingPin = false;
        state.acrylicCorner = null;
        ensureExtraHitOptions();
        if (els.hitTarget) els.hitTarget.value = "lcd";
        syncHitEditorUi();
        syncPinEditorUi();
        addLog(`ACRYLIC deleted: ${acrylicIndexes.length}`);
        return;
      }
      if (state.multiMove && state.selectedPins.size > 0) {
        [...state.selectedPins].sort((a, b) => b - a).forEach(index => pins.splice(index, 1));
        clearMultiSelection();
        state.selectedPin = -1;
        state.draggingPin = false;
        addLog("PIN group deleted");
        syncPinEditorUi();
        return;
      }
      if (state.selectedPin < 0) return;
      pins.splice(state.selectedPin, 1);
      state.selectedPin = -1;
      clearMultiSelection();
      state.draggingPin = false;
      addLog("PIN deleted");
      syncPinEditorUi();
    }

    els.fire.addEventListener("click", toggleAutoFire);
    els.speedMode.addEventListener("click", toggleSpeedMode);
    els.forceJackpot.addEventListener("click", toggleForceJackpot);
    els.viewOverview?.addEventListener("click", () => setMachineView(false));
    els.viewBoard?.addEventListener("click", () => setMachineView(true));
    els.pinEdit?.addEventListener("click", togglePinEditor);
    els.multiMove?.addEventListener("click", toggleMultiMove);
    els.pinCopy?.addEventListener("click", copyPinJson);
    els.pinApply?.addEventListener("click", applyPinJson);
    els.saveDefault?.addEventListener("click", saveDefaultLayout);
    els.clearDefault?.addEventListener("click", clearDefaultLayout);
    els.addAcrylic?.addEventListener("click", addAcrylicPart);
    els.addCurve?.addEventListener("click", addCurvePart);
    els.pinKind?.addEventListener("change", () => {
      if (state.selectedPin >= 0 && pins[state.selectedPin]) pins[state.selectedPin].kind = els.pinKind.value;
      syncPinEditorUi();
    });
    els.hitTarget?.addEventListener("change", syncHitEditorUi);
    [els.hitX, els.hitY, els.hitR, els.hitW, els.hitH].forEach(input => {
      input?.addEventListener("input", () => {
        applyHitEditorValue(input.id);
        syncHitEditorUi();
      });
    });
    canvas.addEventListener("pointerdown", handlePinPointerDown);
    canvas.addEventListener("pointermove", handlePinPointerMove);
    canvas.addEventListener("pointerup", stopPinDrag);
    canvas.addEventListener("pointercancel", stopPinDrag);
    canvas.addEventListener("pointerleave", stopPinDrag);
    window.addEventListener("keydown", event => {
      if (!state.pinEditor) return;
      if (state.multiMove && ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.key)) {
        event.preventDefault();
        const step = event.shiftKey ? 10 : 1;
        const dx = event.key === "ArrowLeft" ? -step : event.key === "ArrowRight" ? step : 0;
        const dy = event.key === "ArrowUp" ? -step : event.key === "ArrowDown" ? step : 0;
        nudgeSelection(dx, dy);
        return;
      }
      if (event.key === "Delete" || event.key === "Backspace") {
        event.preventDefault();
        deleteSelectedPin();
      }
    });
    document.getElementById("down").addEventListener("click", () => {
      setLaunchPower(state.launchPower - 2, true);
    });
    document.getElementById("up").addEventListener("click", () => {
      setLaunchPower(state.launchPower + 2, true);
    });
    els.power.addEventListener("input", () => setLaunchPower(els.power.value, true));
    els.handleAdjust?.addEventListener("input", () => setLaunchPower(els.handleAdjust.value, true));
    ["pointerdown", "click", "keydown"].forEach(type => {
      els.handleAdjust?.addEventListener(type, event => event.stopPropagation());
    });
    els.nailSetting.addEventListener("input", () => {
      updateNailSettingUi();
      const setting = currentNailSetting();
      addLog(`設定${state.nailSetting}: 約${setting.displaySpinsPer250}回/250玉・目標機械割${setting.machineRate}%`);
    });
    els.launchHandle.addEventListener("click", toggleAutoFire);
    els.centerScreen.addEventListener("click", toggleLcdZoom);
    els.centerScreen.addEventListener("keydown", event => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      toggleLcdZoom();
    });
    els.launchHandle.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggleAutoFire();
        return;
      }
      if (event.key === "ArrowRight" || event.key === "ArrowUp") {
        event.preventDefault();
        setLaunchPower(state.launchPower + 2, true);
      }
      if (event.key === "ArrowLeft" || event.key === "ArrowDown") {
        event.preventDefault();
        setLaunchPower(state.launchPower - 2, true);
      }
    });
    window.addEventListener("resize", () => {
      fitCanvas();
      syncLcdDomToHitArea();
      syncCabinetPartsToHitAreas();
    });

    ensureExtraHitOptions();
    setupPins();
    setupDefaultAcrylicParts();
    setReelSymbols(["7", "3", "5"]);
    syncMachineView();
    rebuildStatusHud();
    updateNailSettingUi();
    setLaunchPower(state.launchPower);
    syncAutoUi();
    syncForceJackpotUi();
    syncPinEditorUi();
    syncHitEditorUi();
    syncLcdDomToHitArea();
    syncCabinetPartsToHitAreas();
