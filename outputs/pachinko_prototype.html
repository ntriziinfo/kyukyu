        }, 0);
        const safeCount = Math.min(count, Math.max(2, Math.floor(length / 30) + 1));
        for (let i = 0; i < safeCount; i++) {
          const t = safeCount === 1 ? 0 : i / (safeCount - 1);
          const seg = Math.min(points.length - 2, Math.floor(t * (points.length - 1)));
          const local = t * (points.length - 1) - seg;
          const a = points[seg];
          const b = points[seg + 1];
          add(a.x + (b.x - a.x) * local, a.y + (b.y - a.y) * local, kind, r);
        }
      };
      const staggered = (x1, x2, y1, rows, stepX, stepY, evenKind = "normal", oddKind = "spill", r = 2.7) => {
        for (let row = 0; row < rows; row++) {
          const offset = row % 2 ? stepX / 2 : 0;
          for (let x = x1 + offset; x <= x2; x += stepX) {
            add(x, y1 + row * stepY, row % 2 ? oddKind : evenKind, r);
          }
        }
      };

      // Modern P-machine normal route derived from the current LCD bounds.
      // The left lane is wide enough for a 5.5 g ball, while the lower apron
      // visibly branches toward WARP, START, and the side spill paths.
      const lcd = hitAreas.lcd;
      const lcdLeft = lcd.x;
      const lcdRight = lcd.x + lcd.w;
      const lcdTop = lcd.y;
      const lcdBottom = lcd.y + lcd.h;
      const leftInner = lcdLeft - 17;
      const leftMid = lcdLeft - 48;

      // Keep the entire crown above the LCD nail-free. The open support arc
      // handles the upper-ball motion without creating pin interference.
      curve([{ x: 46, y: 170 }, { x: 46, y: 252 }, { x: 53, y: 354 }, { x: 68, y: 446 }], 12, "warp", 2.7);

      // Two boundary rows and one staggered center row make the left lane
      // lively without placing nails behind the enlarged LCD.
      curve([
        { x: leftInner, y: lcdTop + 16 },
        { x: leftInner - 4, y: lcdTop + 116 },
        { x: leftInner + 3, y: lcdTop + 224 },
        { x: leftInner + 16, y: lcdBottom + 10 }
      ], 12, "spill", 2.7);
      for (let row = 0; row < 9; row++) {
        const y = lcdTop + 36 + row * 31;
        add(leftMid + (row % 2 ? 12 : 0), y, row % 3 === 1 ? "road" : "normal", 2.7);
      }

      // The upper yori directs some balls into the visible WARP mouth. A
      // parallel outer path deliberately bypasses it and continues downward.
      curve([
        { x: leftInner + 16, y: lcdBottom + 10 },
        { x: 137, y: 470 },
        { x: 158, y: 480 },
        { x: 181, y: 486 }
      ], 5, "road", 2.85);
      curve([
        { x: 68, y: 446 },
        { x: 82, y: 500 },
        { x: 118, y: 548 },
        { x: 184, y: 584 },
        { x: 270, y: 612 }
      ], 11, "spill", 2.8);

      // Nails below the acrylic begin only after its visible lower edge. This
      // prevents the stage animation from appearing to pass through nails.
      line(190, 578, 315, 612, 6, "road", 2.85);
      line(530, 578, 405, 612, 6, "road", 2.85);
      line(158, 614, 300, 640, 7, "spill", 2.75);
      line(562, 614, 420, 640, 7, "spill", 2.75);

      // Michi nails feed the START shoulder from both sides. The straight
      // center chute used by the warp reservation remains nail-free.
      curve([{ x: 60, y: 572 }, { x: 120, y: 596 }, { x: 220, y: 614 }, { x: 320, y: 630 }], 11, "road", 2.9);
      curve([{ x: 660, y: 572 }, { x: 600, y: 596 }, { x: 500, y: 614 }, { x: 400, y: 630 }], 11, "road", 2.9);
      line(82, 620, 50, 716, 7, "spill", 2.7);
      line(154, 646, 118, 744, 7, "spill", 2.7);
      line(218, 674, 184, 768, 7, "spill", 2.7);

      // Heso entrance nails and lower spill fan.
      line(270, 602, 342, 628, 6, "heso", 2.95);
      line(450, 602, 378, 628, 6, "heso", 2.95);
      add(342, 642, "heso", 3.05);
      add(378, 642, "heso", 3.05);
      add(322, 682, "spill", 2.9);
      add(398, 682, "spill", 2.9);
      line(296, 712, 338, 748, 5, "spill", 2.8);
      line(424, 712, 382, 748, 5, "spill", 2.8);
      line(232, 738, 302, 804, 6, "spill", 2.75);
      line(488, 738, 418, 804, 6, "spill", 2.75);
      line(222, 812, 320, 840, 7, "spill", 2.65);
      line(498, 812, 400, 840, 7, "spill", 2.65);

      // The jackpot route is a molded acrylic chute. It intentionally uses no
      // nails from the upper entrance through the V-shaped attacker funnel.

      // Sparse lower-field scatter nails; routes above remain readable.
      [
        [72, 782], [96, 830], [142, 846], [188, 860],
        [524, 786], [568, 810], [610, 834], [654, 782],
        [520, 650], [554, 676], [592, 730], [460, 690],
        [92, 724], [132, 744], [174, 760], [214, 780],
        [506, 748], [548, 764], [590, 786], [632, 808]
      ].forEach(([x, y]) => add(x, y, "normal", 2.7));

      // The scripted warp ball must not appear to pass through nails. Remove
      // nails overlapping the tray, its straight center chute, and the visible
      // START notch itself.
      for (let i = pins.length - 1; i >= 0; i--) {
        const pin = pins[i];
        const visual = warpDevice.visual;
        const overlapsLcd =
          pin.x >= lcdLeft - 10 && pin.x <= lcdRight + 10 &&
          pin.y >= lcdTop - 10 && pin.y <= lcdBottom + 10;
        const overlapsStage =
          pin.x >= visual.x - 6 && pin.x <= visual.x + visual.w + 6 &&
          pin.y >= visual.y - 6 && pin.y <= visual.y + visual.h + 8;
        const overlapsWarpMouth = Math.hypot(
          pin.x - warpDevice.entry.x,
          pin.y - warpDevice.entry.y
        ) < warpDevice.entry.r + 12;
        const overlapsWindmill = Math.hypot(
          pin.x - hitAreas.windmill.x,
          pin.y - hitAreas.windmill.y
        ) < hitAreas.windmill.r + 8;
        const blocksCenterChute =
          Math.abs(pin.x - 360) < 32 &&
          pin.y > visual.y + visual.h && pin.y <= 632;
        const overlapsStartNotch = Math.abs(pin.x - 360) <= 30 && pin.y > 632 && pin.y <= 654;
        const overlapsRightAcrylic = pin.x >= 548 && pin.y >= 76 && pin.y <= 590;
        const overlapsUpperCrown = pin.y < lcdTop + 24;
        if (
          overlapsLcd || overlapsStage || overlapsWarpMouth || overlapsWindmill ||
          blocksCenterChute || overlapsStartNotch || overlapsRightAcrylic || overlapsUpperCrown
        ) pins.splice(i, 1);
      }
    }

    function setupDefaultAcrylicParts() {
      acrylicParts.length = 0;
      [
        {
          type: "curve",
          label: "左外周レール",
          thickness: 10,
          points: [{ x: 72, y: 120 }, { x: 54, y: 300 }, { x: 74, y: 420 }]
        },
        {
          type: "curve",
          label: "右打ちレール",
          thickness: 14,
          points: [{ x: 642, y: 94 }, { x: 690, y: 328 }, { x: 640, y: 560 }]
        },
        {
          type: "curve",
          label: "右アタッカー導入",
          thickness: 14,
          points: [{ x: 672, y: 584 }, { x: 604, y: 642 }, { x: 516, y: 704 }]
        }
      ].forEach(part => acrylicParts.push(normalizeAcrylic(part)));
      removeHesoAcrylicHelpers();
      ensureExtraHitOptions();
    }

    function removeHesoAcrylicHelpers() {
      const blocked = new Set([
        "ステージ受け", "ヘソ寄せ", "ステージ左返し", "ステージ右返し", "ヘソ左肩", "ヘソ右肩",
        "液晶左肩", "液晶右肩", "左外周レール", "右打ちレール", "右アタッカー導入"
      ]);
      for (let i = acrylicParts.length - 1; i >= 0; i--) {
        if (blocked.has(acrylicParts[i].label || "")) acrylicParts.splice(i, 1);
      }
    }

    function fitCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(320, Math.floor(rect.width * dpr));
      canvas.height = Math.max(480, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function sx(x) {
      return x / 720 * canvas.clientWidth;
    }

    function sy(y) {
      return y / 900 * canvas.clientHeight;
    }

    function lcdBlock() {
      const lcd = hitAreas.lcd;
      return {
        left: sx(lcd.x),
        top: sy(lcd.y),
        right: sx(lcd.x + lcd.w),
        bottom: sy(lcd.y + lcd.h)
      };
    }

    function isJackpotActive() {
      return state.bonusActive;
    }

    function isRushStActive() {
      return !state.bonusActive && state.rushMode !== "none" && state.stRemaining > 0;
    }

    function isRushStartClawOpen() {
      return isRushStActive();
    }

    function isRightShotActive() {
      return isJackpotActive() || isRushStActive();
    }

    function autoShotPower(rightShot = isRightShotActive()) {
      const manualPower = Math.max(32, Math.min(92, Number(state.launchPower) || 62));
      return rightShot ? Math.max(88, manualPower) : manualPower;
    }

    function setLaunchPower(value, announce = false) {
      const min = Number(els.power.min);
      const max = Number(els.power.max);
      state.launchPower = Math.max(min, Math.min(max, Math.round(Number(value) || 62)));
      els.power.value = state.launchPower;
      if (els.handleAdjust) els.handleAdjust.value = state.launchPower;
      syncHandleUi();
      if (announce) {
        const route = state.launchPower < upperLaunchGuide.weakThreshold
          ? "返却域"
          : state.launchPower >= upperLaunchGuide.rightThreshold ? "右打ち域" : "左打ち域";
        message(`ハンドル強度 ${state.launchPower}（${route}）`);
      }
    }

    function currentNailSetting() {
      const base = nailSettingTable[state.nailSetting] || nailSettingTable[3];
      return {
        ...base,
        startPerBall: base.spinsPer250 / 250,
        displaySpinsPer250: base.spinsPer250.toFixed(1)
      };
    }

    function updateNailSettingUi() {
      const nextSetting = Math.max(1, Math.min(6, Number(els.nailSetting?.value || state.nailSetting || 3)));
      if (nextSetting !== state.nailSetting) state.startMeter = 0;
      state.nailSetting = nextSetting;
      const setting = currentNailSetting();
      if (els.nailSettingValue) {
        els.nailSettingValue.textContent = `${setting.displaySpinsPer250}回/250玉・目標機械割${setting.machineRate}%`;
      }
    }

    function spawnBall() {
      const power = autoShotPower();
      const rightShot = isRightShotActive() || power >= upperLaunchGuide.rightThreshold;
      if (!isJackpotActive() && state.pendingStarts >= maxHolds) {
        pauseAutoForFullHold();
        return;
      }
      if (isJackpotActive()) {
        const remainingEntries = Math.max(0, bonusEntriesPerRound - state.bonusEntries);
        const ballsInRightChute = balls.filter(ball => ball.live && (ball.rightAcrylicStage || ball.launchRail?.rightShot)).length;
        if (ballsInRightChute >= remainingEntries) return;
      } else if (isRushStActive()) {
        const availableHolds = Math.max(0, maxHolds - state.pendingStarts);
        const ballsInRightChute = balls.filter(ball => ball.live && (ball.rightAcrylicStage || ball.launchRail?.rightShot)).length;
        if (ballsInRightChute >= availableHolds) return;
      }
      if (balls.filter(ball => ball.live && ball.launchRail).length >= 4) return;
      if (state.balls <= 0) {
        message("持ち玉がありません。リセットで再試行。");
        return;
      }
      const shotAt = performance.now();
      if (state.lastShotAt && shotAt - state.lastShotAt < fireIntervalMs() * .82) return;
      state.lastShotAt = shotAt;
      state.balls--;
      state.fired++;
      state.balance--;
      balls.push({
        x: sx(upperLaunchGuide.launcher.x),
        y: sy(upperLaunchGuide.launcher.y),
        vx: 0,
        vy: 0,
        r: Math.max(5, canvas.clientWidth * .0105),
        massG: physics.ballMassG,
        live: true,
        glow: 1,
        age: 0,
        angle: Math.random() * Math.PI * 2,
        trail: [],
        rightShot,
        shotPower: power,
        startGateChecked: false,
        startMouthEntered: false,
        warpUsed: false,
        warpStage: null,
        launchRail: {
          elapsed: 0,
          duration: rightShot ? 780 : 760 - (power - 32) * 2,
          power,
          weak: power < upperLaunchGuide.weakThreshold,
          rightShot,
          exit: isJackpotActive() ? "bonus" : "rush",
          refunded: false
        },
        rightAcrylicStage: null
      });
      updateHud();
    }

    function cubicPoint(p0, p1, p2, p3, t) {
      const u = 1 - t;
      const uu = u * u;
      const tt = t * t;
      return {
        x: uu * u * p0.x + 3 * uu * t * p1.x + 3 * u * tt * p2.x + tt * t * p3.x,
        y: uu * u * p0.y + 3 * uu * t * p1.y + 3 * u * tt * p2.y + tt * t * p3.y
      };
    }

    function launchLiftPoint(t) {
      return cubicPoint(
        upperLaunchGuide.launcher,
        { x: 18, y: 136 },
        { x: 74, y: 150 },
        upperLaunchGuide.leftJoin,
        Math.max(0, Math.min(1, t))
      );
    }

    function launchArcPoint(arcProgress) {
      const angle = Math.PI - Math.max(0, Math.min(1, arcProgress)) * Math.PI;
      return {
        x: upperLaunchGuide.center.x + upperLaunchGuide.track.rx * Math.cos(angle),
        y: upperLaunchGuide.center.y - upperLaunchGuide.track.ry * Math.sin(angle)
      };
    }

    function launchTrackPoint(route, progress) {
      if (route.weak) {
        const reach = .30 + (route.power - 32) / Math.max(1, upperLaunchGuide.weakThreshold - 33) * .62;
        const roundTrip = progress < .5 ? progress * 2 : (1 - progress) * 2;
        return launchLiftPoint(reach * Math.max(0, roundTrip));
      }

      const liftEnd = route.rightShot ? .58 : .70;
      if (progress <= liftEnd) return launchLiftPoint(progress / liftEnd);

      const normalPowerRange = Math.max(1, upperLaunchGuide.rightThreshold - upperLaunchGuide.weakThreshold - 1);
      const normalT = Math.max(0, Math.min(1, (route.power - upperLaunchGuide.weakThreshold) / normalPowerRange));
      const targetArc = route.rightShot
        ? .78 + Math.max(0, route.power - upperLaunchGuide.rightThreshold) / 8 * .12
        : .06 + normalT * .45;
      const arcEnd = route.rightShot ? .90 : 1;
      if (progress <= arcEnd) {
        return launchArcPoint(targetArc * (progress - liftEnd) / Math.max(.01, arcEnd - liftEnd));
      }
      const arcPoint = launchArcPoint(targetArc);
      const rightEntry = rightAcrylicChute.commonPath[0];
      const t = (progress - arcEnd) / Math.max(.01, 1 - arcEnd);
      return {
        x: arcPoint.x + (rightEntry.x - arcPoint.x) * t,
        y: arcPoint.y + (rightEntry.y - arcPoint.y) * t
      };
    }

    function refundWeakLaunch(ball, route) {
      if (route.refunded) return;
      route.refunded = true;
      ball.live = false;
      ball.launchRail = null;
      state.balls += 1;
      state.balance += 1;
      state.fired = Math.max(0, state.fired - 1);
      burst(ball.x, ball.y, "#66e3ff", 10);
      const text = `強度${route.power}: 発射口へ戻り 1pt返却`;
      message(text);
      addLog(text);
      updateHud();
    }

    function advanceLaunchRail(ball, dt) {
      const route = ball.launchRail;
      if (!route || !ball.live) return false;
      ball.prevX = ball.x;
      ball.prevY = ball.y;
      ball.trail.push({ x: ball.x, y: ball.y });
      if (ball.trail.length > 8) ball.trail.shift();
      route.elapsed += dt;
      const progress = Math.min(1, route.elapsed / Math.max(1, route.duration));
      const point = launchTrackPoint(route, progress);
      ball.x = sx(point.x);
      ball.y = sy(point.y);
      ball.vx = (ball.x - ball.prevX) / Math.max(1, dt);
      ball.vy = (ball.y - ball.prevY) / Math.max(1, dt);
      ball.angle += Math.hypot(ball.vx, ball.vy) * dt / Math.max(1, ball.r) * .22;
      ball.glow = Math.max(.7, ball.glow * .998);
      if (progress < 1) return true;

      if (route.weak) {
        refundWeakLaunch(ball, route);
        return true;
      }

      ball.launchRail = null;
      if (route.rightShot) {
        ball.x = sx(rightAcrylicChute.commonPath[0].x);
        ball.y = sy(rightAcrylicChute.commonPath[0].y);
        ball.vx = 0;
        ball.vy = 0;
        ball.rightAcrylicStage = {
          elapsed: 0,
          duration: 3000 + Math.random() * 180,
          offset: (Math.random() - .5) * 4,
          exit: route.exit
        };
        return true;
      }

      state.startMeter += currentNailSetting().startPerBall;
      ball.age = 0;
      ball.vx = .07 + (route.power - upperLaunchGuide.weakThreshold) * .0045 + (Math.random() - .5) * .015;
      ball.vy = .055 + Math.random() * .018;
      return true;
    }

    function burst(x, y, color, count = 18) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 1.2 + Math.random() * 3;
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 34 + Math.random() * 20, color });
      }
    }

    function update(dt) {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      // Keep the ambulance gate fully open throughout the bonus. The visual
      // flap and the physical checker now agree, avoiding timing-based losses.
      state.rightDeviceOpen = isJackpotActive();
      const settingInfo = currentNailSetting();
      const hesoOpening = settingInfo.hesoOpening;
      const scaledPins = pins.map(p => {
        const adjustableHeso = p.kind === "heso" && p.y >= 620;
        const direction = p.x < 360 ? -1 : p.x > 360 ? 1 : 0;
        return {
          x: sx(p.x + (adjustableHeso ? direction * hesoOpening : 0)),
          y: sy(p.y),
          r: Math.max(1.45, fixedPinRadius / 720 * w),
          kind: p.kind
        };
      });
      const scaledPockets = pockets.map(p => ({
        ...p,
        x: sx(p.x),
        y: sy(p.y),
        r: (p.r || 0) / 720 * w,
        w: (p.w || 0) / 720 * w,
        h: (p.h || 0) / 900 * h
      }));

      balls.forEach(ball => {
        ball.age = (ball.age || 0) + dt;
        if (advanceLaunchRail(ball, dt)) return;
        if (advanceRightAcrylicChute(ball, dt)) return;
        if (advanceWarpStage(ball, dt)) return;
        ball.prevX = ball.x;
        ball.prevY = ball.y;
        ball.trail.push({ x: ball.x, y: ball.y });
        if (ball.trail.length > 6) ball.trail.shift();
        guideBall(ball, dt);
        ball.vy += physics.gravity * dt;
        const drag = Math.max(0, 1 - (physics.airDrag + physics.rollingDrag) * dt);
        ball.vx *= drag;
        ball.vy *= Math.max(0, 1 - physics.airDrag * dt);
        const speed = Math.hypot(ball.vx, ball.vy);
        if (speed > physics.maxSpeed) {
          const cap = physics.maxSpeed / speed;
          ball.vx *= cap;
          ball.vy *= cap;
        }
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;
        ball.angle += Math.hypot(ball.vx, ball.vy) * dt / Math.max(1, ball.r) * .16;
        ball.glow *= .992;
        collideWithPlayfieldCircle(ball);
        collideWithLcdFrame(ball);
        collideWithAcrylicParts(ball);
        collideWithUpperSupportArc(ball);
        collideWithWindmill(ball);
        collideWithPushButton(ball);

        if (ball.x < ball.r + 12) {
          ball.x = ball.r + 12;
          ball.vx = Math.abs(ball.vx) * physics.wallRestitution;
        }
        if (ball.x > w - ball.r - 12) {
          ball.x = w - ball.r - 12;
          ball.vx = -Math.abs(ball.vx) * physics.wallRestitution;
        }
        if (ball.y < ball.r + 12) {
          ball.y = ball.r + 12;
          ball.vy = Math.abs(ball.vy) * physics.wallRestitution;
        }

        scaledPins.forEach(pin => {
          if (!ball.rightShot && ball.age < 420 && ball.y < sy(180) && pin.x < sx(128)) return;
          const dx = ball.x - pin.x;
          const dy = ball.y - pin.y;
          const dist = Math.hypot(dx, dy);
          const min = ball.r + pin.r;
          if (dist < min && dist > .01) {
            const nx = dx / dist;
            const ny = dy / dist;
            const overlap = min - dist;
            ball.x += nx * overlap;
            ball.y += ny * overlap;
            const dot = ball.vx * nx + ball.vy * ny;
            if (dot < 0) {
              ball.vx -= (1 + physics.nailRestitution) * dot * nx;
              ball.vy -= (1 + physics.nailRestitution) * dot * ny;
              if (pin.kind === "road") ball.vx += Math.sign(sx(360) - ball.x) * settingInfo.roadBias;
              if (pin.kind === "heso") ball.vx += Math.sign(sx(360) - ball.x) * settingInfo.hesoBias;
            }
            const tangentX = -ny;
            const tangentY = nx;
            const tangent = ball.vx * tangentX + ball.vy * tangentY;
            ball.vx -= tangentX * tangent * .012;
            ball.vy -= tangentY * tangent * .012;
            ball.vx += (Math.random() - .5) * physics.randomNailScatter;
            ball.vy += (Math.random() - .5) * physics.randomNailScatter * .35;
            ball.glow = 1;
          }
        });

        if (enterWarpIfHit(ball)) return;

        for (const pocket of scaledPockets) {
          if (pocket.type === "attacker" && !state.rightDeviceOpen) continue;
          if (pocket.type === "start") {
            const captured = collideWithStartGate(ball, pocket);
            if (captured && ball.live) {
              ball.live = false;
              handlePocket(pocket, ball.x, ball.y);
              break;
            }
            continue;
          }
          const hit = pocketHit(ball, pocket);
          if (hit && ball.live) {
            ball.live = false;
            handlePocket(pocket, ball.x, ball.y);
            break;
          }
        }

        const postCollisionSpeed = Math.hypot(ball.vx, ball.vy);
        ball.slowAge = postCollisionSpeed < .095 ? (ball.slowAge || 0) + dt : 0;
        if (ball.live && ball.slowAge > 200) {
          ball.stuckBumps = (ball.stuckBumps || 0) + 1;
          const rollDirection = ball.stuckBumps % 2 ? -1 : 1;
          const escapeBoost = .09 + Math.min(.08, ball.stuckBumps * .015);
          ball.vx += rollDirection * escapeBoost;
          ball.vy = Math.max(ball.vy, .10 + Math.min(.10, ball.stuckBumps * .02));
          ball.slowAge = 0;
        } else if (postCollisionSpeed > .18) {
          ball.stuckBumps = 0;
        }

        if (ball.y > h + 60 || ball.age > 12000) ball.live = false;
      });

      collideBalls(dt);

      for (let i = balls.length - 1; i >= 0; i--) {
        if (!balls[i].live) balls.splice(i, 1);
      }

      particles.forEach(p => {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += .02 * dt;
        p.life -= dt;
      });
      for (let i = particles.length - 1; i >= 0; i--) {
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      if (!state.bonusActive && state.rightDeviceOpen) state.rightDeviceOpen = false;
    }

    function pocketHit(ball, pocket) {
      if (pocket.shape === "bowl") {
        const topWidth = pocket.w;
        const bottomWidth = pocket.w * .56;
        const top = pocket.y;
        const bottom = pocket.y + pocket.h;
        const topLeft = pocket.x - topWidth / 2;
        const topRight = pocket.x + topWidth / 2;
        const bottomLeft = pocket.x - bottomWidth / 2;
        const bottomRight = pocket.x + bottomWidth / 2;
        const withinTop = ball.x >= topLeft - ball.r * .65 && ball.x <= topRight + ball.r * .65;
        const withinBottom = ball.x >= bottomLeft - ball.r * .65 && ball.x <= bottomRight + ball.r * .65;
        const crossedTop = (ball.prevY + ball.r) <= top && (ball.y + ball.r) >= top;
        const topEntry = ball.vy > 0 && withinTop && (crossedTop || (ball.y >= top - ball.r && ball.y <= top + pocket.h * .45));
        const bottomCatch = withinBottom && ball.y + ball.r >= bottom - ball.r * .25;
        const lowerBackflow = ball.vy < 0 && withinBottom && ball.y - ball.r <= bottom && ball.y > top + pocket.h * .45;
        if (bottomCatch || lowerBackflow) return "out";
        if (topEntry && !ball.startGateChecked) {
          return consumeStartMeter(ball);
        }
        return false;
      }
      if (pocket.shape === "semicircle" || pocket.type === "out") {
        const dx = ball.x - pocket.x;
        const dy = ball.y - pocket.y;
        const dist = Math.hypot(dx, dy);
        return ball.vy > 0 && ball.y + ball.r >= pocket.y - pocket.r && dist < pocket.r + ball.r * .65;
      }
      const captureRadius = pocket.type === "attacker" ? pocket.r + ball.r * .8 : pocket.r;
      return Math.hypot(ball.x - pocket.x, ball.y - pocket.y) < captureRadius;
    }

    function collideWithStartGate(ball, pocket) {
      const outerRadius = pocket.r + sx(12);
      const dx = ball.x - pocket.x;
      const dy = ball.y - pocket.y;
      const distance = Math.hypot(dx, dy);
      const previousY = ball.prevY ?? ball.y;
      // Commit the entry just above the first possible rim contact so a ball
      // that has visibly dropped into the notch can never be reflected back.
      const mouthY = pocket.y - outerRadius * 1.36;
      // Keep the physical opening compact, but let the setting meter feed a
      // nearby downward-moving ball through the visible mouth. This preserves
      // the configured long-run spin rate without allowing side entries.
      const meterReady = state.startMeter >= 1;
      const meterAssist = meterReady ? sx(24) : 0;
      const mouthHalfWidth = outerRadius * .72 + meterAssist;
      const descending = ball.vy > .02;
      const crossedMouth = previousY <= mouthY && ball.y >= mouthY;
      const insideMouthBand =
        ball.y >= mouthY - ball.r &&
        ball.y <= pocket.y - outerRadius * .58;

      if (
        !ball.startMouthEntered &&
        !ball.rightShot &&
        meterReady &&
        descending &&
        Math.abs(dx) <= mouthHalfWidth &&
        (crossedMouth || (insideMouthBand && previousY < ball.y))
      ) {
        ball.startMouthEntered = Boolean(consumeStartMeter(ball));
      }

      if (
        ball.startMouthEntered &&
        !ball.rightShot &&
        descending &&
        ball.y >= pocket.y - outerRadius * .72 &&
        Math.abs(dx) <= outerRadius * .88 + meterAssist * .8
      ) {
        return true;
      }

      if (ball.startMouthEntered) {
        ball.x += (pocket.x - ball.x) * .18;
        ball.vx *= .78;
      }

      const angle = Math.atan2(dy, dx);
      const topDelta = Math.abs(Math.atan2(Math.sin(angle + Math.PI / 2), Math.cos(angle + Math.PI / 2)));
      const withinTopOpening = dy < 0 && topDelta < 1.15 && ball.startMouthEntered;
      const contactDistance = outerRadius + ball.r;
      if (distance >= contactDistance || withinTopOpening) return false;

      const nx = distance > .01 ? dx / distance : 0;
      const ny = distance > .01 ? dy / distance : -1;
      const overlap = contactDistance - Math.max(distance, .01);
      ball.x += nx * overlap;
      ball.y += ny * overlap;
      const impact = ball.vx * nx + ball.vy * ny;
      if (impact < 0) {
        const restitution = .72;
        ball.vx -= (1 + restitution) * impact * nx;
        ball.vy -= (1 + restitution) * impact * ny;
      }
      ball.vx += nx * .025;
      ball.vy += ny * .025;
      ball.startMouthEntered = false;
      ball.glow = 1;
      return false;
    }

    function advanceRightAcrylicChute(ball, dt) {
      const route = ball.rightAcrylicStage;
      if (!route || !ball.live) return false;

      ball.prevX = ball.x;
      ball.prevY = ball.y;
      ball.trail.push({ x: ball.x, y: ball.y });
      if (ball.trail.length > 7) ball.trail.shift();
      ball.angle += .085 * dt;
      ball.glow = Math.max(.62, ball.glow * .997);
      route.elapsed += dt;

      const progress = Math.min(1, route.elapsed / route.duration);
      const exitPath = route.exit === "rush" ? rightAcrylicChute.rushExit : rightAcrylicChute.bonusExit;
      const path = [...rightAcrylicChute.commonPath, ...exitPath];
      const scaled = progress * (path.length - 1);
      const index = Math.min(path.length - 2, Math.floor(scaled));
      const local = Math.min(1, scaled - index);
      const eased = local * local * (3 - 2 * local);
      const start = path[index];
      const end = path[index + 1];
      const offsetFade = Math.sin(progress * Math.PI);
      const nextX = start.x + (end.x - start.x) * eased + route.offset * offsetFade;
      const nextY = start.y + (end.y - start.y) * eased;
      ball.x = sx(nextX);
      ball.y = sy(nextY);
      ball.vx = (ball.x - ball.prevX) / Math.max(1, dt);
      ball.vy = (ball.y - ball.prevY) / Math.max(1, dt);

      if (progress < 1) return true;

      ball.rightAcrylicStage = null;
      ball.live = false;
      if (route.exit === "bonus" && state.bonusActive && state.rightDeviceOpen) {
        handlePocket(pockets[1], ball.x, ball.y);
      } else if (route.exit === "rush" && isRushStartClawOpen()) {
        handleRushStartEntry(ball.x, ball.y);
      } else {
        burst(ball.x, ball.y, "#79889a", 8);
      }
      return true;
    }

    function enterWarpIfHit(ball) {
      if (!ball.live || ball.rightShot || ball.warpUsed || ball.warpStage) return false;
      const entryX = sx(warpDevice.entry.x);
      const entryY = sy(warpDevice.entry.y);
      const entryRadius = warpDevice.entry.r / 720 * canvas.clientWidth;
      const distance = Math.hypot(ball.x - entryX, ball.y - entryY);
      if (ball.vy < -.08 || distance >= entryRadius + ball.r * .72) return false;

      ball.warpUsed = true;
      ball.warpStage = {
        phase: "sweep",
        elapsed: 0,
        startX: sx(warpDevice.stage.left + 18),
        startY: sy(warpDevice.stage.y)
      };
      ball.x = ball.warpStage.startX;
      ball.y = ball.warpStage.startY;
      ball.vx = 0;
      ball.vy = 0;
      ball.trail.length = 0;
      ball.glow = 1;
      burst(entryX, entryY, "#66e3ff", 14);
      return true;
    }

    function advanceWarpStage(ball, dt) {
      const route = ball.warpStage;
      if (!route || !ball.live) return false;

      ball.prevX = ball.x;
      ball.prevY = ball.y;
      ball.trail.push({ x: ball.x, y: ball.y });
      if (ball.trail.length > 6) ball.trail.shift();
      ball.angle += .08 * dt;
      ball.glow = Math.max(.55, ball.glow * .996);
      route.elapsed += dt;

      if (route.phase === "sweep") {
        const duration = 1900;
        const progress = Math.min(1, route.elapsed / duration);
        const cycles = 2.15;
        const triangle = 2 / Math.PI * Math.asin(Math.sin(progress * Math.PI * 2 * cycles - Math.PI / 2));
        ball.x = sx(360 + triangle * 106);
        ball.y = sy(warpDevice.stage.y + 3 + (1 - Math.abs(triangle)) * 10);
        ball.vx = (ball.x - ball.prevX) / Math.max(1, dt);
        ball.vy = (ball.y - ball.prevY) / Math.max(1, dt);

        if (progress >= 1) {
          const centerReserved = Boolean(consumeStartMeter(ball));
          route.phase = centerReserved ? "centerApproach" : (Math.random() < .5 ? "left" : "right");
          route.elapsed = 0;
          route.startX = ball.x;
          route.startY = ball.y;
          burst(ball.x, ball.y, centerReserved ? "#ff5b69" : "#66e3ff", 10);
          addLog(centerReserved ? "WARP中央ルート → START" : `WARP${route.phase === "left" ? "左" : "右"}落ち`);
        }
        return true;
      }

      if (route.phase === "centerApproach") {
        const duration = 330;
        const rawProgress = Math.min(1, route.elapsed / duration);
        const progress = rawProgress * rawProgress * (3 - 2 * rawProgress);
        const targetX = sx(360);
        const targetY = sy(warpDevice.stage.y + 15);
        ball.x = route.startX + (targetX - route.startX) * progress;
        ball.y = route.startY + (targetY - route.startY) * progress;
        ball.vx = (ball.x - ball.prevX) / Math.max(1, dt);
        ball.vy = (ball.y - ball.prevY) / Math.max(1, dt);
        if (rawProgress >= 1) {
          route.phase = "centerSpill";
          route.elapsed = 0;
          route.startX = ball.x;
          route.startY = ball.y;
        }
        return true;
      }

      if (route.phase === "centerSpill") {
        const duration = 260;
        const rawProgress = Math.min(1, route.elapsed / duration);
        const progress = rawProgress * rawProgress * (3 - 2 * rawProgress);
        const targetY = sy(530);
        ball.x = sx(360);
        ball.y = route.startY + (targetY - route.startY) * progress;
        ball.vx = (ball.x - ball.prevX) / Math.max(1, dt);
        ball.vy = (ball.y - ball.prevY) / Math.max(1, dt);
        if (rawProgress >= 1) {
          route.phase = "centerDrop";
          route.elapsed = 0;
          route.startX = ball.x;
          route.startY = ball.y;
          burst(ball.x, ball.y, "#ff5b69", 8);
        }
        return true;
      }

      const centerRoute = route.phase === "centerDrop";
      const duration = 420;
      const rawProgress = Math.min(1, route.elapsed / duration);
      const progress = rawProgress * rawProgress * (3 - 2 * rawProgress);
      const side = route.phase === "left" ? -1 : 1;
      const targetX = centerRoute ? sx(360) : sx(side < 0 ? 263 : 457);
      const targetY = centerRoute ? sy(pockets[0].y - 18) : sy(530);
      ball.x = route.startX + (targetX - route.startX) * progress;
      ball.y = route.startY + (targetY - route.startY) * (centerRoute ? rawProgress * rawProgress : progress);
      ball.vx = (ball.x - ball.prevX) / Math.max(1, dt);
      ball.vy = (ball.y - ball.prevY) / Math.max(1, dt);

      if (rawProgress < 1) return true;
      if (centerRoute) {
        ball.live = false;
        handlePocket(pockets[0], ball.x, ball.y);
        return true;
      }

      ball.warpStage = null;
      ball.vx = side * (.30 + Math.random() * .08);
      ball.vy = .34 + Math.random() * .08;
      ball.glow = 1;
      return true;
    }

    function consumeStartMeter(ball) {
      if (ball.startGateChecked || ball.rightShot) return false;
      if (state.startMeter < 1) return false;
      ball.startGateChecked = true;
      state.startMeter -= 1;
      return "start";
    }

    function collideBalls(dt) {
      for (let i = 0; i < balls.length; i++) {
        const a = balls[i];
        if (!a.live || a.launchRail || a.warpStage || a.rightAcrylicStage) continue;
        for (let j = i + 1; j < balls.length; j++) {
          const b = balls[j];
          if (!b.live || b.launchRail || b.warpStage || b.rightAcrylicStage) continue;
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          let dist = Math.hypot(dx, dy);
          const min = a.r + b.r + 1;
          if (dist >= min) continue;
          if (dist <= .01) {
            dist = .01;
          }
          const nx = dx / dist;
          const ny = dy / dist;
          const overlap = min - dist;
          const push = overlap * .52;
          a.x -= nx * push;
          a.y -= ny * push;
          b.x += nx * push;
          b.y += ny * push;

          const rvx = b.vx - a.vx;
          const rvy = b.vy - a.vy;
          const closing = rvx * nx + rvy * ny;
          if (closing < 0) {
            const impulse = -(1 + physics.ballRestitution) * closing / 2;
            a.vx -= impulse * nx;
            a.vy -= impulse * ny;
            b.vx += impulse * nx;
            b.vy += impulse * ny;
          }
          const tangentX = -ny;
          const tangentY = nx;
          const shove = .0018 * dt;
          a.vx -= tangentX * shove;
          b.vx += tangentX * shove;
          a.vy -= tangentY * shove * .45;
          b.vy += tangentY * shove * .45;
          a.glow = Math.max(a.glow, .68);
          b.glow = Math.max(b.glow, .68);
        }
      }
    }

    function playfieldShape() {
      return {
        x: sx(360),
        y: sy(458),
        rx: sx(350),
        ry: sy(440),
        topY: sy(18),
        exponent: 4
      };
    }

    function collideWithPlayfieldCircle(ball) {
      const field = playfieldShape();
      const dx = ball.x - field.x;
      const dy = ball.y - field.y;
      const rx = field.rx - ball.r - 2;
      const ry = field.ry - ball.r - 2;
      const exponent = field.exponent || 2;
      const normalized = Math.pow(
        Math.pow(Math.abs(dx) / rx, exponent) + Math.pow(Math.abs(dy) / ry, exponent),
        1 / exponent
      );
      if (normalized <= 1 || normalized <= .01) return;
      ball.x = field.x + dx / normalized;
      ball.y = field.y + dy / normalized;
      const nxRaw = Math.sign(dx) * Math.pow(Math.abs(dx) / rx, exponent - 1) / rx;
      const nyRaw = Math.sign(dy) * Math.pow(Math.abs(dy) / ry, exponent - 1) / ry;
      const nLen = Math.max(.01, Math.hypot(nxRaw, nyRaw));
      const nx = nxRaw / nLen;
      const ny = nyRaw / nLen;
      const dot = ball.vx * nx + ball.vy * ny;
      if (dot > 0) {
        ball.vx -= (1 + physics.wallRestitution) * dot * nx;
        ball.vy -= (1 + physics.wallRestitution) * dot * ny;
      }
      if (ball.y > sy(705)) {
        ball.vx += (sx(360) - ball.x) * .006;
        ball.vy = Math.max(ball.vy, .45);
      }
      ball.glow = 1;
    }

    function collideWithLcdFrame(ball) {
      const block = lcdBlock();
      const pad = ball.r + 4;
      if (
        ball.x < block.left - pad ||
        ball.x > block.right + pad ||
        ball.y < block.top - pad ||
        ball.y > block.bottom + pad
      ) return;

      const insideX = ball.x > block.left && ball.x < block.right;
      const insideY = ball.y > block.top && ball.y < block.bottom;
      if (!insideX || !insideY) return;

      const exits = [
        { side: "left", d: Math.abs(ball.x - block.left) },
        { side: "right", d: Math.abs(block.right - ball.x) },
        { side: "top", d: Math.abs(ball.y - block.top) },
        { side: "bottom", d: Math.abs(block.bottom - ball.y) }
      ].sort((a, b) => a.d - b.d);

      if (exits[0].side === "left") {
        ball.x = block.left - pad;
        ball.vx = -Math.abs(ball.vx) * physics.lcdRestitution - .12;
      } else if (exits[0].side === "right") {
        ball.x = block.right + pad;
        ball.vx = Math.abs(ball.vx) * physics.lcdRestitution + .12;
      } else if (exits[0].side === "top") {
        ball.y = block.top - pad;
        ball.vy = -Math.abs(ball.vy) * physics.lcdRestitution;
        const center = (block.left + block.right) / 2;
        const side = ball.x < center ? -1 : 1;
        ball.vx += side * .18 + (ball.x - center) * .0008;
      } else {
        ball.y = block.bottom + pad;
        ball.vy = Math.abs(ball.vy) * physics.lcdRestitution + .10;
      }
      ball.vx += (Math.random() - .5) * .08;
      ball.vy += (Math.random() - .5) * .05;
      ball.glow = 1;
    }

    function pushButtonShape() {
      const button = hitAreas.push;
      return {
        x: sx(button.x),
        y: sy(button.y),
        r: button.r / 720 * canvas.clientWidth
      };
    }

    function collideWithPushButton(ball) {
      if (ball.rightShot) return;
      const button = pushButtonShape();
      const dx = ball.x - button.x;
      const dy = ball.y - button.y;
      const dist = Math.hypot(dx, dy);
      const min = button.r + ball.r + 2;
      if (dist >= min || dist <= .01) return;
      const nx = dx / dist;
      const ny = dy / dist;
      const overlap = min - dist;
      ball.x += nx * overlap;
      ball.y += ny * overlap;
      const dot = ball.vx * nx + ball.vy * ny;
      if (dot < 0) {
        ball.vx -= (1 + physics.wallRestitution * .7) * dot * nx;
        ball.vy -= (1 + physics.wallRestitution * .7) * dot * ny;
      }
      ball.vx += (sx(360) - ball.x) * .0025;
      ball.vy = Math.max(ball.vy, .32);
      ball.glow = 1;
    }

    function collideWithWindmill(ball) {
      const mill = hitAreas.windmill;
      const x = sx(mill.x);
      const y = sy(mill.y);
      const r = (mill.collisionR || mill.r * .55) / 720 * canvas.clientWidth;
      const dx = ball.x - x;
      const dy = ball.y - y;
      const dist = Math.hypot(dx, dy);
      const min = r + ball.r + 1;
      if (dist >= min || dist <= .01) return;
      const nx = dx / dist;
      const ny = dy / dist;
      const overlap = min - dist;
      ball.x += nx * overlap;
      ball.y += ny * overlap;
      const dot = ball.vx * nx + ball.vy * ny;
      if (dot < 0) {
        ball.vx -= (1 + physics.nailRestitution * .85) * dot * nx;
        ball.vy -= (1 + physics.nailRestitution * .85) * dot * ny;
      }
      const spin = Math.sin(performance.now() / 180) * .22;
      ball.vx += spin + nx * .08 + (ball.rightShot ? 0 : .14);
      ball.vy = Math.max(.25, ball.vy + .12);
      ball.glow = 1;
    }

    function collideWithAcrylicParts(ball) {
      acrylicParts.forEach(part => {
        const points = acrylicCanvasPoints(part);
        let best = null;
        const last = part.type === "curve" ? points.length - 1 : points.length;
        for (let i = 0; i < last; i++) {
          const a = points[i];
          const b = points[(i + 1) % points.length];
          const hit = nearestPointOnSegment(ball.x, ball.y, a.x, a.y, b.x, b.y);
          if (!best || hit.dist < best.dist) best = hit;
        }
        const extra = part.type === "curve" ? (part.thickness || 22) / 720 * canvas.clientWidth / 2 : 0;
        const inside = part.type !== "curve" && pointInCanvasPolygon({ x: ball.x, y: ball.y }, points);
        if (!best || (!inside && best.dist > ball.r + extra)) return;
        let nx = best.dist > .01 ? (ball.x - best.x) / best.dist : 0;
        let ny = best.dist > .01 ? (ball.y - best.y) / best.dist : -1;
        if (inside) {
          const center = { x: sx(part.x), y: sy(part.y) };
          const outwardX = ball.x - center.x;
          const outwardY = ball.y - center.y;
          const len = Math.hypot(outwardX, outwardY);
          if (len > .01) {
            nx = outwardX / len;
            ny = outwardY / len;
          }
        }
        const overlap = inside ? ball.r + best.dist + 2 : ball.r + extra - best.dist + 1;
        ball.x += nx * overlap;
        ball.y += ny * overlap;
        const dot = ball.vx * nx + ball.vy * ny;
        if (dot < 0) {
          ball.vx -= (1 + physics.wallRestitution) * dot * nx;
          ball.vy -= (1 + physics.wallRestitution) * dot * ny;
        }
        ball.vx += (Math.random() - .5) * .06;
        ball.vy += (Math.random() - .5) * .04;
        ball.glow = 1;
      });
    }

    function nearestPointOnSegment(px, py, ax, ay, bx, by) {
      const vx = bx - ax;
      const vy = by - ay;
      const lenSq = vx * vx + vy * vy || 1;
      const t = Math.max(0, Math.min(1, ((px - ax) * vx + (py - ay) * vy) / lenSq));
      const x = ax + vx * t;
      const y = ay + vy * t;
      return { x, y, dist: Math.hypot(px - x, py - y) };
    }

    function upperSupportArcPoint(t) {
      const arc = upperLaunchGuide.supportArc;
      const u = 1 - t;
      return {
        x: u * u * arc.start.x + 2 * u * t * arc.control.x + t * t * arc.end.x,
        y: u * u * arc.start.y + 2 * u * t * arc.control.y + t * t * arc.end.y
      };
    }

    function collideBallWithUpperSupport(ball, a, b, thickness) {
      const hit = nearestPointOnSegment(ball.x, ball.y, a.x, a.y, b.x, b.y);
      const minDistance = ball.r + thickness;
      // This is an open, one-sided receiver: only the lower half of a ball
      // arriving from above can touch it. Balls can never be pinched below it.
      if (hit.dist >= minDistance || ball.y > hit.y + ball.r * .25) return false;
      const dist = Math.max(.01, hit.dist);
      let nx = (ball.x - hit.x) / dist;
      let ny = (ball.y - hit.y) / dist;
      if (hit.dist <= .01 || ny > -.08) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const length = Math.hypot(dx, dy) || 1;
        nx = dy / length;
        ny = -dx / length;
        if (ny > 0) {
          nx *= -1;
          ny *= -1;
        }
      }
      const overlap = minDistance - dist;
      ball.x += nx * overlap;
      ball.y += ny * overlap;
      const impact = ball.vx * nx + ball.vy * ny;
      if (impact < 0) {
        ball.vx -= (1 + .54) * impact * nx;
        ball.vy -= (1 + .54) * impact * ny;
      }
      // Normal play always exits toward the open left side after the first
      // support contact. Strong right shots use the scripted right route and
      // never enter this collision path.
      ball.vx = ball.rightShot
        ? Math.max(.18, Math.abs(ball.vx))
        : -Math.max(.18, Math.abs(ball.vx) * .8);
      ball.vy = Math.min(ball.vy, -.045);
      ball.glow = 1;
      return true;
    }

    function collideWithUpperSupportArc(ball) {
      if (!ball.live || ball.launchRail || ball.warpStage || ball.rightAcrylicStage) return;
      let previousBoard = upperSupportArcPoint(0);
      for (let i = 1; i <= 32; i++) {
        const currentBoard = upperSupportArcPoint(i / 32);
        const hit = collideBallWithUpperSupport(
          ball,
          { x: sx(previousBoard.x), y: sy(previousBoard.y) },
          { x: sx(currentBoard.x), y: sy(currentBoard.y) },
          Math.max(2.4, sx(upperLaunchGuide.supportArc.thickness))
        );
        if (hit) break;
        previousBoard = currentBoard;
      }

    }

    function pointInCanvasPolygon(point, polygon) {
      let inside = false;
      for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        const a = polygon[i];
        const b = polygon[j];
        if (((a.y > point.y) !== (b.y > point.y)) && point.x < (b.x - a.x) * (point.y - a.y) / ((b.y - a.y) || .0001) + a.x) inside = !inside;
      }
      return inside;
    }

    function guideBall(ball, dt) {
      // After the visible launch rail releases the ball, only a brief settling
      // impulse remains; nails and acrylic collisions determine the route.
      if (ball.age > 260) return;
      if (ball.rightShot) {
        ball.vx += .00034 * dt;
        ball.vy -= .00010 * dt;
      } else {
        ball.vx += .00012 * dt;
        ball.vy += .00020 * dt;
      }
    }

    function handlePocket(pocket, x, y) {
      if (pocket.type === "out") {
        burst(x, y, "#79889a", 8);
        return;
      }
      if (pocket.type === "attacker" && state.bonusActive) {
        handleBonusAttackerEntry(pocket, x, y);
        return;
      }
      state.wins++;
      const prize = pocket.type === "start" ? 5 : 15;
      state.balls += prize;
      state.balance += prize;
      state.payout += prize;
      burst(x, y, pocket.color, 18);
      if (pocket.type === "start") {
        queueStartSpin();
      }
      else if (pocket.type === "attacker") addLog(`<span class="hit">右アタッカー入賞 +${prize}</span>`);
      updateHud();
    }

    function handleRushStartEntry(x, y) {
      state.wins++;
      state.balls += rushStartPrize;
      state.balance += rushStartPrize;
      state.payout += rushStartPrize;
      burst(x, y, "#66e3ff", 20);
      const queued = queueStartSpin("RUSH START", false);
      if (queued) {
        message(`RUSH START入賞 保留${state.pendingStarts}/${maxHolds}`);
        addLog(`<span class="hit">RUSH START +${rushStartPrize}</span>`);
      } else {
        addLog(`RUSH START 保留満タン +${rushStartPrize}`);
      }
      updateHud();
    }

    function handleBonusAttackerEntry(pocket, x, y) {
      if (!state.bonusActive || state.bonusTotalRounds <= 0) return;
      state.wins++;
      state.bonusEntries++;
      state.balls += bonusPayoutPerEntry;
      state.balance += bonusPayoutPerEntry;
      state.payout += bonusPayoutPerEntry;
      burst(x, y, state.bonusEntries % 2 ? "#ff5b77" : "#66e3ff", 18);
      addLog(`<span class="hit">右アタッカー ${state.bonusEntries}/${bonusEntriesPerRound} +${bonusPayoutPerEntry}</span>`);

      if (state.bonusEntries < bonusEntriesPerRound) {
        message(`${state.mode} ${state.rounds + 1}/${state.bonusTotalRounds}R ${state.bonusEntries}/${bonusEntriesPerRound}`);
        updateHud();
        return;
      }

      state.rounds++;
      state.bonusEntries = 0;
      if (state.bonusKind === "initial" && state.rounds === state.bonusRevealAtRound) revealInitialRush();
      message(`${state.mode} ${state.rounds}/${state.bonusTotalRounds}R +${bonusPayoutPerRound}`);
      addLog(`<span class="hit">${state.rounds}R完了 +${bonusPayoutPerRound}</span>`);
      burst(x, y, state.rounds % 2 ? "#ff5b77" : "#66e3ff", 28);

      if (state.rounds >= state.bonusTotalRounds) {
        const finishedKind = state.bonusKind;
        finishBonus(finishedKind);
      }
      updateHud();
    }

    function queueStartSpin(source = "START", showStartBurst = true) {
      if (state.pendingStarts >= maxHolds) {
        pauseAutoForFullHold();
        updateHud();
        return false;
      }
      state.pendingStarts++;
      if (showStartBurst) burst(sx(pockets[0].x), sy(pockets[0].y + 20), "#66e3ff", 14);
      addLog(`${source}通過 保留+1 (${state.pendingStarts}/${maxHolds})`);
      if (state.pendingStarts >= maxHolds) pauseAutoForFullHold();
      processStartQueue();
      updateHud();
      return true;
    }

    function processStartQueue() {
      if (spinLock || state.bonusActive || state.pendingStarts <= 0) return;
      state.pendingStarts--;
      resumeAutoFromFullHold();
      startSpin();
    }

    function startSpin() {
      if (spinLock) {
        state.pendingStarts++;
        addLog("保留が満タン");
        return;
      }
      spinLock = true;
      state.spins++;
      state.sinceJackpotSpins++;
      message("図柄変動中");
      els.reels.forEach(r => r.classList.add("spin"));

      let ticks = 0;
      // SPEED x5 accelerates ball launching, not the display spin itself.
      // A real-machine-like 2.7 second spin lets START entries accumulate as holds.
      const spinTicks = 30;
      const spinInterval = 90;
      const interval = setInterval(() => {
        ticks++;
        els.reels.forEach(r => setReelSymbol(r, symbols[Math.floor(Math.random() * symbols.length)]));
        if (ticks >= spinTicks) {
          clearInterval(interval);
          settleSpin();
        }
      }, spinInterval);
      updateHud();
    }

    function settleSpin() {
      const hitChance = 1 / 400;
      const forced = consumeForceJackpotFlag();
      const hit = forced || Math.random() < hitChance;
      if (hit) {
        settleWinningLine();
      } else {
        const [a, b, c] = rollMissLine();
        setReelSymbols([a, b, c]);
        els.reels.forEach(r => r.classList.remove("spin"));
        message("惜しい、次の入賞へ");
        addLog(`ハズレ ${a}${b}${c}`);
      }
      spinLock = false;
      processStartQueue();
      updateHud();
    }

    function jackpot(symbol) {
      state.jackpots++;
      state.sinceJackpotSpins = 0;
      state.pendingRush = rollInitialRush(symbol);
      startBonus({
        rounds: 5,
        kind: "initial",
        title: `${symbol}${symbol}${symbol} 初当たり5R ${rushEntryHint(symbol)}`,
        revealAtRound: 4
      });
    }

    function settleSpin() {
      const rushActive = state.rushMode !== "none" && state.stRemaining > 0;
      if (rushActive) state.stRemaining--;
      const hitChance = rushActive ? rushSpinChance() : 1 / 400;
      const forced = consumeForceJackpotFlag();
      const hit = forced || Math.random() < hitChance;
      if (hit) {
        settleWinningLine();
      } else {
        const [a, b, c] = rollMissLine();
        setReelSymbols([a, b, c]);
        els.reels.forEach(r => r.classList.remove("spin"));
        if (rushActive && state.stRemaining <= 0) {
          resetToNormal("ST100回転終了 通常へ");
        } else if (rushActive) {
          state.mode = `${state.rushMode === "upper" ? "上位RUSH" : "RUSH"} ST${state.stRemaining}`;
          message(`${state.mode} 継続中`);
        } else {
          message("ハズレ、次の入賞へ");
        }
        addLog(`ハズレ ${a}${b}${c}`);
      }
      spinLock = false;
      processStartQueue();
      updateHud();
    }

    function rushSpinChance() {
      const totalChance = state.rushMode === "upper" ? .75 : .60;
      return 1 - Math.pow(1 - totalChance, 1 / 100);
    }

    function jackpot(symbol) {
      state.jackpots++;
      state.sinceJackpotSpins = 0;
      if (state.rushMode !== "none") {
        registerRushHit();
        startBonus({
          rounds: 10,
          kind: "rush",
          title: state.rushMode === "upper" ? "上位RUSH 10R" : `RUSH ${state.rushStreak}連 10R`
        });
        return;
      }
      state.pendingRush = rollInitialRush(symbol);
      startBonus({
        rounds: 5,
        kind: "initial",
        title: `${symbol}${symbol}${symbol} 初当たり5R ${rushEntryHint(symbol)}`,
        revealAtRound: 4
      });
    }

    function registerRushHit() {
      if (state.rushMode === "rush") {
        state.rushStreak++;
        if (state.rushStreak >= 5) {
          state.rushMode = "upper";
          state.mode = "上位RUSH";
          addLog(`<span class="hit">RUSH5連続 上位RUSH突入</span>`);
        }
      }
      state.stRemaining = 0;
    }

    function rollInitialRush(symbol) {
      const entryRate = initialRushEntryRates[symbol] ?? .50;
      const roll = Math.random();
      if (roll < Math.min(.01, entryRate)) return "upper";
      if (roll < entryRate) return "rush";
      return "none";
    }

    function startBonus({ rounds, kind, title, revealAtRound = 0 }) {
      clearInterval(state.bonusTimer);
      state.bonusTimer = null;
      state.rounds = 0;
      state.bonusActive = true;
      state.bonusKind = kind;
      state.bonusTotalRounds = rounds;
      state.bonusEntries = 0;
      state.bonusRevealAtRound = revealAtRound;
      state.feverUntil = 0;
      state.mode = kind === "rush" ? (state.rushMode === "upper" ? "上位RUSH BONUS" : "RUSH BONUS") : "初当たりBONUS";
      state.rightDeviceOpen = true;
      machine.classList.add("fever");
      startNormalSpeedBonusAuto();
      message(`${title} 右打ち`);
      addLog(`<span class="hit">${title} 開始</span>`);
      addLog(`1R ${bonusEntriesPerRound}入賞で${bonusPayoutPerRound}玉`);
      updateHud();
    }

    function startNormalSpeedBonusAuto() {
      state.speedMode = false;
      state.autoFire = true;
      state.holdPause = false;
      state.lastShotAt = 0;
      clearInterval(state.autoTimer);
      state.autoTimer = null;
      spawnBall();
      state.autoTimer = setInterval(spawnBall, fireIntervalMs());
      syncAutoUi();
    }

    function revealInitialRush() {
      if (state.pendingRush === "upper") {
        state.rushMode = "upper";
        state.rushStreak = 5;
        state.mode = "上位RUSH突入";
        message("4R告知 上位RUSH突入");
        addLog(`<span class="hit">4R告知: 上位RUSH突入</span>`);
      } else if (state.pendingRush === "rush") {
        state.rushMode = "rush";
        state.rushStreak = 0;
        state.mode = "RUSH突入";
        message("4R告知 RUSH突入");
        addLog(`<span class="hit">4R告知: RUSH突入</span>`);
      } else {
        state.rushMode = "none";
        state.rushStreak = 0;
        state.mode = "通常へ";
        message("4R告知 RUSHなし");
        addLog("4R告知: RUSHなし");
      }
      updateHud();
    }

    function clearBonusProgress() {
      state.bonusKind = "";
      state.bonusTotalRounds = 0;
      state.bonusEntries = 0;
      state.bonusRevealAtRound = 0;
    }

    function finishBonus(kind) {
      state.bonusActive = false;
      state.rightDeviceOpen = false;
      machine.classList.remove("fever");
      state.rounds = 0;
      clearBonusProgress();
      syncAutoUi();

      if (kind === "initial" && state.rushMode === "none") {
        resetToNormal("初当たり終了 通常へ");
        processStartQueue();
        return;
      }

      if (state.rushMode !== "none") {
        state.mode = state.rushMode === "upper" ? "上位RUSH" : "RUSH";
        message(`${state.mode} 継続抽選中`);
        updateHud();
        setTimeout(rollRushContinue, 900);
        return;
      }

      resetToNormal("通常へ");
    }

    function rollRushContinue() {
      if (state.rushMode === "none" || state.bonusActive) return;
      const chance = state.rushMode === "upper" ? .75 : .60;
      const hit = Math.random() < chance;
      if (!hit) {
        resetToNormal(`${state.mode}終了 通常へ`);
        return;
      }
      if (state.rushMode === "rush") {
        state.rushStreak++;
        if (state.rushStreak >= 5) {
          state.rushMode = "upper";
          state.mode = "上位RUSH";
          addLog(`<span class="hit">RUSH5連続 上位RUSH突入</span>`);
        }
      }
      state.jackpots++;
      startBonus({
        rounds: 10,
        kind: "rush",
        title: state.rushMode === "upper" ? "上位RUSH 10R" : `RUSH ${state.rushStreak}連 10R`
      });
    }

    function finishBonus(kind) {
      state.bonusActive = false;
      state.rightDeviceOpen = false;
      machine.classList.remove("fever");
      state.rounds = 0;
      clearBonusProgress();
      syncAutoUi();

      if (kind === "initial" && state.rushMode === "none") {
        resetToNormal("初当たり終了 通常へ");
        processStartQueue();
        return;
      }

      if (state.rushMode !== "none") {
        enterRushSt();
        return;
      }

      resetToNormal("通常へ");
    }

    function enterRushSt() {
      state.stRemaining = 100;
      state.mode = `${state.rushMode === "upper" ? "上位RUSH" : "RUSH"} ST100`;
      message(`${state.mode} 開始`);
      addLog(`<span class="hit">${state.mode} 開始</span>`);
      syncAutoUi();
      updateHud();
      processStartQueue();
    }

    function resetToNormal(text) {
      state.mode = "通常";
      state.rushMode = "none";
      state.rushStreak = 0;
      state.stRemaining = 0;
      state.pendingRush = "none";
      state.bonusActive = false;
      state.rightDeviceOpen = false;
      state.feverUntil = 0;
      state.rounds = 0;
      clearBonusProgress();
      machine.classList.remove("fever");
      message(text);
      addLog(text);
      syncAutoUi();
      updateHud();
      processStartQueue();
    }

    function draw() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      ctx.clearRect(0, 0, w, h);

      drawCabinetShell(w, h);

      ctx.save();
      ctx.beginPath();
      playfieldPath(playfieldShape());
      ctx.clip();
      drawPlayfieldBackground(w, h);

      ctx.strokeStyle = "rgba(255,255,255,.18)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      playfieldPath(playfieldShape(), -Math.max(34, w * .055));
      ctx.stroke();

      drawBoardOrnaments(w, h);
      drawAcrylicParts(w, h);
      drawBalls(ball => Boolean(ball.launchRail));
      drawBalls(ball => Boolean(ball.warpStage));
      drawWarpStage(w, h);
      drawBalls(ball => Boolean(ball.rightAcrylicStage));
      drawRushStartClaw(w, h);
      drawRightAcrylicChute(w, h);
      drawRightDevice(w, h);
      drawRightAcrylicRushBranch(w, h);
      drawPockets();
      drawPins();
      drawPinEditorOverlay(w, h);
      drawBalls(ball => !ball.launchRail && !ball.rightAcrylicStage && !ball.warpStage);
      drawUpperSupportArc(w, h);
      drawWindmill(sx(hitAreas.windmill.x), sy(hitAreas.windmill.y), hitAreas.windmill.r / 720 * w);
      drawRightRouteLogo(w, h);
      drawParticles();
      drawPlayfieldDebugOverlay(w, h);
      ctx.restore();

      drawPushButton(w, h);
      drawCabinetDebugOverlay(w, h);
    }

    function drawCabinetShell(w, h) {
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, "#30333a");
      grad.addColorStop(.32, "#10151d");
      grad.addColorStop(.68, "#070a0f");
      grad.addColorStop(1, "#1b0507");
      ctx.fillStyle = grad;
      roundRect(0, 0, w, h, Math.max(28, w * .065));
      ctx.fill();

      ctx.save();
      ctx.strokeStyle = "rgba(255, 61, 73, .50)";
      ctx.lineWidth = Math.max(5, w * .010);
      ctx.beginPath();
      ctx.moveTo(w * .06, h * .79);
      ctx.bezierCurveTo(w * .28, h * .84, w * .70, h * .84, w * .94, h * .78);
      ctx.stroke();
      ctx.strokeStyle = "rgba(255, 181, 62, .42)";
      ctx.lineWidth = Math.max(3, w * .006);
      ctx.beginPath();
      ctx.moveTo(w * .13, h * .08);
      ctx.bezierCurveTo(w * .30, h * .02, w * .72, h * .02, w * .87, h * .10);
      ctx.stroke();
      ctx.restore();

      const bezel = ctx.createRadialGradient(w * .50, h * .46, w * .20, w * .50, h * .47, w * .58);
      bezel.addColorStop(0, "rgba(255,255,255,.08)");
      bezel.addColorStop(.60, "rgba(0,0,0,.20)");
      bezel.addColorStop(1, "rgba(0,0,0,.56)");
      ctx.fillStyle = bezel;
      ctx.beginPath();
      playfieldPath(playfieldShape(), Math.max(8, w * .014));
      ctx.fill();

      ctx.strokeStyle = "rgba(255,255,255,.16)";
      ctx.lineWidth = Math.max(6, w * .012);
      ctx.beginPath();
      playfieldPath(playfieldShape(), Math.max(4, w * .008));
      ctx.stroke();

      const lower = ctx.createLinearGradient(0, h * .78, 0, h);
      lower.addColorStop(0, "rgba(255,255,255,.05)");
      lower.addColorStop(1, "rgba(0,0,0,.42)");
      ctx.fillStyle = lower;
      roundRect(w * .055, h * .80, w * .89, h * .17, Math.max(28, w * .055));
      ctx.fill();

      const led = ctx.createLinearGradient(0, h * .84, 0, h * .96);
      led.addColorStop(0, "rgba(120, 0, 12, .86)");
      led.addColorStop(.5, "rgba(18, 0, 4, .94)");
      led.addColorStop(1, "rgba(255, 42, 58, .60)");
      ctx.fillStyle = led;
      roundRect(w * .24, h * .845, w * .52, h * .105, Math.max(10, w * .018));
      ctx.fill();
      ctx.strokeStyle = "rgba(255, 55, 70, .85)";
      ctx.lineWidth = Math.max(2, w * .005);
      roundRect(w * .24, h * .845, w * .52, h * .105, Math.max(10, w * .018));
      ctx.stroke();
      ctx.save();
      ctx.shadowColor = "rgba(255, 45, 60, .85)";
      ctx.shadowBlur = Math.max(8, w * .018);
      ctx.fillStyle = "rgba(255, 46, 64, .92)";
      ctx.font = `900 ${Math.max(30, w * .080)}px "Orbitron", "Segoe UI", sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("119", w * .50, h * .900);
      ctx.restore();
    }

    function drawPlayfieldBackground(w, h) {
      const bg = ctx.createRadialGradient(w * .50, h * .42, w * .08, w * .50, h * .48, w * .60);
      bg.addColorStop(0, "#43200d");
      bg.addColorStop(.24, "#180c10");
      bg.addColorStop(.62, "#071019");
      bg.addColorStop(1, "#030508");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      if (rescueBackgroundReady) {
        ctx.save();
        ctx.globalAlpha = .90;
        ctx.drawImage(rescueBackgroundImage, 0, 0, w, h);
        ctx.restore();

        const imageShade = ctx.createLinearGradient(0, 0, 0, h);
        imageShade.addColorStop(0, "rgba(1, 7, 16, .08)");
        imageShade.addColorStop(.48, "rgba(1, 7, 16, .14)");
        imageShade.addColorStop(1, "rgba(1, 7, 16, .28)");
        ctx.fillStyle = imageShade;
        ctx.fillRect(0, 0, w, h);
      } else {
        const heat = ctx.createLinearGradient(w * .10, h * .12, w * .90, h * .70);
        heat.addColorStop(0, "rgba(255, 181, 35, .30)");
        heat.addColorStop(.28, "rgba(255, 71, 31, .30)");
        heat.addColorStop(.50, "rgba(4, 255, 137, .12)");
        heat.addColorStop(.78, "rgba(255, 150, 23, .26)");
        heat.addColorStop(1, "rgba(255, 0, 60, .18)");
        ctx.fillStyle = heat;
        ctx.fillRect(0, 0, w, h);

        ctx.save();
        ctx.globalCompositeOperation = "screen";
        for (let i = 0; i < 18; i++) {
          const t = i / 17;
          const y = h * (.17 + .50 * t);
          const hue = i % 3 === 0 ? "rgba(255, 202, 56, .42)" : i % 3 === 1 ? "rgba(23, 238, 128, .28)" : "rgba(255, 64, 45, .32)";
          ctx.strokeStyle = hue;
          ctx.lineWidth = Math.max(2, w * (.005 + (i % 4) * .0015));
          ctx.beginPath();
          ctx.moveTo(w * (.06 + .03 * (i % 2)), y);
          ctx.bezierCurveTo(w * .28, y - h * (.08 + .03 * Math.sin(i)), w * .58, y + h * (.10 - .04 * Math.cos(i)), w * .92, y - h * .04);
          ctx.stroke();
        }
        ctx.restore();
      }

      const plate = ctx.createLinearGradient(0, h * .08, 0, h * .90);
      plate.addColorStop(0, "rgba(255,255,255,.12)");
      plate.addColorStop(.42, "rgba(255,255,255,.03)");
      plate.addColorStop(1, "rgba(0,0,0,.26)");
      ctx.fillStyle = plate;
      ctx.fillRect(0, 0, w, h);
    }

    function drawFrontGlass(w, h) {
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      ctx.strokeStyle = "rgba(255,255,255,.18)";
      ctx.lineWidth = Math.max(2, w * .004);
      ctx.beginPath();
      ctx.moveTo(w * .16, h * .12);
      ctx.bezierCurveTo(w * .36, h * .05, w * .68, h * .09, w * .86, h * .20);
      ctx.stroke();

      const shine = ctx.createLinearGradient(w * .05, h * .12, w * .38, h * .48);
      shine.addColorStop(0, "rgba(255,255,255,.16)");
      shine.addColorStop(.36, "rgba(255,255,255,.05)");
      shine.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = shine;
      roundRect(w * .05, h * .10, w * .26, h * .42, 16);
      ctx.fill();
      ctx.restore();
    }

    function drawAcrylicFrame(w, h) {
      ctx.save();
      const field = playfieldShape();
      const frameGrad = ctx.createLinearGradient(0, 0, w, h);
      frameGrad.addColorStop(0, "rgba(255,255,255,.30)");
      frameGrad.addColorStop(.36, "rgba(178,235,255,.08)");
      frameGrad.addColorStop(.72, "rgba(255,255,255,.04)");
      frameGrad.addColorStop(1, "rgba(102,227,255,.18)");
      ctx.strokeStyle = frameGrad;
      ctx.lineWidth = Math.max(10, w * .022);
      ctx.beginPath();
      playfieldPath(field, Math.max(8, w * .014));
      ctx.stroke();

      ctx.strokeStyle = "rgba(255,255,255,.28)";
      ctx.lineWidth = Math.max(2, w * .004);
      ctx.beginPath();
      playfieldPath(field, -Math.max(4, w * .008));
      ctx.stroke();

      ctx.strokeStyle = "rgba(102,227,255,.16)";
      ctx.lineWidth = Math.max(3, w * .006);
      ctx.beginPath();
      playfieldPath(field, -Math.max(22, w * .038));
      ctx.stroke();

      const shine = ctx.createLinearGradient(w * .12, h * .08, w * .44, h * .34);
      shine.addColorStop(0, "rgba(255,255,255,.30)");
      shine.addColorStop(.44, "rgba(255,255,255,.08)");
      shine.addColorStop(1, "rgba(255,255,255,0)");
      ctx.strokeStyle = shine;
      ctx.lineWidth = Math.max(4, w * .008);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(w * .12, h * .13);
      ctx.bezierCurveTo(w * .20, h * .07, w * .35, h * .08, w * .47, h * .15);
      ctx.stroke();

    function playfieldPath(field, offset = 0) {
      const rx = field.rx + offset;
      const ry = field.ry + offset;
      const exponent = field.exponent || 2;
      const curvePower = 2 / exponent;
      const steps = 72;
      for (let i = 0; i <= steps; i++) {
        const angle = -Math.PI / 2 + Math.PI * 2 * i / steps;
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        const x = field.x + rx * Math.sign(cos) * Math.pow(Math.abs(cos), curvePower);
        const y = field.y + ry * Math.sign(sin) * Math.pow(Math.abs(sin), curvePower);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
    }
