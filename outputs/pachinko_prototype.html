<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パチンコ救急隊</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7fbff;
      --muted: #a9b7c6;
      --panel: rgba(10, 18, 26, .82);
      --line: rgba(255, 255, 255, .16);
      --gold: #ffd36a;
      --cyan: #66e3ff;
      --rose: #ff6f9f;
      --bg: #080d12;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 18% 20%, rgba(102, 227, 255, .20), transparent 26rem),
        linear-gradient(145deg, #0c1117 0%, #13171d 44%, #080d12 100%);
      color: var(--ink);
      font-family: "Segoe UI", "Noto Sans JP", system-ui, sans-serif;
      letter-spacing: 0;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: min(1320px, calc(100vw - 16px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 16px 0;
      display: grid;
      grid-template-columns: minmax(360px, 840px) minmax(260px, 360px);
      gap: 12px;
      align-items: stretch;
    }

    .machine {
      position: relative;
      height: min(980px, calc(100vh - 20px));
      min-height: 760px;
      transform-origin: center top;
      transition: transform .24s ease, height .24s ease;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 42px 42px 28px 28px;
      background:
        radial-gradient(ellipse at 50% 96%, rgba(255, 42, 58, .22), transparent 22%),
        radial-gradient(ellipse at 12% 48%, rgba(255,255,255,.12), transparent 20%),
        radial-gradient(ellipse at 88% 48%, rgba(255,255,255,.12), transparent 20%),
        radial-gradient(ellipse at 50% 40%, rgba(102, 227, 255, .14), transparent 42%),
        radial-gradient(ellipse at 50% 8%, rgba(255, 255, 255, .18), transparent 28%),
        linear-gradient(160deg, rgba(255, 255, 255, .12), transparent 24%),
        linear-gradient(22deg, rgba(255, 211, 106, .08), transparent 52%),
        #121923;
      box-shadow:
        0 22px 70px rgba(0, 0, 0, .46),
        inset 0 0 0 5px rgba(255, 255, 255, .05),
        inset 0 0 0 18px rgba(0, 0, 0, .14);
      overflow: hidden;
    }

    .machine::before,
    .machine::after {
      content: "";
      position: absolute;
      pointer-events: none;
      z-index: 3;
      display: block;
    }

    .machine::before {
      inset: 118px 52px 174px;
      border-radius: 48% 48% 44% 44% / 38% 38% 46% 46%;
      border: 1px solid rgba(210, 244, 255, .24);
      background:
        linear-gradient(112deg, rgba(255, 255, 255, .24), transparent 18%, transparent 68%, rgba(102, 227, 255, .10)),
        linear-gradient(24deg, transparent 28%, rgba(255, 255, 255, .08) 29%, transparent 34%);
      box-shadow:
        inset 0 0 0 9px rgba(255, 255, 255, .035),
        inset 0 0 38px rgba(180, 240, 255, .12),
        0 0 32px rgba(102, 227, 255, .08);
      mix-blend-mode: screen;
    }

    .machine::after {
      left: 20%;
      right: 20%;
      top: 138px;
      height: 18%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, .22), transparent 72%);
      filter: blur(.2px);
      opacity: .42;
      mix-blend-mode: screen;
    }

    .marquee {
      position: absolute;
      inset: 12px 12px auto;
      height: 72px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(6, 10, 15, .74);
      z-index: 4;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 4.8vw, 42px);
      line-height: 1;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 18px rgba(102, 227, 255, .46), 0 2px 0 #000;
    }

    .status {
      display: grid;
      grid-template-columns: repeat(3, auto);
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .pill {
      display: inline-grid;
      grid-auto-flow: column;
      gap: 6px;
      align-items: center;
      min-height: 30px;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .06);
    }

    .pill strong {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    canvas {
      position: absolute;
      inset: 122px 62px 176px;
      width: calc(100% - 124px);
      height: calc(100% - 298px);
      border-radius: 46% 46% 38% 38% / 34% 34% 44% 44%;
      background:
        radial-gradient(circle at center 42%, rgba(102, 227, 255, .10), transparent 34%),
        linear-gradient(#162334, #0b1118 70%);
      box-shadow:
        inset 0 0 38px rgba(0, 0, 0, .64),
        inset 0 0 0 12px rgba(255, 255, 255, .025),
        inset 0 0 34px rgba(180, 240, 255, .09);
      touch-action: none;
    }


    .machine.overview canvas,
    .machine.overview .screen {
      transition: inset .24s ease, width .24s ease, height .24s ease, left .24s ease, top .24s ease;
    }

    .machine.board-zoom canvas {
      inset: 96px 12px 12px;
      width: calc(100% - 24px);
      height: calc(100% - 108px);
      border-radius: 40px 40px 24px 24px;
    }

    .machine.board-zoom .machine-part,
    .machine.board-zoom .zoom-controls {
      opacity: .10;
      pointer-events: none;
    }

    .machine-part {
      position: absolute;
      pointer-events: none;
      z-index: 2;
      transition: opacity .22s ease;
    }

    .side-speaker {
      top: 108px;
      bottom: 156px;
      width: 38px;
      border-radius: 20px;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.18) 0 2px, transparent 2px 8px),
        linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.52));
      box-shadow: inset 0 0 0 3px rgba(0,0,0,.44), inset 0 0 18px rgba(102,227,255,.14);
      opacity: .82;
    }

    .side-speaker.left { left: 10px; }
    .side-speaker.right { right: 10px; }

    .top-crown {
      left: 8%;
      right: 8%;
      top: 6px;
      height: 88px;
      border-radius: 28px 28px 16px 16px;
      background:
        radial-gradient(circle at 18% 42%, rgba(255,219,84,.58), transparent 18%),
        radial-gradient(circle at 82% 42%, rgba(255,73,96,.48), transparent 18%),
        linear-gradient(180deg, rgba(255,255,255,.16), rgba(8,11,17,.92));
      box-shadow: inset 0 0 0 4px rgba(255, 150, 40, .28), 0 8px 24px rgba(0,0,0,.42);
      z-index: 1;
    }

    .lower-tray {
      left: 7%;
      right: 7%;
      bottom: 18px;
      height: 128px;
      border-radius: 22px 22px 42px 42px;
      background:
        radial-gradient(ellipse at 50% 28%, rgba(255,255,255,.28), transparent 28%),
        linear-gradient(180deg, rgba(255, 48, 62, .72), rgba(10, 9, 13, .95) 44%, rgba(0,0,0,.86));
      box-shadow: inset 0 0 0 5px rgba(255,255,255,.06), 0 -5px 22px rgba(255, 45, 60, .22);
      z-index: 1;
    }

    .ball-tray {
      left: 24%;
      right: 24%;
      bottom: 78px;
      height: 48px;
      border-radius: 0 0 28px 28px;
      background:
        radial-gradient(ellipse at 50% 8%, rgba(255,255,255,.72), rgba(255,211,106,.28) 34%, transparent 62%),
        linear-gradient(180deg, rgba(255,255,255,.12), rgba(0,0,0,.54));
      box-shadow: inset 0 -8px 18px rgba(0,0,0,.44);
      z-index: 3;
    }

    .zoom-controls {
      position: absolute;
      left: 18px;
      bottom: 82px;
      z-index: 7;
      display: grid;
      grid-template-columns: repeat(2, minmax(84px, auto));
      gap: 8px;
      transition: opacity .22s ease;
    }

    .view-btn {
      min-height: 34px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 8px;
      color: #f8fbff;
      background: rgba(6,10,15,.78);
      font-weight: 900;
      cursor: pointer;
    }

    .view-btn.active {
      border-color: rgba(255,211,106,.72);
      background: linear-gradient(180deg, #ffd36a, #c9701d);
      color: #130b05;
    }
    .launch-handle {
      position: absolute;
      right: 16px;
      bottom: 72px;
      z-index: 5;
      width: clamp(104px, 14vw, 136px);
      aspect-ratio: 1;
      border: 0;
      border-radius: 50%;
      background: transparent;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .45);
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .launch-handle::before {
      content: "";
      position: absolute;
      inset: -8%;
      z-index: 0;
      border-radius: 50%;
      background: url("pachinko_rescue_launch_handle_v1.png") center / contain no-repeat;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, .62));
      pointer-events: none;
    }

    .launch-handle:active,
    .launch-handle.active {
      cursor: grabbing;
      box-shadow: 0 0 34px rgba(102, 227, 255, .44), 0 12px 30px rgba(0, 0, 0, .45);
    }

    .launch-handle.active::before {
      filter: brightness(1.12) saturate(1.12) drop-shadow(0 0 12px rgba(102, 227, 255, .62));
    }

    .handle-knob {
      display: none;
    }

    .handle-needle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 9%;
      height: 39%;
      border-radius: 999px;
      transform: translate(-50%, -92%) rotate(0deg);
      transform-origin: 50% 92%;
      background: linear-gradient(#fff4c2, #ffb337);
      box-shadow: 0 0 16px rgba(255, 211, 106, .55);
      z-index: 2;
    }

    .handle-center {
      display: none;
    }

    .handle-power {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      min-width: 54px;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .58);
      border: 1px solid rgba(255, 255, 255, .18);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      z-index: 3;
      text-align: center;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }

    .handle-adjust {
      position: absolute;
      left: 50%;
      bottom: 29px;
      z-index: 4;
      width: 70%;
      height: 14px;
      transform: translateX(-50%);
      accent-color: #66e3ff;
      cursor: ew-resize;
      touch-action: pan-x;
    }

    .handle-adjust::-webkit-slider-runnable-track {
      height: 5px;
      border: 1px solid rgba(255,255,255,.34);
      border-radius: 999px;
      background: linear-gradient(90deg, #66e3ff 0 68%, #ff5262 68% 100%);
      box-shadow: 0 0 8px rgba(72, 224, 255, .48);
    }

    .handle-adjust::-webkit-slider-thumb {
      width: 15px;
      height: 15px;
      margin-top: -6px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: #ffd36a;
      box-shadow: 0 0 8px rgba(255, 211, 106, .72);
      appearance: none;
    }

    .side {
      height: min(900px, calc(100vh - 32px));
      min-height: 720px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 12px;
      overflow: hidden;
    }

    .screen,
    .controls,
    .history,
    .meters {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 16px 42px rgba(0, 0, 0, .30);
    }

    .screen {
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .machine .screen {
      position: absolute;
      left: calc(12px + (100% - 24px) * 244 / 720);
      top: calc(96px + (100% - 108px) * 318 / 900);
      z-index: 4;
      width: calc((100% - 24px) * 232 / 720);
      height: calc((100% - 108px) * 174 / 900);
      padding: 0;
      transform: none;
      cursor: zoom-in;
      transition: width .22s ease, height .22s ease, left .22s ease, top .22s ease, transform .22s ease, box-shadow .22s ease;
    }

    .machine.board-zoom .screen {
      left: calc(12px + (100% - 24px) * 244 / 720);
      top: calc(96px + (100% - 108px) * 318 / 900);
      width: calc((100% - 24px) * 232 / 720);
      height: calc((100% - 108px) * 174 / 900);
    }

    .machine .screen.zoomed {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 30;
      width: min(860px, calc(100vw - 28px));
      height: auto;
      padding: 10px;
      max-height: calc(100vh - 28px);
      transform: translate(-50%, -50%);
      cursor: zoom-out;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, .62), 0 18px 80px rgba(102, 227, 255, .30);
    }

    .machine .screen .message {
      display: none;
    }

    .machine .screen.zoomed .message {
      min-height: 42px;
      font-size: 18px;
    }

    .lcd {
      min-height: 178px;
      border-radius: 8px;
      border: 1px solid rgba(102, 227, 255, .32);
      background:
        linear-gradient(135deg, rgba(102, 227, 255, .18), transparent 42%),
        radial-gradient(circle at 74% 18%, rgba(255, 111, 159, .16), transparent 34%),
        #08131d;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }

    .machine .lcd {
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    .machine .screen.zoomed .lcd {
      min-height: min(48vh, 430px);
    }

    .lcd::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, .055) 1px, transparent 1px, transparent 5px);
      pointer-events: none;
      opacity: .45;
    }

    .reels {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, 72px);
      gap: 8px;
    }

    .reel {
      height: 92px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, .24);
      background-color: #050a14;
      background-image: url("pachinko_rescue_reel_symbols_v2.png");
      background-repeat: no-repeat;
      background-size: 300% 300%;
      background-position: var(--symbol-x, 50%) var(--symbol-y, 50%);
      color: transparent;
      display: grid;
      place-items: center;
      box-shadow: inset 0 -8px 18px rgba(0, 0, 0, .18);
      overflow: hidden;
    }

    .reel.spin {
      animation: flick .16s steps(2) infinite;
    }

    @keyframes flick {
      50% {
        filter: hue-rotate(90deg) brightness(1.25);
        transform: translateY(1px);
      }
    }

    .message {
      min-height: 44px;
      color: var(--ink);
      font-weight: 800;
      text-align: center;
      line-height: 1.35;
    }

    .controls {
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .handle-row {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      gap: 10px;
      align-items: center;
    }

    .handle-row {
      display: none;
    }

    .icon-btn,
    .main-btn {
      border: 1px solid rgba(255, 255, 255, .20);
      border-radius: 8px;
      color: var(--ink);
      background: linear-gradient(180deg, rgba(255, 255, 255, .13), rgba(255, 255, 255, .04));
      cursor: pointer;
      user-select: none;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    .main-btn {
      min-height: 54px;
      font-size: 18px;
      font-weight: 900;
      background: linear-gradient(180deg, #ffd36a, #d48219);
      color: #1f1300;
      box-shadow: 0 8px 22px rgba(255, 160, 51, .24);
    }

    .speed-btn {
      min-height: 42px;
      border: 1px solid rgba(255, 255, 255, .20);
      border-radius: 8px;
      color: var(--ink);
      background: linear-gradient(180deg, rgba(102, 227, 255, .20), rgba(255, 255, 255, .05));
      cursor: pointer;
      font-weight: 900;
    }

    .speed-btn.active {
      border-color: rgba(255, 211, 106, .70);
      background: linear-gradient(180deg, #66e3ff, #287eb2);
      color: #031019;
      box-shadow: 0 0 24px rgba(102, 227, 255, .25);
    }

    .main-btn:active,
    .icon-btn:active,
    .speed-btn:active {
      transform: translateY(1px);
    }

    .pin-tools {
      display: grid;
      gap: 8px;
    }

    #multiMove,
    #addAcrylic,
    #addCurve {
      display: none;
    }

    .pin-tools-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .pin-tools select,
    .pin-tools textarea {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, .20);
      border-radius: 8px;
      background: rgba(6, 10, 15, .72);
      color: var(--ink);
      padding: 8px;
    }

    .pin-tools textarea {
      min-height: 96px;
      resize: vertical;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 11px;
    }

    .range {
      width: 100%;
      accent-color: var(--gold);
    }

    .setting-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      background: rgba(255, 255, 255, .055);
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .setting-row output {
      color: var(--gold);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .meters {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .meter {
      min-height: 58px;
      padding: 9px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .055);
      border: 1px solid rgba(255, 255, 255, .10);
    }

    .meter span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .meter strong {
      display: block;
      margin-top: 3px;
      font-size: 22px;
      font-variant-numeric: tabular-nums;
    }

    .history {
      padding: 12px;
      overflow: hidden;
    }

    .history h2 {
      margin: 0 0 8px;
      font-size: 15px;
    }

    .log {
      height: 100%;
      min-height: 0;
      max-height: none;
      overflow: auto;
      display: grid;
      align-content: start;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .log p {
      margin: 0;
      padding: 7px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, .045);
    }

    .hit {
      color: var(--gold);
    }

    .fever {
      animation: fever 1.1s ease-in-out infinite;
    }

    @keyframes fever {
      50% {
        box-shadow: 0 0 38px rgba(255, 211, 106, .62), inset 0 0 38px rgba(255, 111, 159, .34);
      }
    }

    @media (max-width: 860px) {
      .app {
        grid-template-columns: 1fr;
      }

      .machine {
        height: 680px;
        min-height: 680px;
      }

      .side {
        height: auto;
        min-height: auto;
        overflow: visible;
      }

      .machine .screen {
        width: calc((100% - 24px) * 232 / 720);
      }
    }

    @media (max-width: 560px) {
      .app {
        width: min(100vw - 14px, 1180px);
        padding: 7px 0;
        gap: 8px;
      }

      .machine {
        height: 610px;
        min-height: 610px;
      }

      .marquee {
        height: 86px;
        grid-template-columns: 1fr;
        gap: 6px;
        align-content: center;
      }

      .status {
        grid-template-columns: repeat(3, 1fr);
        font-size: 11px;
      }

      .pill {
        min-width: 0;
        justify-content: center;
        padding-inline: 5px;
      }

      canvas {
        inset: 112px 44px 148px;
        width: calc(100% - 88px);
        height: calc(100% - 260px);
      }

      .launch-handle {
        right: 16px;
        bottom: 16px;
        width: 108px;
      }

      .machine .screen {
        left: calc(44px + (100% - 88px) * 244 / 720);
        top: calc(112px + (100% - 260px) * 318 / 900);
        width: calc((100% - 88px) * 232 / 720);
        height: calc((100% - 260px) * 174 / 900);
        padding: 0;
      }

      .machine.board-zoom .screen {
        left: calc(12px + (100% - 24px) * 244 / 720);
        top: calc(96px + (100% - 108px) * 318 / 900);
        width: calc((100% - 24px) * 232 / 720);
        height: calc((100% - 108px) * 174 / 900);
      }

      .machine .screen.zoomed {
        width: calc(100vw - 18px);
      }

      .reels {
        grid-template-columns: repeat(3, minmax(58px, 68px));
      }

      .reel {
        height: 82px;
        font-size: 36px;
      }
    }

    /* Fixed playfield contract: resizing the browser may reveal scrollbars,
       but it never changes physics coordinates or the nail gauge. */
    html,
    body {
      overflow-x: auto;
    }

    .app {
      width: 1224px;
      min-width: 1224px;
      grid-template-columns: 844px 360px;
      align-items: start;
    }

    .machine {
      width: 844px;
      min-width: 844px;
      height: 1198px;
      min-height: 1198px;
    }

    .machine.board-zoom {
      width: 744px;
      min-width: 744px;
      height: 1008px;
      min-height: 1008px;
    }

    .machine.board-zoom .zoom-controls {
      opacity: 1;
      pointer-events: auto;
    }

    .machine canvas {
      inset: 122px auto auto 62px;

      const line = (x1, y1, x2, y2, count, kind = "normal", r = 3.1) => {
        const length = Math.hypot(x2 - x1, y2 - y1);
        const safeCount = Math.min(count, Math.max(2, Math.floor(length / 30) + 1));
        for (let i = 0; i < safeCount; i++) {
          const t = safeCount === 1 ? 0 : i / (safeCount - 1);
          add(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, kind, r);
